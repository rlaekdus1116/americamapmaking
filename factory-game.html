<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>초국적기업 입지 전략게임</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><style>
:root{--ink:#173750;--sub:#597286;--blue:#256b9b;--sky:#e7f4fc;--mint:#dff5e9;--line:#d6e4ed;--bg:#f3f8fc;--white:#fff;--orange:#fff0d4;--red:#a83948}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e5f5ff,#f7f3ff 50%,#e2f8ef);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink)}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:#ffffffdf;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}h1{font-size:20px;margin:0}#conn{font-size:12px;color:var(--sub)}main{max-width:1120px;margin:14px auto;padding:0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 28px #31577612}h2{font-size:22px;margin:0 0 6px}p{line-height:1.5}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.progress{display:flex;gap:6px}.pill{border-radius:999px;padding:6px 10px;background:var(--sky);font-weight:800;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.company{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfdff}.company h3{margin:0 0 4px}.note{font-size:13px;color:var(--sub)}button,select,input,textarea{font:inherit}button{background:var(--blue);color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer;min-height:42px}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#eaf3f8;color:var(--ink);border:1px solid var(--line)}input,select,textarea{border:1px solid #b8cddd;border-radius:9px;padding:10px;width:100%;color:var(--ink);background:white}textarea{min-height:68px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.candidate{border:1px solid var(--line);border-radius:12px;padding:10px;background:white}.candidate h4{margin:0 0 4px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.score{font-size:12px;background:#f2f7fa;border-radius:8px;padding:6px}.score b{display:block;font-size:15px}.wide{grid-column:1/-1}.hidden{display:none!important}.banner{padding:10px;border-radius:10px;background:var(--orange);font-weight:700}.result{background:var(--mint);padding:11px;border-radius:10px}.bar{height:8px;border-radius:5px;background:#edf2f5;overflow:hidden}.bar i{display:block;height:100%;background:#3994c1}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.teacher table{width:100%;border-collapse:collapse}.teacher th,.teacher td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:13px}.impact{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.impact article{background:#f6fafc;border-radius:11px;padding:9px}.impact h4{margin:0 0 4px;font-size:14px}.danger{color:var(--red)}@media(max-width:700px){header{height:52px;padding:7px 12px}h1{font-size:16px}main{margin:8px auto}.card{padding:12px}.grid{grid-template-columns:1fr}.impact{grid-template-columns:1fr 1fr}.wide{grid-column:auto}.scores{grid-template-columns:repeat(3,1fr)}h2{font-size:19px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><header><h1>🌎 초국적기업 입지 전략게임</h1><span id="conn">연결 중…</span></header><main><section id="join" class="card"><h2>긴급 이사회 소집</h2><p>여러분은 세계 시장에 진출한 기업의 입지전략팀입니다. 세 회사의 공장 후보지를 예측하고, 자료를 비교해 직접 결정하세요.</p><div class="row"><input id="studentName" placeholder="이름 또는 별명"><button id="enter">전략회의 입장</button></div><p class="note">같은 반 학생은 같은 방 주소로 접속해야 공장 부지 선점 현황을 함께 볼 수 있어요.</p></section><section id="game" class="hidden"><div class="top"><div><h2 id="title"></h2><div id="subtitle" class="note"></div></div><div class="progress" id="progress"></div></div><div id="content" class="grid"></div><div class="toolbar"><button id="back" class="secondary">← 이전 기업</button><span id="saveState" class="note"></span><button id="next">다음 기업 →</button></div></section><section id="teacher" class="card teacher hidden"><h2>교사용 · 학생 결정 현황</h2><p class="note">학생별 공장 입지와 영향 평가가 제출되는 대로 표시됩니다.</p><div id="roster"></div></section></main>
<script>
const params=new URLSearchParams(location.search),ROOM=params.get('room')||'demo',TEACHER=params.get('mode')==='teacher';
const PROJECT_ID='americamapmaking',DATABASE_URL='https://americamapmaking-default-rtdb.firebaseio.com',path='rooms/'+encodeURIComponent(ROOM).replace(/\./g,'%2E')+'/v8/factoryGame';
const companies=[
 {id:'shoe',name:'운동화 기업',product:'세계 여러 지역에서 운동화를 만들어 북미 시장에 판매합니다.',weights:{labor:5,material:4,market:2,transport:4,skill:1,resource:2}},
 {id:'car',name:'전기차 기업',product:'배터리와 부품을 조달해 전기차를 조립하고 북미 시장에 공급합니다.',weights:{labor:2,material:5,market:4,transport:4,skill:5,resource:2}},
 {id:'drink',name:'음료 기업',product:'지역 농산물과 물을 이용해 음료를 생산하고 여러 나라에 판매합니다.',weights:{labor:2,material:5,market:4,transport:3,skill:1,resource:5}}
];
const factors=[['labor','노동력·임금'],['material','원료·부품'],['market','시장'],['transport','교통·운송'],['skill','기술·인재'],['resource','물·전력']];
// Classroom simulation indices (1–5), not national statistics. Replace with dated sourced data before formal assessment.
const regions=[
 {id:'mexico',name:'멕시코',scores:{labor:4,material:3,market:4,transport:5,skill:3,resource:3},why:'북미 시장과 가까우며 도로·항만 연결이 좋아요. 임금은 상대적으로 낮지만 지역별 물 공급 차이를 살펴야 해요.'},
 {id:'brazil',name:'브라질',scores:{labor:3,material:5,market:4,transport:3,skill:3,resource:4},why:'농산물과 큰 내수 시장이 강점이에요. 국토가 넓어 공장과 항만 사이 물류를 따져야 해요.'},
 {id:'chile',name:'칠레',scores:{labor:3,material:4,market:2,transport:4,skill:4,resource:2},why:'항만과 광물 공급망, 기술 인력이 강점이에요. 시장 규모와 물 부족 가능성을 고려해야 해요.'}
];
let db,ref,me='',idx=0,draft={},state={};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(){try{let app=firebase.apps.find(a=>a.options.projectId===PROJECT_ID);if(!app)app=firebase.initializeApp({authDomain:'americamapmaking.firebaseapp.com',databaseURL:DATABASE_URL,projectId:PROJECT_ID,storageBucket:'americamapmaking.firebasestorage.app',messagingSenderId:'260167025585',appId:'1:260167025585:web:6cc4c97234bbd5a04f7390'});db=firebase.database(app);ref=db.ref(path);ref.on('value',s=>{state=s.val()||{};render();$('conn').textContent='실시간 저장 연결됨 · '+ROOM;});$('conn').textContent='서버 연결 확인 중…';}catch(e){$('conn').textContent='연결 오류';console.error(e);}}
function key(){return me.replace(/[.#$/\[\]]/g,'_')}
function enter(){me=$('studentName').value.trim();if(!me)return alert('이름을 적어 주세요.');$('join').classList.add('hidden');if(TEACHER){$('teacher').classList.remove('hidden');$('game').classList.add('hidden');}else{$('game').classList.remove('hidden');idx=Number(localStorage.getItem('factory-step-'+ROOM+'-'+key()))||0;draft=state.students?.[key()]||{};showCompany();}render();}
function weighted(r,c){return Math.round(factors.reduce((n,[k])=>n+r.scores[k]*c.weights[k],0)/factors.reduce((n,[k])=>n+c.weights[k],0)*20)}
function showCompany(){const c=companies[idx];$('title').textContent=(idx+1)+' / 3 · '+c.name;$('subtitle').textContent=c.product;$('progress').innerHTML=companies.map((x,i)=>'<span class="pill">'+(i<idx?'✓':i===idx?'진행':'대기')+' '+(i+1)+'</span>').join('');const d=draft[c.id]||{};const opts=regions.map(r=>'<option value="'+r.id+'" '+(d.prediction===r.id?'selected':'')+'>'+r.name+'</option>').join('');$('content').innerHTML='<section class="company wide"><h3>① 입지 예측</h3><p class="note">자료를 자세히 보기 전에 가장 유리할 것 같은 지역을 고르고 이유를 적어 보세요.</p><div class="row"><select id="prediction">'+opts+'</select><input id="predictWhy" placeholder="예측한 까닭"></div></section><section class="company wide"><h3>② 후보지 비교 · 조건별 1~5점</h3><p class="note">회사에 중요한 조건은 굵게 표시돼요. 수치는 수업용 시뮬레이션 지수이며 실제 통계가 아닙니다.</p><div class="grid">'+regions.map(r=>'<article class="candidate"><h4>'+r.name+' · 예상 입지 '+weighted(r,c)+'점</h4><p class="note">'+r.why+'</p><div class="scores">'+factors.map(([k,label])=>'<div class="score" style="'+(c.weights[k]>=4?'border:2px solid #79b5d4':'')+'">'+label+'<b>'+r.scores[k]+'/5</b></div>').join('')+'</div><button class="secondary choose" data-region="'+r.id+'" style="margin-top:8px;width:100%;color:#173750">'+(d.location===r.id?'✓ 선택됨 · 다시 선택':'이 지역에 공장 짓기')+'</button></article>').join('')+'</div></section>'+(d.location?'<section class="company wide"><h3>③ 공장 진출의 영향 살펴보기</h3><div class="impact"><article><h4>기업</h4>생산·운송 조건과 북미 시장 접근성이 달라져요.</article><article><h4>노동자</h4>일자리가 생길 수 있어요. 임금과 노동 조건은 함께 살펴봐야 해요.</article><article><h4>지역사회</h4>세수와 기반 시설이 늘 수 있지만, 주거비·교통 부담도 생길 수 있어요.</article><article><h4>환경</h4>물·전력 사용과 폐기물, 운송에 따른 영향을 따져야 해요.</article></div><label>우리 기업의 진출로 누가 이익을 얻고, 누가 부담을 질까?</label><textarea id="impact" placeholder="자료와 사례를 근거로 두 관점 이상 써 보세요.">'+esc(d.impact||'')+'</textarea><button id="submit" style="margin-top:8px">영향 분석 저장 · 다음 단계</button></section>':'<p class="banner wide">후보지 자료를 보고 공장 위치를 하나 선택하면, 영향 분석이 열려요.</p>');$('back').disabled=idx===0;$('next').textContent=idx===2?'세 기업 결정 보기 →':'다음 기업 →';$('next').disabled=!draft[c.id]?.done;document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>claim(c,b.dataset.region));if($('submit'))$('submit').onclick=()=>submit(c);if($('predictWhy'))$('predictWhy').value=d.predictWhy||'';}
async function claim(c,rid){const d={...(draft[c.id]||{}),prediction:$('prediction').value,predictWhy:$('predictWhy').value.trim()};if(!d.predictWhy)return alert('예측 이유를 간단히 적어 주세요.');try{const slotRef=ref.child('claims/'+c.id+'/'+rid);const tx=await slotRef.transaction(cur=>{const names=Array.isArray(cur)?cur:cur?[cur]:[];if(names.includes(key()))return names;if(names.length>=3)return;return [...names,key()]},{applyLocally:false});const names=Array.isArray(tx.snapshot.val())?tx.snapshot.val():tx.snapshot.val()?[tx.snapshot.val()]:[];if(!tx.committed||!names.includes(key()))return alert('이 지역의 부지가 찼어. 다른 후보지를 골라 봐!');d.location=rid;draft[c.id]=d;await ref.child('students/'+key()+'/'+c.id).update(d);showCompany();}catch(e){$('saveState').textContent='저장 실패: '+(e.code||e.message||'서버 규칙 또는 연결 확인');alert('선점 저장이 막혔어: '+(e.code||e.message||'연결을 확인하고 다시 시도해 줘.'));}}
async function submit(c){const d=draft[c.id]||{};d.impact=$('impact').value.trim();if(d.impact.length<20)return alert('기업과 지역에 미친 영향을 근거와 함께 20자 이상 적어 주세요.');d.done=true;draft[c.id]=d;await ref.child('students/'+key()+'/'+c.id).set(d);showCompany();}
function render(){if(TEACHER){const students=state.students||{};$('roster').innerHTML=Object.keys(students).length?'<table><thead><tr><th>학생</th>'+companies.map(c=>'<th>'+c.name+'</th>').join('')+'</tr></thead><tbody>'+Object.entries(students).map(([n,v])=>'<tr><td>'+esc(n)+'</td>'+companies.map(c=>{const d=v[c.id]||{};return '<td>'+esc(regions.find(r=>r.id===d.location)?.name||'미정')+(d.done?' · 영향 분석 제출':'')+(d.impact?'<br>'+esc(d.impact):'')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>':'아직 제출한 학생이 없어요.';return;}}
$('enter').onclick=enter;$('studentName').onkeydown=e=>{if(e.key==='Enter')enter()};$('back').onclick=()=>{if(idx){idx--;localStorage.setItem('factory-step-'+ROOM+'-'+key(),idx);showCompany()}};$('next').onclick=()=>{if(idx<2&&draft[companies[idx].id]?.done){idx++;localStorage.setItem('factory-step-'+ROOM+'-'+key(),idx);showCompany()}else if(idx===2){$('content').innerHTML='<section class="company wide"><h3>이사회 최종 보고</h3>'+companies.map(c=>{const d=draft[c.id]||{};return '<p><b>'+c.name+':</b> '+esc(regions.find(r=>r.id===d.location)?.name||'입지 미정')+' · 예측: '+esc(regions.find(r=>r.id===d.prediction)?.name||'')+'<br>'+esc(d.impact||'')+'</p>'}).join('')+'<p class="banner">세 기업의 입지를 비교해 보세요. 회사에 유리한 입지가 현지 주민과 환경에도 늘 유리했나요?</p></section>';}};
if(TEACHER){$('join').classList.add('hidden');$('teacher').classList.remove('hidden');}init();
</script></body></html>
