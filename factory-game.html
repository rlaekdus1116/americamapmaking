ePreview{padding:10px;border-radius:10px;background:#fff3d9;font-weight:800}.sentenceLabel{font-weight:850}.charCount{text-align:right;color:#597286;font-size:13px;font-weight:800;margin-top:4px}.editPrediction{margin-bottom:8px}.predictChoices{display:flex;gap:9px;margin:10px 0}.predictChoice{flex:1;background:white;color:#234a68;border:2px solid #c7dbe7;font-size:17px}.predictChoice.selected{background:#d8f0ff;border-color:#2678a7;box-shadow:0 0 0 3px #a8d9f2}.miniMap{display:block;width:100%;height:150px;border-radius:14px;margin:8px 0}.miniMap text{font-size:15px;font-weight:900;fill:#1d3d52}.roulette strong{font-size:23px}.rouletteLabel{font-weight:800}.predictBox{margin-top:16px;background:#f3f9fd;padding:16px;border-radius:14px}.wideBtn{width:100%;margin-top:12px}.factoryLayout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scorecards{display:grid;gap:8px}.mapPanel{position:sticky;top:72px;align-self:start;background:#eef8fc;padding:10px;border-radius:14px}.mapPanel svg{width:100%;height:auto;max-height:54vh;touch-action:manipulation}.dropzone{cursor:pointer}.dropzone circle{fill:#e4f3a2;stroke:#598d55;stroke-width:3}.dropzone text{font-size:11px;text-anchor:middle;fill:#173750;font-weight:900;pointer-events:none}.plantMarker{cursor:grab}.plantMarker text{font-size:32px}.tokenHelp{font-size:13px;font-weight:800}.choose{width:100%;margin-top:7px}@media(max-width:700px){.roulette{min-height:145px;gap:12px;padding:10px}.wheelWrap{width:116px;height:116px;flex-basis:116px}.roulette strong{font-size:18px}.predictChoices{gap:5px}.predictChoice{font-size:14px;min-height:44px}.miniMap{height:125px}.factoryLayout{grid-template-columns:1fr}.mapPanel{position:relative;top:auto}.scorecards{grid-template-columns:1fr 1fr}.impact{grid-template-columns:1fr 1fr}header{height:52px;padding:7px 12px}h1{font-size:16px}main{margin:8px auto}.card{padding:12px}.grid{grid-template-columns:1fr}.impact{grid-template-columns:1fr 1fr}.wide{grid-column:auto}.scores{grid-template-col </style></head><body><header><h1>🌎 초국적기업 입지 전략게임</h1><span id="conn">연결 중…</span></header><main><section id="join" class="card"><h2>긴급 이사회 소집</h2><p>여러분은 세계 시장에 진출한 기업의 입지전략팀입니다. 세 회사의 공장 후보지를 예측하고, 자료를 비교해 직접 결정하세요.</p><div class="row"><input id="studentName" placeholder="이름 또는 별명"><button id="enter">전략회의 입장</button></div><p class="note">같은 반 학생은 같은 방 주소로 접속해야 공장 부지 선점 현황을 함께 볼 수 있어요.</p></section><section id="game" class="hidden"><div class="top"><div><h2 id="title"></h2><div id="subtitle" class="note"></div></div><div class="progress" id="progress"></div></div><div id="content" class="grid"></div><div class="toolbar"><button id="back" class="secondary">← 이전 기업</button><span id="saveState" class="note"></span><button id="next">다음 기업 →</button></div></section><section id="teacher" class="card teacher hidden"><h2>교사용 · 학생 결정 현황</h2><p class="note">학생별 공장 입지와 영향 평가가 제출되는 대로 표시됩니다.</p><div id="roster"></div></section></main>
<script>
const params=new URLSearchParams(location.search),ROOM=params.get('room')||'demo',TEACHER=params.get('mode')==='teacher';
const PROJECT_ID='americamapmaking',DATABASE_URL='https://americamapmaking-default-rtdb.firebaseio.com',path='rooms/'+encodeURIComponent(ROOM).replace(/\./g,'%2E')+'/v8/factoryGame';
const companies=[
 {id:'shoe',name:'운동화 기업',product:'세계 여러 지역에서 운동화를 만들어 북미 시장에 판매합니다.',weights:{labor:5,material:4,market:2,transport:4,skill:1,resource:2}},
 {id:'car',name:'전기차 기업',product:'배터리와 부품을 조달해 전기차를 조립하고 북미 시장에 공급합니다.',weights:{labor:2,material:5,market:4,transport:4,skill:5,resource:2}},
 {id:'drink',name:'음료 기업',product:'지역 농산물과 물을 이용해 음료를 생산하고 여러 나라에 판매합니다.',weights:{labor:2,material:5,market:4,transport:3,skill:1,resource:5}}
];
const factors=[['labor','노동력·임금'],['material','원료·부품'],['market','시장'],['transport','교통·운송'],['skill','기술·인재'],['resource','물·전력']];
// Classroom simulation indices (1–5), not national statistics. Replace with dated sourced data before formal assessment.
const regions=[
 {id:'mexico',name:'멕시코',scores:{labor:4,material:3,market:4,transport:5,skill:3,resource:3},why:'북미 시장과 가까우며 도로·항만 연결이 좋아요. 임금은 상대적으로 낮지만 지역별 물 공급 차이를 살펴야 해요.'},
 {id:'brazil',name:'브라질',scores:{labor:3,material:5,market:4,transport:3,skill:3,resource:4},why:'농산물과 큰 내수 시장이 강점이에요. 국토가 넓어 공장과 항만 사이 물류를 따져야 해요.'},
 {id:'chile',name:'칠레',scores:{labor:3,material:4,market:2,transport:4,skill:4,resource:2},why:'항만과 광물 공급망, 기술 인력이 강점이에요. 시장 규모와 물 부족 가능성을 고려해야 해요.'}
];
let db,ref,me='',idx=0,draft={},state={},saveTimer=null;
function localDraftKey(){return 'factory-draft-v2-'+ROOM+'-'+key()}
function saveDraftLocal(){if(me)localStorage.setItem(localDraftKey(),JSON.stringify(draft));}
function queueDraftSave(cid){saveDraftLocal();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(ref&&me)ref.child('students/'+key()+'/'+cid).update(draft[cid]).catch(()=>{$('saveState').textContent='서버 연결이 끊겨 기기에 임시 저장했어.'})},500);}const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(){try{let app=firebase.apps.find(a=>a.options.projectId===PROJECT_ID);if(!app)app=firebase.initializeApp({authDomain:'americamapmaking.firebaseapp.com',databaseURL:DATABASE_URL,projectId:PROJECT_ID,storageBucket:'americamapmaking.firebasestorage.app',messagingSenderId:'260167025585',appId:'1:260167025585:web:6cc4c97234bbd5a04f7390'});db=firebase.database(app);ref=db.ref(path);ref.on('value',s=>{state=s.val()||{};render();$('conn').textContent='실시간 저장 연결됨 · '+ROOM;});$('conn').textContent='서버 연결 확인 중…';}catch(e){$('conn').textContent='연결 오류';console.error(e);}}
function key(){return me.replace(/[.#$/\[\]]/g,'_')}
async function enter(){me=$('studentName').value.trim();if(!me)return alert('이름을 적어 주세요.');if(TEACHER){$('join').classList.add('hidden');$('teacher').classList.remove('hidden');$('game').classList.add('hidden');render();return;}try{const snap=await ref.once('value');state=snap.val()||state;}catch{}const serverDraft=state.students?.[key()]||{};let local={};try{local=JSON.parse(localStorage.getItem(localDraftKey())||'{}')}catch{}draft={...local,...serverDraft};idx=Number(serverDraft.meta?.idx??local.meta?.idx??localStorage.getItem('factory-step-'+ROOM+'-'+key()))||0;idx=Math.max(0,Math.min(2,idx));$('join').classList.add('hidden');$('game').classList.remove('hidden');showCompany();}
function weighted(r,c){return Math.round(factors.reduce((n,[k])=>n+r.scores[k]*c.weights[k],0)/factors.reduce((n,[k])=>n+c.weights[k],0)*20)}
function showCompany(){
 const c=companies[idx],d=draft[c.id]||{};const phase=d.predictionLocked?'analysis':'predict';
 $('title').textContent=phase==='predict'?'기업 공개 룰렛 · '+(idx+1)+' / 3':(idx+1)+' / 3 · '+c.name;$('subtitle').textContent=phase==='predict'?'룰렛을 돌려 오늘의 기업을 공개해!':c.product;
 $('progress').innerHTML=companies.map((x,i)=>'<span class="pill">'+(i<idx?'✓':i===idx?'진행':'대기')+' '+(i+1)+'</span>').join('');
 if(phase==='predict'){
  $('content').innerHTML='<section class="company wide"><div class="roulette"><div class="wheelWrap"><div id="rouletteWheel" class="wheel"><span>👟 운동화</span><span>🚗 전기차</span><span>🥤 음료</span></div><i class="wheelPin">▼</i></div><div><span class="rouletteLabel">기업 공개 룰렛</span><strong id="rouletteName">'+(idx===0?'어떤 회사가 나올까?': '다음 회사는?')+'</strong><button id="spin">룰렛 돌리기 🔊</button></div></div><div class="predictBox"><h3>자료를 보기 전, 먼저 예측!</h3><p>어느 지역이 '+c.name+' 공장에 가장 유리할까? 예측을 제출하면 자료가 열려.</p><div class="predictChoices">'+regions.map(r=>'<button type="button" class="predictChoice '+(d.prediction===r.id?'selected':'')+'" data-pick="'+r.id+'">'+r.name+'</button>').join('')+'</div><p class="sentenceLabel">어떤 조건을 중요하게 봤어? 두 가지 이상 골라 문장을 완성해.</p><div class="factorChoices">'+factors.map(([id,label])=>'<button type="button" class="factorChoice '+((d.factors||[]).includes(id)?'selected':'')+'" data-factor="'+id+'">'+label+'</button>').join('')+'</div><p id="sentencePreview" class="sentencePreview"></p><svg class="miniMap" viewBox="0 0 520 300" aria-label="아메리카 후보 지역 지도"><rect width="520" height="300" rx="16" fill="#dff1fa"/><path d="M70 30 130 15 193 34 230 73 215 107 180 112 165 141 144 146 129 180 109 176 95 145 81 129 66 95Z" fill="#9dccaa" stroke="white" stroke-width="4"/><path d="m122 174 35-19 21 9-14 18 15 15-9 19-18-9-16 21-10-24-18-10Z" fill="#8ebc99" stroke="white" stroke-width="4"/><path d="m155 228 32-11 26 21 6 30-22 26-18-4-13-24-21-20Z" fill="#a3c9a8" stroke="white" stroke-width="4"/><circle cx="151" cy="168" r="13"/><circle cx="205" cy="250" r="13"/><circle cx="163" cy="264" r="13"/><text x="177" y="168">멕시코</text><text x="230" y="253">브라질</text><text x="181" y="282">칠레</text></svg><div class="row"><select id="prediction">'+regions.map(r=>'<option value="'+r.id+'" '+(d.prediction===r.id?'selected':'')+'>'+r.name+'</option>').join('')+'</select><input id="predictWhy" maxlength=180 value="'+esc(d.predictWhy||'')+'" placeholder="예: 교통이 편리하면 운동화를 북미에 빨리 보낼 수 있기 때문이다. (15자 이상)"></div><div class="charCount" id="predictCount"></div><button id="lockPrediction" class="wideBtn" disabled>이유를 30자 이상 쓰면 자료가 열려 →</button></div></section>';
  document.querySelectorAll('.predictChoice').forEach(b=>b.onclick=()=>{$('prediction').value=b.dataset.pick;savePredictionDraft();document.querySelectorAll('.predictChoice').forEach(x=>x.classList.toggle('selected',x===b));});$('spin').onclick=()=>{const name=$('rouletteName'),btn=$('spin'),wheel=$('rouletteWheel');btn.disabled=true;wheel.classList.remove('spinning');void wheel.offsetWidth;wheel.classList.add('spinning');let audio;try{audio=new(window.AudioContext||window.webkitAudioContext)();}catch{}let ticks=0;const timer=setInterval(()=>{if(audio){const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=540+Math.min(ticks,12)*35;g.gain.value=.055;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.08);}ticks++;if(ticks>32){clearInterval(timer);wheel.classList.remove('spinning');name.textContent='🎉 '+c.name+' 당첨!';btn.textContent='다시 돌리기';btn.disabled=false;}},110);
  };
  const updatePredictCount=()=>{const count=$('predictWhy').value.trim().length,chosen=document.querySelectorAll('.factorChoice.selected').length;$('sentencePreview').textContent='나는 '+regions.find(r=>r.id===$('prediction').value).name+'이(가) 유리할 것 같다. '+[...document.querySelectorAll('.factorChoice.selected')].map(x=>x.textContent).join('과 ')+' 조건이 중요하기 때문이다. '+($('predictWhy').value.trim()||'이유를 이어 써 봐.');$('predictCount').textContent='선택한 요소 '+chosen+'개 · 이유 '+count+' / 15자';$('lockPrediction').disabled=count<15||chosen<2;$('lockPrediction').textContent=chosen<2?'입지 요소를 2개 이상 골라 줘':count<15?'이유를 15자 이상 쓰면 자료가 열려 →':'예측 제출하고 자료 공개하기 →';};const savePredictionDraft=()=>{draft[c.id]={...draft[c.id],prediction:$('prediction').value,predictWhy:$('predictWhy').value,factors:[...document.querySelectorAll('.factorChoice.selected')].map(x=>x.dataset.factor)};queueDraftSave(c.id);updatePredictCount()};$('predictWhy').oninput=savePredictionDraft;$('prediction').onchange=savePredictionDraft;document.querySelectorAll('.factorChoice').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');savePredictionDraft()});document.querySelectorAll('.predictChoice').forEach(b=>b.onclick=()=>{$('prediction').value=b.dataset.pick;savePredictionDraft();document.querySelectorAll('.predictChoice').forEach(x=>x.classList.toggle('selected',x===b))});updatePredictCount();$('lockPrediction').onclick=async()=>{const why=$('predictWhy').value.trim(),chosen=[...document.querySelectorAll('.factorChoice.selected')].map(x=>x.dataset.factor);if(why.length<15||chosen.length<2)return alert('입지 요소 두 가지 이상을 고르고, 이유를 15자 이상 완성해 줘.');draft[c.id]={...d,prediction:$('prediction').value,predictWhy:why,factors:chosen,predictionLocked:true};try{await ref.child('students/'+key()+'/'+c.id).update(draft[c.id]);saveDraftLocal();showCompany();}catch(e){$('saveState').textContent='예측은 이 기기에 기억했어. 서버 저장 확인 필요';showCompany();}};
 }else{
  $('content').innerHTML='<section class="company wide"><button type="button" class="secondary editPrediction">← 예측 다시 보기</button><h3>② 자료 공개 · 점수를 비교하고 지도에 공장 건설</h3><p class="note">조건별 1~5점은 수업용 시뮬레이션 지수야. 아래 후보지를 눌러도 되고, 공장 토큰을 지도에 끌어다 놓아도 돼.</p><div class="factoryLayout"><div class="scorecards">'+regions.map(r=>'<article class="candidate"><h4>'+r.name+' · '+weighted(r,c)+'점</h4><p class="note">'+r.why+'</p><div class="scores">'+factors.map(([k,l])=>'<div class="score">'+l+'<b>'+r.scores[k]+'/5</b></div>').join('')+'</div><button class="secondary choose" data-region="'+r.id+'">지도에 건설 · '+r.name+'</button></article>').join('')+'</div><div class="mapPanel"><b>아메리카 공장 입지 지도</b><svg id="factoryMap" viewBox="0 0 520 390" role="img" aria-label="아메리카 공장 위치 선택 지도"><rect width="520" height="390" rx="18" fill="#dff1fa"/><path d="M70 50 130 30 193 54 230 93 215 127 180 132 165 161 144 166 129 200 109 196 95 165 81 149 66 115Z" fill="#9dccaa" stroke="#fff" stroke-width="4"/><path d="m122 194 35-19 21 9-14 18 15 15-9 19-18-9-16 21-10-24-18-10Z" fill="#8ebc99" stroke="#fff" stroke-width="4"/><path d="m155 248 32-11 26 21 6 40-22 55-18-4-13-42-21-32Z" fill="#a3c9a8" stroke="#fff" stroke-width="4"/><g class="dropzone" data-region="mexico"><circle cx="151" cy="188" r="23"/><text x="151" y="192">멕시코</text></g><g class="dropzone" data-region="brazil"><circle cx="205" cy="285" r="26"/><text x="205" y="289">브라질</text></g><g class="dropzone" data-region="chile"><circle cx="163" cy="300" r="22"/><text x="163" y="304">칠레</text></g><g id="plantMarker" draggable="true" class="plantMarker" transform="translate(345 180)"><text>🏭</text></g></svg><div class="tokenHelp">🏭 공장 토큰을 지도 위 초록 지역에 끌어다 놓거나 눌러 봐!</div></div></div></section>'+(d.location?'<section class="company wide"><h3>③ 공장 진출의 영향 살펴보기 · '+regions.find(r=>r.id===d.location).name+'</h3><div class="impact"><article><h4>기업</h4>생산·운송과 시장 접근성</article><article><h4>노동자</h4>일자리·임금·노동 조건</article><article><h4>지역사회</h4>세수·기반 시설과 주거비·교통</article><article><h4>환경</h4>물·전력·폐기물 영향</article></div><label>누가 이익을 얻고, 누가 부담을 질까?</label><textarea id="impact" maxlength="300" placeholder="기업·노동자·주민·환경 중 두 관점 이상을 골라 영향과 까닭을 40자 이상 써 봐.">'+esc(d.impact||'')+'</textarea><div class="charCount" id="impactCount"></div><button id="submit" disabled>영향 분석 저장</button></section>':'<p class="banner wide">지도에 공장을 건설하면 영향 분석이 열려.</p>');
  document.querySelector('.editPrediction').onclick=()=>{const revised={...d,predictionLocked:false,done:false};delete revised.location;draft[c.id]=revised;ref.child('students/'+key()+'/'+c.id).set(revised).catch(()=>{});showCompany()};document.querySelectorAll('.choose,.dropzone').forEach(el=>el.onclick=()=>claim(c,el.dataset.region));const marker=$('plantMarker'),map=$('factoryMap');marker.ondragstart=e=>e.dataTransfer.setData('text/plain','factory');map.ondragover=e=>e.preventDefault();map.ondrop=e=>{e.preventDefault();const r=e.target.closest('.dropzone');if(r)claim(c,r.dataset.region)};document.querySelectorAll('.dropzone').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();claim(c,z.dataset.region)}});if($('submit')){const countImpact=()=>{const n=$('impact').value.trim().length;$('impactCount').textContent=n+' / 40자';$('submit').disabled=n<40;$('submit').textContent=n<40?'40자 이상 쓰면 제출할 수 있어':'영향 분석 저장 · 다음 기업 →'};$('impact').oninput=countImpact;countImpact();$('submit').onclick=()=>submit(c);}
 }
 $('back').disabled=idx===0;$('next').textContent=idx===2?'세 기업 결정 보기 →':'다음 기업 →';$('next').disabled=!d.done;
}
async function claim(c,rid){const d={...(draft[c.id]||{}),prediction:$('prediction').value,predictWhy:$('predictWhy').value.trim()};if(!d.predictWhy)return alert('예측 이유를 간단히 적어 주세요.');try{const slotRef=ref.child('claims/'+c.id+'/'+rid);const tx=await slotRef.transaction(cur=>{const names=Array.isArray(cur)?cur:cur?[cur]:[];if(names.includes(key()))return names;if(names.length>=3)return;return [...names,key()]},{applyLocally:false});const names=Array.isArray(tx.snapshot.val())?tx.snapshot.val():tx.snapshot.val()?[tx.snapshot.val()]:[];if(!tx.committed||!names.includes(key()))return alert('이 지역의 부지가 찼어. 다른 후보지를 골라 봐!');d.location=rid;draft[c.id]=d;await ref.child('students/'+key()+'/'+c.id).update(d);showCompany();setTimeout(()=>$('impact')?.scrollIntoView({behavior:'smooth',block:'center'}),120);}catch(e){$('saveState').textContent='저장 실패: '+(e.code||e.message||'서버 규칙 또는 연결 확인');alert('선점 저장이 막혔어: '+(e.code||e.message||'연결을 확인하고 다시 시도해 줘.'));}}
async function submit(c){const d=draft[c.id]||{};d.impact=$('impact').value.trim();if(d.impact.length<40)return alert('기업과 지역에 미친 영향을 근거와 함께 40자 이상 적어 주세요.');d.done=true;draft[c.id]=d;await ref.child('students/'+key()+'/'+c.id).set(d);showCompany();}
function render(){if(TEACHER){const students=state.students||{};$('roster').innerHTML=Object.keys(students).length?'<table><thead><tr><th>학생</th>'+companies.map(c=>'<th>'+c.name+'</th>').join('')+'</tr></thead><tbody>'+Object.entries(students).map(([n,v])=>'<tr><td>'+esc(n)+'</td>'+companies.map(c=>{const d=v[c.id]||{};return '<td>'+esc(regions.find(r=>r.id===d.location)?.name||'미정')+(d.done?' · 영향 분석 제출':'')+(d.impact?'<br>'+esc(d.impact):'')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>':'아직 제출한 학생이 없어요.';return;}}
$('enter').onclick=enter;$('studentName').onkeydown=e=>{if(e.key==='Enter')enter()};$('back').onclick=()=>{if(idx){idx--;localStorage.setItem('factory-step-'+ROOM+'-'+key(),idx);draft.meta={...(draft.meta||{}),idx};ref.child('students/'+key()+'/meta').update({idx}).catch(()=>{});saveDraftLocal();showCompany()}};$('next').onclick=()=>{if(idx<2&&draft[companies[idx].id]?.done){idx++;localStorage.setItem('factory-step-'+ROOM+'-'+key(),idx);draft.meta={...(draft.meta||{}),idx};ref.child('students/'+key()+'/meta').update({idx}).catch(()=>{});saveDraftLocal();showCompany()}else if(idx===2){$('content').innerHTML='<section class="company wide"><h3>이사회 최종 보고</h3>'+companies.map(c=>{const d=draft[c.id]||{};return '<p><b>'+c.name+':</b> '+esc(regions.find(r=>r.id===d.location)?.name||'입지 미정')+' · 예측: '+esc(regions.find(r=>r.id===d.prediction)?.name||'')+'<br>'+esc(d.impact||'')+'</p>'}).join('')+'<p class="banner">세 기업의 입지를 비교해 보세요. 회사에 유리한 입지가 현지 주민과 환경에도 늘 유리했나요?</p></section>';}};
if(TEACHER){$('join').classList.add('hidden');$('teacher').classList.remove('hidden');}init();
</script></body></html>
