<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="초국적 기업의 공장 입지 결정과 지역 변화를 기업 담당자와 주민 대표의 입장에서 살펴보는 수업 활동"><title>공장 하나가 도시를 바꿨다</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"><script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><style>
:root{--ink:#34445a;--line:#46536a;--muted:#66758a;--mint:#d9f2e6;--cream:#fff9e9;--lav:#e9e3fa;--blue:#dfeefa;--accent:#50634e;--border:#dce3e3;--bg:#f7f8f3}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border:1px solid var(--border);border-radius:15px;background:#fff;padding:10px 16px;font-weight:700;transition:background .18s,transform .18s}
button:hover{background:#f0f5ef}button:active{transform:translateY(2px)}button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #7e95cd;outline-offset:2px}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.primary:hover{background:#394e39}
.selected{background:var(--mint)!important;border:2px solid #6e9b83!important}
h1,h2,h3,.display{font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400}
h1{font-size:21px;margin:0}h2{font-size:28px;line-height:1.28;margin:8px 0 12px}h3{font-size:21px;margin:6px 0 8px}
p{line-height:1.6;margin:8px 0}small,.muted{color:var(--muted)}small{font-size:14px}
label{display:block;font-weight:600;margin:10px 0 6px}
input,textarea,select{width:100%;background:#fff;border:1px solid #cbd5d6;padding:11px;border-radius:12px;min-height:44px}
textarea{resize:vertical;min-height:72px}
a{color:#3f5f8f}
.hidden{display:none!important}
header{height:64px;padding:10px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fffef9}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{flex:none;width:36px;height:36px;background:var(--mint);display:grid;place-items:center;border-radius:12px;font-family:Jua,sans-serif;font-size:22px}
.tools,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tools{flex-wrap:nowrap}
.save{font-size:13px;max-width:235px;text-align:right}
.between{justify-content:space-between}
.app{height:calc(100dvh - 64px);display:flex;flex-direction:column;max-width:1500px;margin:auto;padding:12px 20px 10px;gap:10px}
.steps{display:flex;gap:8px;flex-shrink:0;overflow:auto;padding:2px}
.step{border:0;min-height:34px;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap;color:#687384;background:#edf0ed}
.step.active{background:#cfe3c9;color:#31482e;font-weight:700}.step.done{background:var(--mint);color:#3c5438}
.step:disabled{opacity:.75}
.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.95fr);gap:16px;flex:1;min-height:0}
.scene{border-radius:24px;background:#e5f1ed;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0;border:1px solid #d5e6e1}
.sceneTop{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ffffff8c;flex-shrink:0}
.badge{display:inline-block;background:#fff;padding:5px 12px;border-radius:99px;font-size:14px}
.sceneArt{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.sceneArt>svg{width:100%;height:100%;display:block}
.sceneBottom{background:#ffffffc4;padding:9px 16px;font-size:14px;line-height:1.5;flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{border:1px solid var(--border);border-radius:24px;background:#fffefa;padding:18px 20px;overflow:auto;min-height:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;color:#6b806c}
.instruction{font-size:17px;font-weight:600}
.hint{background:var(--blue);padding:10px 14px;border-radius:14px;margin:10px 0}
.cards{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{text-align:left;display:block;width:100%;font-weight:500}.choice b{display:block;margin-bottom:3px}.choice small{display:block}
.chip{font-size:14px;border-radius:99px;padding:7px 14px;min-height:40px}
.report{background:#f5f6ef;border-radius:16px;padding:12px 14px;margin:10px 0}.report p{margin:4px 0;overflow-wrap:anywhere}
.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-shrink:0;min-height:50px}
.footer .primary{min-width:180px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#34445a;color:#fff;border-radius:15px;padding:12px 20px;z-index:500;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* join */
.join{max-width:1040px;margin:auto;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:28px}
.join h2{font-size:44px;margin:12px 0}
.hero{border-radius:32px;background:var(--mint);padding:24px}.hero svg{width:100%;height:auto;border-radius:20px;display:block}
.join .panel{box-shadow:0 12px 50px #425d3812}

/* briefing */
.panel.chat{display:flex;flex-direction:column}.panel.chat .messageThread{flex:1;min-height:120px;overflow:auto}.panel.chat>.row,.panel.chat>button{flex-shrink:0}
.messageThread{display:flex;flex-direction:column;gap:9px;padding:10px 8px;background:#f8fbfa;border:1px solid #d9e4e0;border-radius:17px;margin:10px 0}
.messageRow{display:flex;align-items:flex-start;gap:9px}.messageRow>div{max-width:90%}
.messageRow small{display:block;font-weight:700;color:#647385;margin:0 0 3px}
.messageAvatar{flex:0 0 34px;width:34px;height:34px;border-radius:12px;background:#d6e2ee;display:grid;place-items:center;font-weight:700}
.messageRow:nth-child(even) .messageAvatar{background:#e8d9e9}
.messageBubble{margin:0;padding:10px 14px;background:#eef2fa;border-radius:5px 15px 15px 15px;line-height:1.5}
.messageRow.current .messageBubble{background:#d9ebdf;animation:pop .3s ease-out}
.dialogue{padding:14px 16px;border:2px solid #ccd8ef;border-radius:18px;background:#f1f5ff;margin:12px 0;line-height:1.6}.dialogue p{margin:4px 0}
.quizFeedback{min-height:24px;font-weight:600}
.conceptCard{border:2px dashed #9db8a4;border-radius:16px;padding:12px 14px;background:#f4faf3;margin:10px 0}

/* map */
.mapLand{fill:#c6dfcd;stroke:#f7fff9;stroke-width:1.1}
.pin{cursor:pointer}.pin circle{stroke:#fff;stroke-width:3}.pin text{fill:#34445a;font-size:13px;font-weight:700}
.route{fill:none;stroke:#a38bce;stroke-width:2.5;stroke-dasharray:7 5}
.flipCard{border:1px solid var(--border);border-radius:14px;background:#fff;min-height:150px;overflow:hidden;display:flex}
.cardBack{flex:1;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:repeating-linear-gradient(45deg,#e5e8fa,#e5e8fa 8px,#edf0ff 8px,#edf0ff 16px);border:3px solid #fff;box-shadow:inset 0 0 0 1px #a8b3d4;border-radius:14px}
.cardBack b{font-size:19px}.cardBack span{font-size:13px;color:#687792;font-weight:500}
.cardFront{flex:1;padding:10px 12px;background:#f9fbff;display:flex;flex-direction:column;gap:4px;animation:pop .3s ease-out}
.cardFront .row{justify-content:space-between;flex-wrap:nowrap}
.cardFront p{margin:0;font-size:14px;line-height:1.45;flex:1}
.cardFront small{font-size:12.5px}
.foldCard{min-height:30px;padding:2px 9px;font-size:12px;font-weight:500}
.pick{min-height:36px;padding:4px;font-size:14px;width:100%}
.meter{display:flex;align-items:center;gap:7px;font-size:13px}.meter strong{font-family:Jua,sans-serif;font-size:21px;color:#426a59}
.meter i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#dfe6e2;margin-right:2px}.meter i.on{background:#6e9b83}
#reason{min-height:64px}

/* town */
.townSvg text{font-family:'Noto Sans KR',sans-serif;fill:#34445a}
.rise{animation:rise 1.2s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:center bottom}
.enterWorker{animation:enterFactory 5s linear both}
.resPin{cursor:pointer}.resPin .tag{fill:#fffdf1;stroke:#516c59;stroke-width:1.5}.resPin.on .tag{fill:#d9f2e6;stroke-width:3}
.resPin:hover .tag{fill:#eef7ef}
.resPin .ring{fill:none}.resPin.on .ring{fill:#ffffffb0;stroke:#6e9b83;stroke-width:3;stroke-dasharray:6 5}
.wiggle{animation:wiggle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.residentSpeech{border-left:4px solid #7a9e85;padding:12px 14px;background:#edf6ed;line-height:1.6;margin:10px 0;border-radius:0 14px 14px 0}
.changeCard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin:8px 0}.changeCard p{margin:4px 0 8px}
.cost{display:inline-block;background:var(--cream);padding:3px 9px;border-radius:99px;font-size:13px;margin-bottom:4px}
.policyGrid{grid-template-columns:1fr 1fr}.policyGrid .choice{padding:9px 11px}
.budget{display:flex;align-items:center;gap:10px}.budgetBar{flex:1;height:12px;border-radius:99px;background:#fff;overflow:hidden}.budgetBar i{display:block;height:100%;background:#7fa48d;transition:width .3s}
.reaction{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed #d5dccf}.reaction:first-of-type{border-top:0}
.reaction svg{flex:none;width:38px;height:38px}.reaction p{margin:0;font-size:14.5px;line-height:1.5}
.reaction b{font-size:14px}

/* comic */
.comicGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:12px;align-self:start}
.comic{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#fff}
.comic canvas{width:100%;display:block;aspect-ratio:5/3;background:#fff}.comic .caption{padding:7px 9px;font-size:14px;overflow-wrap:anywhere}
body[data-step="6"] .workspace{display:flex}body[data-step="6"] .scene{display:none}
body[data-step="6"] #panel{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px}
.comicHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.comicHead h2{margin:0;font-size:24px}.comicHead p{margin:0;font-size:14px}
.comicAll{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
.comicAll article{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-rows:auto minmax(0,1fr);gap:7px;padding:10px;background:#f1f4ff;border-radius:18px;min-width:0;min-height:0}
.comicAll h3{grid-column:1/-1;font-size:17px;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.comicAll h3 span{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#fff;color:#8a6d3b}.comicAll h3 span.ok{color:#3f6b4c;background:var(--mint)}
.drawBtn{position:relative;padding:0;overflow:hidden;display:flex;background:#fff;min-height:0;border:1px solid #ccd5df}
.drawBtn canvas{width:100%;height:100%;object-fit:contain;display:block}
.drawBtn em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;color:#8a95a8;font-weight:600;pointer-events:none}
.comicAll .side{display:flex;flex-direction:column;gap:5px;min-height:0}
.comicAll textarea{flex:1;min-height:0;resize:none;font-size:14px;line-height:1.5}
.comicAll .side a{font-size:13px}

/* drawing dialog */
dialog{border:0;border-radius:25px;padding:22px;max-width:95vw;width:650px;color:var(--ink);background:#fffefa}
dialog::backdrop{background:#263643aa}
.drawingDialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;padding:12px;border-radius:0;overflow:hidden}
.drawLayout{height:100%;display:flex;flex-direction:column;gap:8px}
.drawHeader{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawTools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex-shrink:0}
.drawTools input[type=color]{width:48px;height:44px;padding:3px}.drawTools select{width:110px}
.swatch{width:34px;height:34px;min-height:34px;border-radius:50%;padding:0;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px #bbc5cc}
.canvasWrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;background:#edf0ed;border-radius:16px;overflow:hidden}
.canvasWrap canvas{background:#fff;touch-action:none;max-height:100%;max-width:100%;aspect-ratio:5/3;width:auto;height:100%;border-radius:6px}
.bigGallery{width:95vw;max-width:1400px}.bigGallery .comic canvas{max-height:34vh;object-fit:contain}

/* final */
.doneBanner{background:var(--mint);border:2px solid #6e9b83;border-radius:16px;padding:12px 14px;margin:0 0 10px;font-weight:600}

/* teacher */
.teacher{max-width:1450px;padding:20px;margin:auto}
.teacherGrid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.roster{display:grid;gap:8px;align-content:start;max-height:80vh;overflow:auto;padding:2px}
.roster .choice{padding:8px 12px;min-height:0}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.summary section{background:#fffefa;border:1px solid var(--border);border-radius:18px;padding:12px 14px}
.summary h3{font-size:17px;margin:0 0 8px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{height:14px;background:#edf0ed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#8fb39b;border-radius:99px;transition:width .4s}
.bar b{text-align:right}
.teacher .panel{overflow:visible}
.linkBox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}.linkBox code{background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 10px;overflow-wrap:anywhere}

@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.2;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes enterFactory{0%{transform:translate(120px,400px);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translate(400px,300px);opacity:0}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-3px)}}

@media(min-width:851px) and (max-height:860px){
 .app{padding:8px 16px 8px;gap:8px}.panel{padding:13px 16px}h2{font-size:24px;margin:5px 0 8px}h3{font-size:19px}
 .instruction{font-size:16px}p{margin:6px 0;line-height:1.5}.flipCard{min-height:132px}.hint{margin:8px 0;padding:8px 12px}
 textarea{min-height:58px}#reason{min-height:54px}label{margin:7px 0 5px;font-size:15px}
 body[data-step="1"] .workspace{grid-template-columns:minmax(0,1fr) minmax(420px,1.05fr)}
}
@media(max-width:850px){
 header{padding:8px 12px;height:auto;min-height:62px}h1{font-size:17px}.save{max-width:120px;font-size:12px}
 .tools button{padding:6px 9px}
 .app{height:auto;min-height:calc(100dvh - 65px);padding:10px}.workspace{grid-template-columns:1fr}
 .scene{min-height:300px}.sceneArt{height:min(62vw,430px);flex:none}body[data-step="7"] .sceneArt{height:auto}
 .panel{overflow:visible;padding:16px}
 .join{grid-template-columns:1fr;padding:16px;gap:14px}.join h2{font-size:34px}
 .footer{position:sticky;bottom:0;background:var(--bg);padding:8px 0;z-index:2;flex-wrap:wrap}
 .teacherGrid,.summary{grid-template-columns:1fr}.teacher{padding:12px}.roster{max-height:none}
 body[data-step="6"] #panel{overflow:visible}.comicAll{grid-template-rows:none;flex:none}.comicAll article{min-height:300px}
 .canvasWrap canvas{width:100%;height:auto}
}
@media(max-width:600px){.comicAll{grid-template-columns:1fr}.policyGrid,.two{grid-template-columns:1fr}.footer .primary{min-width:0;flex:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
@media print{header,.footer,.steps,.toast{display:none!important}.app{height:auto}}
</style></head><body><header><div class="brand"><div class="logo" aria-hidden="true">S</div><h1>공장 하나가 도시를 바꿨다</h1></div><div class="tools"><span id="saveStatus" class="save" aria-live="polite">입장 후 자동 저장</span><button id="sound" aria-pressed="false">소리 꺼짐</button><button id="fullscreen">화면 확대</button></div></header><div id="root"></div><div id="toast" class="toast hidden" role="status"></div>

function fresh(){return {schema:2,step:0,assigned:false,briefPage:0,companyQuizAnswers:[],city:'',inspect:'monterrey',compare:'',evidence:[],openCards:{},reason:'',built:false,year:0,good:false,bad:false,resident:'',missed:'',policies:[],policyWhy:'',peer:'',peerThought:'',decision:'',finalWhy:'',comic:Array.from({length:4},()=>({strokes:[],text:''})),history:[],updatedAt:0,submitted:false};}
const toArr=v=>Array.isArray(v)?v.filter(x=>x!=null):v&&typeof v==='object'?Object.values(v).filter(x=>x!=null):[];
function normalize(o){o=o&&typeof o==='object'?o:{};const r={...fresh(),...o};
 r.comic=Array.from({length:4},(_,i)=>({text:String(o.comic?.[i]?.text||''),strokes:toArr(o.comic?.[i]?.strokes).map(st=>({...st,points:toArr(st.points)}))}));
 r.evidence=toArr(r.evidence);r.policies=toArr(r.policies).filter(id=>policies.some(p=>p.id===id));r.history=toArr(r.history);r.companyQuizAnswers=toArr(r.companyQuizAnswers);
 const oc={};Object.entries(r.openCards&&typeof r.openCards==='object'?r.openCards:{}).forEach(([k,v])=>oc[k]=toArr(v));r.openCards=oc;
 r.step=Math.max(0,Math.min(7,Number(r.step)||0));if(r.step===5)r.step=6;
 if(!cities.some(c=>c.id===r.inspect))r.inspect='monterrey';
 return r}

 return (v.submitted?10000:0)+STEPS.indexOf(v.step)*100+texts*20+v.comic.reduce((a,c)=>a+c.strokes.length,0)+v.policies.length+v.evidence.length+v.companyQuizAnswers.length}

let saveTimer=null,dirty=false,localFailure=false,syncReady=false,reconciling=false,flushing=false,synced=null,baseUpdatedAt=0,toastTimer=null;

function persist(){if(preview||teacher)return;dirty=true;s.updatedAt=Date.now();saveLocal();
 status(localFailure?'기기 저장 공간 부족 · 서버 저장 확인 필요':connected&&syncReady?'기기 저장됨 · 서버 저장 중':'기기 저장됨 · 서버 연결 대기');
 clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
function appendDiff(d,path,a,b){if(b.length>=a.length&&JSON.stringify(a)===JSON.stringify(b.slice(0,a.length))){for(let i=a.length;i<b.length;i++)d[path+'/'+i]=b[i]}else d[path]=b.length?b:null}
function diff(a,b){const d={};
 for(const k of new Set([...Object.keys(a),...Object.keys(b)])){if(k==='comic'||k==='history')continue;if(JSON.stringify(a[k])!==JSON.stringify(b[k]))d[k]=b[k]===undefined?null:b[k]}
 appendDiff(d,'history',a.history||[],b.history||[]);
 for(let i=0;i<4;i++){const pa=a.comic?.[i]||{text:'',strokes:[]},pb=b.comic[i];if(pa.text!==pb.text)d['comic/'+i+'/text']=pb.text;appendDiff(d,'comic/'+i+'/strokes',pa.strokes||[],pb.strokes||[])}
 return d}
async function flush(){if(preview||teacher||!studentRef||!dirty||!syncReady||flushing)return;flushing=true;
 const version=s.updatedAt,cur=JSON.parse(JSON.stringify({...s,name}));
 try{if(!synced)await studentRef.set(cur);else{const d=diff(synced,cur);if(Object.keys(d).length)await studentRef.update(d)}
  synced=cur;if(s.updatedAt===version)dirty=false;status(dirty?'새 내용 저장 중':'기기·서버 저장 완료')}
 catch(e){status(localFailure?'저장 실패 · 화면을 닫지 마세요':'기기에 저장됨 · 서버 저장 재시도')}
 flushing=false;if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(flush,dirty&&connected?900:4000)}}
/* 서버 기록을 확인하기 전에는 서버에 아무것도 쓰지 않는다.
   다른 기기에서 하던 기록이 있으면 더 많이 진행한 쪽을 이어 간다. */
async function reconcile(){if(syncReady||reconciling||!studentRef)return;reconciling=true;
 try{const snap=await Promise.race([studentRef.once('value'),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),8000))]);const raw=snap.val();
  if(raw){const remote=normalize(raw);synced=JSON.parse(JSON.stringify({...remote,name:raw.name||name}));
   if(Number(remote.updatedAt)>baseUpdatedAt&&progress(remote)>=progress(s)){const wasOpen=$('drawing').open;if(wasOpen)$('drawing').close();document.body.style.overflow='';s=remote;saveLocal();if(started){render();toast('저장해 둔 기록을 불러왔어.')}}}
  syncReady=true;dirty=true;status('서버 연결됨');flush()}
 catch(e){status('기기 저장 사용 · 서버 연결 확인 중')}
 reconciling=false}

 db=app.database();base=db.ref('rooms/'+encodeURIComponent(room).replace(/\./g,'%2E')+'/v8/factoryGame/cityStoryV2');
 if(!teacher)studentRef=base.child('students/'+studentId);
 db.ref('.info/connected').on('value',snap=>{connected=!!snap.val();
  if(teacher){status(connected?'서버 연결됨':'서버 연결 대기');return}
  status(connected?(syncReady?'서버 연결됨':'저장한 내용 확인 중'):'서버 연결 대기 · 기기 저장 사용');
  if(connected){if(!syncReady)reconcile();else if(dirty)flush()}});

function validAt(step){switch(step){
 case 0:return s.assigned||s.companyQuizAnswers.length>=companyQuiz.length;
 case 1:return !!s.city&&s.evidence.length>=2&&long(s.reason,10);
 case 2:return !!(s.built&&s.year&&s.good&&s.bad);
 case 3:return !!s.resident&&long(s.missed,10);
 case 4:return s.policies.length>0&&budget()>=0&&long(s.policyWhy,10);
 case 6:return s.comic.every(p=>p.strokes.length>0&&long(p.text,10));
 case 7:return !!s.decision&&long(s.finalWhy,15)&&firstMissing()===7;
 default:return true}}

 return o+'</svg>'}

 $('joinForm').onsubmit=e=>{e.preventDefault();start()}}
async function start(){room=$('room').value.trim();name=teacher?'':$('name').value.trim().replace(/\s+/g,' ');
 if(!room||(!teacher&&!name))return toast('방 코드와 학번·이름을 입력해 줘.');
 $('join').disabled=true;studentId=encodeURIComponent(name).replace(/\./g,'%2E');
 if(teacher){connect();renderTeacher();return}
 try{localStorage.setItem('city-story-last',JSON.stringify({room,name}))}catch(e){}
 let local=null;try{local=JSON.parse(localStorage.getItem(localKey())||'null')}catch(e){}
 s=normalize(local);baseUpdatedAt=Number(s.updatedAt)||0;
 connect();

function renderMap(){const sel=cities.find(c=>c.id===s.inspect)||cities[0],cmp=cities.find(c=>c.id===s.compare&&c.id!==sel.id),opened=[...new Set([...(s.openCards[sel.id]||[]),...(sel.id===s.city?s.evidence:[])])];
 $('sceneTitle').textContent='아메리카 · 후보 도시 조사';setArt($('geo').innerHTML,'map');const svg=$('art').querySelector('svg');
 const xy=c=>[(c.lng+170)*5,(76-c.lat)*5],[nx,ny]=xy({lng:-74.006,lat:40.7128});
 let o='';cities.forEach(c=>{const[x,y]=xy(c);if(c.id===s.inspect)o+=`<path class="route" d="M${x} ${y}Q${(x+nx)/2+60} ${(y+ny)/2-30} ${nx} ${ny}"/>`});
 o+=`<g><circle cx="${nx}" cy="${ny}" r="6" fill="#8b77ae" stroke="#fff" stroke-width="2"/><rect x="${nx+10}" y="${ny-26}" width="150" height="24" rx="9" fill="#f3eefb"/><text x="${nx+85}" y="${ny-9}" text-anchor="middle" font-size="13" font-weight="700" fill="#5d4a80">뉴욕 · 본사 / 판매 시장</text></g>`;
 cities.forEach(c=>{const[x,y]=xy(c);o+=`<g class="pin" role="button" tabindex="0" aria-label="${c.name} 자료 보기" data-city="${c.id}"><circle cx="${x}" cy="${y}" r="${c.id===s.inspect?14:10}" fill="${c.id===s.city?'#668f71':'#e5aa98'}"/><rect x="${x-52+(c.id==='toronto'?-62:0)}" y="${y+18+(c.id==='toronto'?-32:0)}" width="104" height="27" rx="10" fill="#fffdf5" stroke="${c.id===s.inspect?'#6e9b83':'#dce3e3'}" stroke-width="${c.id===s.inspect?2.5:1}"/><text x="${x+(c.id==='toronto'?-62:0)}" y="${y+37+(c.id==='toronto'?-32:0)}" text-anchor="middle">${c.name}${c.id===s.city?' ✓':''}</text></g>`});
 svg.insertAdjacentHTML('beforeend',o);
 const inspect=id=>{s.inspect=id;if(s.compare===id)s.compare='';persist();renderMap();updateNext()};
 svg.querySelectorAll('[data-city]').forEach(g=>{g.onclick=()=>inspect(g.dataset.city);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect(g.dataset.city)}}});
 $('sceneBottom').innerHTML=cities.map(c=>`<button class="chip ${s.inspect===c.id?'selected':''}" data-inspect="${c.id}">${c.name}${c.id===s.city?' · 선택한 도시':''}</button>`).join('');
 document.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>inspect(b.dataset.inspect));
 const meter=(v,g)=>`<span class="meter"><strong>${v}</strong><span>${[1,2,3,4,5].map(n=>`<i class="${n<=v?'on':''}"></i>`).join('')}</span><span>${g} ${v<=2?'낮음':v===3?'보통':'높음'}</span></span>`;
 $('panel').innerHTML=`<p class="instruction" style="margin-top:0">카드를 뒤집어 정보를 확인하고, 근거 두 가지를 골라.</p><div class="row between"><div><h3 style="margin:0">${sel.name}</h3><small>${sel.region}</small></div><select id="compare" aria-label="비교할 도시" style="width:auto;max-width:190px"><option value="">다른 도시와 비교</option>${cities.filter(c=>c.id!==sel.id).map(c=>`<option value="${c.id}" ${cmp?.id===c.id?'selected':''}>${c.name}와 비교</option>`).join('')}</select></div><small>수업용 비교 지표 1~5 · 낮을수록 부담이 적음 · 실제 통계가 아님</small><div class="two" style="margin-top:8px">${factors.map((f,i)=>opened.includes(i)?`<div class="flipCard"><div class="cardFront"><div class="row"><b>${f}</b><button class="foldCard" data-fold="${i}" aria-label="${f} 카드 덮기">덮기</button></div>${meter(sel.index[i],factorGuides[i])}<p>${sel.desc[i]}</p>${cmp?`<small>${cmp.name}: ${factorGuides[i]} ${cmp.index[i]} / 5</small>`:''}<button class="pick ${s.evidence.includes(i)?'selected':''}" data-evidence="${i}" aria-pressed="${s.evidence.includes(i)}">${s.evidence.includes(i)?'근거로 선택됨':'근거로 선택'}</button></div></div>`:`<div class="flipCard"><button class="cardBack" data-flip="${i}"><span>조사 자료 ${i+1}</span><b>${f}</b><span>눌러서 뒤집기</span></button></div>`).join('')}</div><button id="chooseCity" class="${s.city===sel.id?'selected':'primary'}" style="width:100%;margin-top:10px">${s.city===sel.id?sel.name+' 선택됨':sel.name+'에 공장 짓기로 추천'}</button><label for="reason">입지 정보 두 가지를 활용해 이 도시를 추천하는 이유를 써 봐.</label><textarea id="reason" maxlength="240" placeholder="나는 이 도시를 추천한다. 그 이유는 …">${esc(s.reason)}</textarea><small>고른 근거: ${s.evidence.map(i=>factors[i]).join(' · ')||'아직 없음'}</small>`;
 $('compare').onchange=e=>{s.compare=e.target.value;persist();renderMap()};

 $('chooseCity').onclick=()=>{if(s.city===sel.id)return;if(s.city&&s.built&&!confirm('공장 위치를 바꿀까? 도시의 변화부터 다시 살펴봐야 해. 네 컷 그림은 그대로 보관돼.'))return;

function renderChanges(){const run=sceneRun,c=city();let phase=0;

  $('panel').innerHTML=`<span class="eyebrow">현장 보고 · 1년 후</span><h2>누구에게 어떤 변화가 생겼을까?</h2><p class="instruction">좋은 변화와 걱정되는 변화를 하나씩 확인하고 기록해.</p><div class="changeCard"><h3>새로운 일자리와 소득</h3><p>${c.good}</p><button id="good" class="${s.good?'selected':''}">${s.good?'좋은 변화로 기록함':'좋은 변화로 기록'}</button></div><div class="changeCard"><h3>${c.risk}에 대한 걱정</h3><p>${c.problem}</p><button id="bad" class="${s.bad?'selected':''}">${s.bad?'걱정되는 변화로 기록함':'걱정되는 변화로 기록'}</button></div><div class="row"><button id="replay">공장이 들어오는 과정 다시 보기</button></div><small>도시마다 나타날 수 있는 변화를 가정한 이야기야.</small>`;
  ['good','bad'].forEach(k=>$(k).onclick=()=>{if(s[k])return;s[k]=true;history(k==='good'?'좋은 변화 기록':'걱정되는 변화 기록');beep();after();updateNext()});
  $('replay').onclick=()=>{phase=0;before();advance()}}

  $('panel').innerHTML=`<span class="eyebrow">현장 보고 · 공장이 들어온 뒤</span><h2>도시는 어떻게 달라질까?</h2><p>${c.name}에 운동화 공장을 세울 준비가 됐어. 공장이 지어지고 주민들이 일터로 가는 모습을 살펴봐.</p><div id="storyCaption" class="dialogue" aria-live="polite">공장 건설을 시작하면 장면이 차례로 이어져.</div><p id="townProgress" class="muted"></p><div class="row"><button id="playTown" class="primary">공장 건설 시작</button><button id="skipScene" class="hidden">다음 장면</button></div>`;
  $('playTown').onclick=()=>{phase=0;beep('build');advance()};$('skipScene').onclick=()=>{clearTimeout(sceneTimer);advance()}}
 function advance(){if(run!==sceneRun||s.step!==2)return;clearTimeout(sceneTimer);phase++;

function comicHTML(data){return `<div class="comicGrid">${labels.map((label,i)=>`<article class="comic"><div class="caption"><b>${i+1}. ${label}</b></div><canvas width="1000" height="600" data-comic="${i}" role="img" aria-label="${label} 그림"></canvas><div class="caption">${esc(data.comic?.[i]?.text||'')}</div></article>`).join('')}</div>`}
function paintComic(container,data){container.querySelectorAll('[data-comic]').forEach(c=>paint(c,toArr(data.comic?.[+c.dataset.comic]?.strokes)))}
function panelDone(i){return s.comic[i].strokes.length>0&&long(s.comic[i].text,10)}
function renderComic(){const c=city(),guides=['공장이 들어오기 전 도시의 모습을 그려 보자.','네가 고른 곳에 공장이 들어오는 모습을 그려 보자.','기록해 둔 좋은 변화: '+c.good,'기록해 둔 걱정되는 변화: '+c.problem];
 $('panel').innerHTML=`<div class="comicHead"><div><h2>${esc(c.name)}의 변화를 네 컷으로</h2><p>그림을 누르면 큰 그림판이 열려. 네 컷 모두 그림과 설명(10자 이상)을 남겨 줘.</p></div><button id="saveComic">네 컷을 한 장의 이미지로 저장</button></div><div class="comicAll">${labels.map((label,i)=>`<article><h3>${i+1}. ${label}<span id="done${i}"></span></h3><button class="drawBtn" data-open="${i}" aria-label="${i+1}컷 크게 그리기"><canvas width="1000" height="600" data-comic="${i}"></canvas><em>눌러서 그리기</em></button><div class="side"><small>${esc(guides[i])}</small>${i===0?`<a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(c.name+' city')}" target="_blank" rel="noopener">${esc(c.name)} 도시 사진 찾아보기</a>`:''}<textarea aria-label="${i+1}컷 설명" data-caption="${i}" maxlength="240" placeholder="어떤 장면인지, 누구에게 영향을 주는지 적어 봐.">${esc(s.comic[i].text)}</textarea></div></article>`).join('')}</div>`;
 refreshComic();
 $('panel').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDrawing(+b.dataset.open));
 $('panel').querySelectorAll('[data-caption]').forEach(t=>t.oninput=()=>{s.comic[+t.dataset.caption].text=t.value;persist();comicMarks();updateNext()});
 $('saveComic').onclick=exportComic}
function comicMarks(){labels.forEach((_,i)=>{const el=$('done'+i);if(!el)return;const ok=panelDone(i);el.textContent=ok?'완성':s.comic[i].strokes.length?'설명 쓰기':'그림 그리기';el.className=ok?'ok':''})}
function refreshComic(){if(s.step!==6||!$('panel'))return;paintComic($('panel'),s);$('panel').querySelectorAll('.drawBtn').forEach((b,i)=>b.querySelector('em').classList.toggle('hidden',s.comic[i].strokes.length>0));comicMarks()}
function exportComic(){const out=document.createElement('canvas');out.width=2080;out.height=1640;const ctx=out.getContext('2d');ctx.fillStyle='#f0f3fa';ctx.fillRect(0,0,out.width,out.height);
 ctx.fillStyle='#34445a';ctx.font='bold 34px sans-serif';ctx.fillText(city().name+'의 변화 · '+name,24,50);
 s.comic.forEach((p,i)=>{const x=20+(i%2)*1030,y=80+Math.floor(i/2)*780,c=document.createElement('canvas');c.width=1000;c.height=600;paint(c,p.strokes);
  ctx.fillStyle='#34445a';ctx.font='bold 26px sans-serif';ctx.fillText((i+1)+'. '+labels[i],x,y+30);ctx.drawImage(c,x,y+45);ctx.font='22px sans-serif';let line='',lineY=y+680;
  for(const ch of p.text){if(ctx.measureText(line+ch).width>980){ctx.fillText(line,x,lineY);line='';lineY+=28}line+=ch}ctx.fillText(line,x,lineY)});
 out.toBlob(blob=>download(blob,'도시의-변화-네컷-'+name+'.png'),'image/png')}

/* ───────── 그림판 ───────── */
let drawIndex=0,activeStroke=null,activePointer=null,redoStack=[],erase=false;
function paint(canvas,strokes){const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineCap='round';ctx.lineJoin='round';
 for(const st of strokes){const pts=toArr(st?.points);if(!pts.length)continue;ctx.strokeStyle=st.erase?'#fff':st.color;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=st.width;ctx.beginPath();const p=pts[0];ctx.moveTo(p[0]*canvas.width,p[1]*canvas.height);
  for(const q of pts.slice(1))ctx.lineTo(q[0]*canvas.width,q[1]*canvas.height);
  if(pts.length===1){ctx.arc(p[0]*canvas.width,p[1]*canvas.height,st.width/2,0,Math.PI*2);ctx.fill()}else ctx.stroke()}}
function openDrawing(i){drawIndex=i;redoStack=[];$('drawTitle').textContent=(i+1)+'. '+labels[i];paint($('board'),s.comic[i].strokes);$('drawing').showModal();document.body.style.overflow='hidden'}
function finishStroke(){if(!activeStroke)return;s.comic[drawIndex].strokes.push(activeStroke);activeStroke=null;activePointer=null;redoStack=[];persist()}
function closeDrawing(){if(!$('drawing').open)return;finishStroke();$('drawing').close();document.body.style.overflow='';refreshComic();updateNext()}
function initDrawing(){const board=$('board'),r3=v=>Math.round(Math.max(0,Math.min(1,v))*1000)/1000,point=e=>{const r=board.getBoundingClientRect();return [r3((e.clientX-r.left)/r.width),r3((e.clientY-r.top)/r.height)]};
 const repaint=()=>paint(board,activeStroke?[...s.comic[drawIndex].strokes,activeStroke]:s.comic[drawIndex].strokes);
 board.onpointerdown=e=>{if(activeStroke||e.button>0)return;e.preventDefault();board.setPointerCapture(e.pointerId);activePointer=e.pointerId;activeStroke={color:$('color').value,width:+$('width').value,erase,points:[point(e)]};repaint()};
 board.onpointermove=e=>{if(!activeStroke||e.pointerId!==activePointer)return;e.preventDefault();const p=point(e),q=activeStroke.points[activeStroke.points.length-1];if(Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])<.003)return;activeStroke.points.push(p);repaint()};
 board.onpointerup=board.onpointercancel=e=>{if(e.pointerId===activePointer)finishStroke()};
 $('closeDraw').onclick=closeDrawing;$('drawing').oncancel=e=>{e.preventDefault();closeDrawing()};
 $('color').oninput=()=>{erase=false;$('eraser').classList.remove('selected')};
 $('eraser').onclick=()=>{erase=!erase;$('eraser').classList.toggle('selected',erase)};
 $('swatches').innerHTML=[['#34445a','남색'],['#e76f83','분홍'],['#eead61','주황'],['#f5d26c','노랑'],['#79b58d','초록'],['#71b7c8','하늘'],['#758ed1','파랑'],['#ad83bf','보라'],['#8a6a4f','갈색']].map(([c,n])=>`<button class="swatch" style="--c:${c}" data-color="${c}" aria-label="${n}"></button>`).join('');
 document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{$('color').value=b.dataset.color;erase=false;$('eraser').classList.remove('selected')});
 $('undo').onclick=()=>{finishStroke();const p=s.comic[drawIndex].strokes.pop();if(p)redoStack.push(p);repaint();persist()};
 $('redo').onclick=()=>{const p=redoStack.pop();if(p)s.comic[drawIndex].strokes.push(p);repaint();persist()};
 $('clear').onclick=()=>{if(confirm('이 컷의 그림을 모두 지울까?')){redoStack=[...s.comic[drawIndex].strokes].reverse();s.comic[drawIndex].strokes=[];repaint();persist()}}}

 $('sceneTitle').textContent='도시의 미래에 남기는 결정';$('art').style.overflow='auto';setArt(comicHTML(s),'plain');paintComic($('art'),s);
 $('sceneBottom').textContent='처음의 판단과 지금의 판단을 함께 남겨.';

 document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{s.decision=b.dataset.decision;s.submitted=false;history('최종 결정 선택');const v=$('finalWhy').value;s.finalWhy=v;renderFinal();updateNext()});

 $('root').innerHTML=`<main class="teacher"><div class="row between"><div><span class="eyebrow">TEACHER DESK · ${esc(room)}</span><h2>아이들이 바꾼 도시의 미래</h2></div><div class="row"><button id="preview">학생 화면 미리 보기</button><button id="backup">전체 기록 내려받기</button><a href="factory-game-legacy-20261123.html?mode=teacher&room=${encodeURIComponent(room)}" target="_blank" rel="noopener">이전 활동 기록</a><a href="index.html?mode=teacher&room=${encodeURIComponent(room)}">1~4단계 교사 화면</a></div></div><div class="hint"><div class="linkBox"><b>학생 입장 주소</b><code id="studentLink">${esc(link)}</code><button id="copyLink">주소 복사</button><a href="${esc(link)}" target="_blank" rel="noopener">새 창으로 열기</a></div></div><div class="hint"><div class="row"><b>함께 볼 화면</b><select id="targetStep" style="width:auto">${STEPS.map((st,i)=>`<option value="${st}" ${teacherStep===st?'selected':''}>${i+1}. ${titles[st]}</option>`).join('')}</select><button id="moveAll" class="primary">모두 이동</button><button id="moveOne">선택 학생 이동</button></div><small>제출한 학생도 이동할 수 있어. 그림과 응답은 보관돼. 이동 명령은 지금 접속해 있는 학생에게만 적용돼.</small></div><details><summary>자료 안내</summary><p>지도 경계: Natural Earth / datasets geo-countries. 도시 위치는 실제 좌표를 사용했습니다. 스텝(STEP)은 가상의 기업이며, 비교 지표·예산·주민 이야기와 변화는 비교·토론용 가상 자료로 실제 도시의 임금·물·주거 수준을 나타내지 않습니다.</p></details><div id="tCount" class="row" style="margin:12px 0"></div><div id="tSummary" class="summary"></div><div class="teacherGrid"><aside id="tRoster" class="roster"></aside><section id="tDetail" class="panel"></section></div></main>`;
 $('preview').onclick=()=>{savedPreview=s;preview=true;s=fresh();s.city='monterrey';render()};
