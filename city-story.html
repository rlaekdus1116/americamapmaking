let drawIndex=0,activeStroke=null,activePointer=null,redoStack=[],erase=false;
function paint(canvas,strokes){const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineCap='round';ctx.lineJoin='round';for(const st of strokes){if(!st.points?.length)continue;ctx.strokeStyle=st.erase?'#fff':st.color;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=st.width;ctx.beginPath();const p=st.points[0];ctx.moveTo(p[0]*canvas.width,p[1]*canvas.height);for(const q of st.points.slice(1))ctx.lineTo(q[0]*canvas.width,q[1]*canvas.height);if(st.points.length===1){ctx.arc(p[0]*canvas.width,p[1]*canvas.height,st.width/2,0,Math.PI*2);ctx.fill()}else ctx.stroke()}}
function openDrawing(i){drawIndex=i;redoStack=[];$('drawTitle').textContent=(i+1)+'. '+labels[i];paint($('board'),s.comic[i].strokes);$('drawing').showModal();document.body.style.overflow='hidden';}
function finishStroke(){if(!activeStroke)return;s.comic[drawIndex].strokes.push(activeStroke);activeStroke=null;activePointer=null;redoStack=[];persist();}
function closeDrawing(){if(!$('drawing').open)return;finishStroke();$('drawing').close();document.body.style.overflow='';if(s.step===6){paintComic($('art'),s);updateNext()}}
function initDrawing(){const board=$('board'),point=e=>{const r=board.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};board.onpointerdown=e=>{if(activeStroke||e.button>0)return;e.preventDefault();board.setPointerCapture(e.pointerId);activePointer=e.pointerId;activeStroke={color:$('color').value,width:+$('width').value,erase,points:[point(e)]};paint(board,[...s.comic[drawIndex].strokes,activeStroke])};board.onpointermove=e=>{if(!activeStroke||e.pointerId!==activePointer)return;e.preventDefault();activeStroke.points.push(point(e));paint(board,[...s.comic[drawIndex].strokes,activeStroke])};board.onpointerup=board.onpointercancel=e=>{if(e.pointerId===activePointer)finishStroke()};$('closeDraw').onclick=closeDrawing;$('drawing').oncancel=e=>{e.preventDefault();closeDrawing()};$('color').oninput=()=>{erase=false;$('eraser').classList.remove('selected')};$('eraser').onclick=()=>{erase=!erase;$('eraser').classList.toggle('selected',erase)};$('swatches').innerHTML=['#34445a','#e76f83','#eead61','#f5d26c','#79b58d','#71b7c8','#758ed1','#ad83bf'].map(c=>`<button class="swatch" style="--c:${c}" data-color="${c}" aria-label="${c} 색상"></button>`).join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{$('color').value=b.dataset.color;erase=false;$('eraser').classList.remove('selected')});$('undo').onclick=()=>{finishStroke();const p=s.comic[drawIndex].strokes.pop();if(p)redoStack.push(p);paint(board,s.comic[drawIndex].strokes);persist()};$('redo').onclick=()=>{const p=redoStack.pop();if(p)s.comic[drawIndex].strokes.push(p);paint(board,s.comic[drawIndex].strokes);persist()};$('clear').onclick=()=>{if(confirm('이 컷의 그림을 모두 지울까?')){redoStack=[...s.comic[drawIndex].strokes].reverse();s.comic[drawIndex].strokes=[];paint(board,[]);persist()}};}

window.addEventListener('DOMContentLoaded',()=>{initDrawing();$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'소리 켜짐':'소리 꺼짐';beep()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast('브라우저 메뉴에서 전체화면을 켜 줘.')}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'확대 닫기':'화면 확대'});$('galleryClose').onclick=()=>$('gallery').close();[-1,1].forEach((delta,i)=>{$(i?'galleryNext':'galleryPrev').onclick=()=>{const keys=Object.keys(students);teacherSelected=keys[(keys.indexOf(teacherSelected)+delta+keys.length)%keys.length];showGallery()}});join();});
