<!doctype html>
<html lang="ko">
<head>

<title>아메리카 지도 만들기 · 20나라 + 랜드마크 8곳 + 자연환경 5곳</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<style>
:root{
  --bg1:#fff9fb; --bg2:#f7f5ff; --ink:#5a5068; --sub:#8a8099;
  --pink:#ffd8ea; --pink2:#ffe7f2; --mint:#dff7ee; --lav:#ece6ff; --yel:#fff5c8; --sky:#ddf0ff;
  --line:#eadff1; --good:#2d9d77; --bad:#d86482; --chip:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at top left,#fff 0, var(--bg1) 35%, var(--bg2) 100%)}
header{position:sticky;top:0;z-index:10;padding:14px 18px;background:rgba(255,250,253,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.headIn{max-width:1320px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}.titleBadge{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--lav)}
#hdr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);padding:7px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(128,108,156,.08);font-size:14px}
main{max-width:1320px;margin:18px auto;padding:0 14px;display:grid;grid-template-columns:420px 1fr;gap:16px}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 10px 30px rgba(131,111,156,.09)}
.card h2,.card h3{margin:0 0 10px}
#photoWrap{position:relative;background:linear-gradient(135deg,#f6eeff,#ecfbf6);border-radius:24px;overflow:hidden;height:260px;border:1px solid var(--line)}
#img{width:100%;height:100%;object-fit:cover;display:block}
#cap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.88);padding:10px 12px;border-radius:18px;font-size:14px;backdrop-filter:blur(8px)}
#photoCredit{font-size:12px;color:var(--sub);margin-top:8px;min-height:18px}
#photoCredit a{color:inherit}
#qbox{background:#fffaf0;border:1px dashed #eddca0;border-radius:22px;padding:14px;margin-top:14px}
#qtext{font-size:17px;line-height:1.55;font-weight:700}
.subline{font-size:13px;color:var(--sub);margin:8px 0 0}
.bar{height:14px;border-radius:999px;background:#f2eef6;overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#f7c5e0,#d8f1e7,#d8e6ff);transition:width .35s}
#pieces{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.piece{padding:8px 12px;border-radius:999px;background:#f5f1f8;border:1px solid var(--line);font-size:13px;color:#9f98aa}
.piece.on{color:var(--ink);font-weight:700;transform:translateY(-1px)}
.msg{min-height:25px;font-weight:700;margin:12px 0 0}.ok{color:var(--good)}.ng{color:var(--bad)}
.waitBox{display:none;margin-top:10px;background:var(--yel);border:1px solid #eedf9d;padding:12px;border-radius:18px;font-weight:700;text-align:center}
.fact{display:none;background:var(--sky);border:1px solid #c8e0f2;padding:14px;border-radius:20px;margin-top:12px;line-height:1.6}
.fact b{display:block;margin-bottom:6px}
.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:12px 18px;background:linear-gradient(180deg,#ffe4f0,#ffd2e5);color:var(--ink);font-weight:800;box-shadow:0 6px 0 #f2bfd7, 0 12px 24px rgba(242,191,215,.35)}
.btn:hover{transform:translateY(1px)} .btn:active{transform:translateY(2px)} .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 6px 0 #e5dbe0}
.btn.mint{background:linear-gradient(180deg,#e9fbf4,#d5f5e7);box-shadow:0 6px 0 #bce7d2, 0 12px 24px rgba(188,231,210,.35)}
input{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--line);border-radius:18px;outline:none;background:#fff}
input:focus{box-shadow:0 0 0 4px rgba(221,208,255,.4)}
#map{height:640px;border-radius:26px;border:1px solid var(--line);overflow:hidden}
@media(max-width:980px){#map{height:500px}}
.rankBox{margin-top:14px}
.rankItem{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:8px}
.rankItem.me{background:#fff8cb;font-weight:800}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px} th{font-size:13px;color:var(--sub);font-weight:700;text-align:left;padding:0 10px}
td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;font-size:14px}
td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px} td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
.nameBtn{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline dotted;cursor:pointer;padding:0}
.muted{color:var(--sub);font-size:13px;line-height:1.5}
.joinWrap{max-width:460px;margin:50px auto}
.shake{animation:shake .36s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.smallPill{display:inline-block;padding:6px 10px;border-radius:999px;background:#f5f1fb;border:1px solid var(--line);font-size:12px;margin-right:6px}
@media(max-width:980px){main[style*="grid-template-columns"]{grid-template-columns:1fr!important}}
#photoWrap{margin-top:14px}
#nextWrap{min-height:18px}
.btn.secondary{background:#f5f0fc;border:1px solid var(--line)}
</style>

<body>
<header>
  <div class="headIn">
    <h1>아메리카 지도 만들기 <span class="titleBadge">나라 20 · 랜드마크 8 · 자연 5</span></h1>

<script>
/* 아메리카 지도 만들기 / Firebase 연결 방식: Firebase Hosting 자동 초기화 URL.
   GitHub 소스에는 API 키를 직접 넣지 않습니다. */
const PROJECT_ID = 'americamapmaking';
const DATABASE_URL = 'https://americamapmaking-default-rtdb.firebaseio.com';
const COUNTRY_GEO = 'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json';
const params = new URLSearchParams(location.search);
const ROOM = params.get('room') || 'demo';
const TEACHER = params.get('mode') === 'teacher' || params.get('t') === '1';
const QUIZ_ONLY = params.get('mode') === 'quiz';
const roomKey = encodeURIComponent(ROOM).replace(/\./g,'%2E');
const PLAYERS_PATH = 'rooms/' + roomKey + '/v8/players';
const $ = id => document.getElementById(id);
const app = $('app');
const localMem = {};
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return localMem[k]||null}},
  set(k,v){localMem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del(k){delete localMem[k];try{localStorage.removeItem(k)}catch(e){}}
};
let db = null, playersRef = null, playerRef = null, playerListener = null, playersListener = null;
let me = null, map = null, geo = null, pick = null, target = null, lastAll = {}, selectedKey = '';
let countdownTimer = null, photoNonce=0, serverOffset=0, renderedSig='', submitting=false, firebaseState='connecting', serverVerified=false;
const serverNow=()=>Date.now()+serverOffset;
const MAX_TRIES=3, COOLDOWN_MS=10000, COUNTRY_END=20, CITY_END=28;
let questionClock=null, labelLayer=null;
const phaseAt = i => i<COUNTRY_END?'country':i<CITY_END?'city':'nature';
const phaseName = i => i<COUNTRY_END?'1단계: 나라 퍼즐':i<CITY_END?'2단계: 랜드마크':'3단계: 자연환경';
function secondsInQuestion(){return !me?0:Math.max(0,Math.floor((Number(me.pausedElapsed)||0)+(me.paused?0:(serverNow()-(me.startedAt||serverNow()))/1000)));}
function updateClock(){
  const el=$('elapsedClock');if(!el||!me)return;
  const s=me.pending?Math.max(0,me.pending.seconds||0):secondsInQuestion();
  el.textContent='소요 시간 '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function armClock(){clearInterval(questionClock);updateClock();questionClock=setInterval(updateClock,1000);}
function totalTime(p){return Math.max(0,Number(p.timeSpent)||0);}
function iconArt(type){
  const icons={
    compass:'<circle cx="18" cy="18" r="13"/><path d="m24 12-5 9-9 4 4-9Z"/><path d="m16 18 4 2"/>',
    pin:'<path d="M18 32S6 21 6 15a12 12 0 1 1 24 0c0 6-12 17-12 17Z"/><circle cx="18" cy="15" r="4"/>',
    puzzle:'<path d="M4 5h10c-2-6 7-6 6 0h11v10c-5-1-5 7 0 6v10H20c1-5-7-5-6 0H4V21c5 1 5-7 0-6Z"/>',
    star:'<path d="m18 3 4.6 9.4L33 14l-7.5 7.4 1.8 10.5L18 27l-9.3 4.9 1.8-10.5L3 14l10.4-1.6Z"/>',
    clock:'<circle cx="18" cy="18" r="13"/><path d="M18 9v10l7 3"/>',
    book:'<path d="M5 7Q13 4 18 10q8-6 13-3v23q-8-3-13 3-5-6-13-3Z"/><path d="M18 10v23"/>',
    pen:'<path d="m6 26 17-18 5 5-17 18-8 2Z"/><path d="m20 11 5 5"/>'
  };
  return '<svg class="sketch-icon" width="24" height="24" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[type]||icons.compass)+'</svg>';
}


/* 문제는 나라별로 분산시키고, 실제 정답은 특정 건물/유적/지점 좌표로 한정합니다. */
const LEGACY_QUESTION_UIDS = ["country-1","country-2","country-3","country-4","country-5","country-6","country-7","country-8","country-9","country-10","country-11","country-12","country-13","country-14","country-15","country-16","country-17","country-18","country-19","country-20","country-21","country-22","country-23","country-24","country-25","country-26","country-27","country-28","country-29","country-30","country-31","country-32","country-33","country-34","country-35","city-1","city-2","city-3","city-4","city-5","city-6","city-7","city-8","nature-1","nature-2","nature-3","nature-4","nature-5","nature-6","nature-7","nature-8","nature-9"];
const PROBLEMS = [{"wiki":"Statue_of_Liberty","caption":"미국 나라 퀴즈","q":"프랑스가 미국의 독립을 기념해 선물한 거대한 횃불 든 동상이 항구에 서 있어요. 어느 나라일까요?","answer":"미국","country":"United States of America","lat":39.3,"lng":-98.5,"fact":"자유의 여신상은 뉴욕 항구 리버티섬에 있어요.","stage":"country","aliases":[],"uid":"country-1"},{"wiki":"Canadian_Rockies","caption":"캐나다 나라 퀴즈","q":"로키산맥의 밴프 국립공원, 오대호 그리고 단풍잎 국기로 유명한 북쪽의 넓은 나라예요.","answer":"캐나다","country":"Canada","lat":55,"lng":-109,"fact":"밴프 국립공원은 북아메리카의 캐나다 로키산맥에 있어요.","stage":"country","aliases":[],"uid":"country-2"},{"wiki":"Chichen_Itza","caption":"멕시코 나라 퀴즈","q":"유카탄반도에 마야 문명의 계단식 피라미드가 남아 있고 수도가 높은 고원에 자리한 나라예요.","answer":"멕시코","country":"Mexico","lat":23.4,"lng":-102.3,"fact":"치첸이트사는 유카탄반도에 있는 마야 유적이에요.","stage":"country","aliases":[],"uid":"country-3"},{"wiki":"Tikal","caption":"과테말라 나라 퀴즈","q":"열대우림 속 고대 마야 피라미드 신전 '티칼'이 있는 중앙아메리카 나라예요.","answer":"과테말라","country":"Guatemala","lat":15.8,"lng":-90.4,"fact":"티칼은 이 나라 북부에 남아 있는 마야 유적이에요.","stage":"country","aliases":[],"uid":"country-4"},{"wiki":"Arenal_Volcano","caption":"코스타리카 나라 퀴즈","q":"군대가 없고 화산·열대우림 생태 관광으로 유명한 중앙아메리카 나라예요.","answer":"코스타리카","country":"Costa Rica","lat":9.8,"lng":-84.2,"fact":"아레날 화산은 이 나라의 대표 자연경관이에요.","stage":"country","aliases":[],"uid":"country-9"},{"wiki":"Panama_Canal","caption":"파나마 나라 퀴즈","q":"대서양과 태평양을 배가 오갈 수 있도록 갑문이 있는 거대한 운하를 건설한 나라예요.","answer":"파나마","country":"Panama","lat":8.6,"lng":-80,"fact":"운하는 중미의 지협을 가로질러 두 대양을 연결해요.","stage":"country","aliases":[],"uid":"country-10"},{"wiki":"Havana","caption":"쿠바 나라 퀴즈","q":"카리브해의 큰 섬나라로, 수도에 올드카와 스페인 식민지 시대 건물이 많이 남아 있어요.","answer":"쿠바","country":"Cuba","lat":21.5,"lng":-79.4,"fact":"아바나는 카리브해에 있는 이 나라의 수도예요.","stage":"country","aliases":[],"uid":"country-11"},{"wiki":"Dunn%27s_River_Falls","caption":"자메이카 나라 퀴즈","q":"레게 음악과 계단처럼 흘러내리는 던스리버 폭포가 유명한 카리브해 섬나라예요.","answer":"자메이카","country":"Jamaica","lat":18.1,"lng":-77.3,"fact":"던스리버 폭포는 이 나라 북부 해안에 있어요.","stage":"country","aliases":[],"uid":"country-12"},{"wiki":"Citadelle_Laferri%C3%A8re","caption":"아이티 나라 퀴즈","q":"히스파니올라섬 서쪽을 차지하며 독립 혁명 이후 높은 산에 거대한 라페리에르 요새를 지은 나라예요.","answer":"아이티","country":"Haiti","lat":19,"lng":-72.7,"fact":"라페리에르 요새는 이 나라의 역사적 유적이에요.","stage":"country","aliases":[],"uid":"country-13"},{"wiki":"Columbus_Lighthouse","caption":"도미니카공화국 나라 퀴즈","q":"히스파니올라섬 동쪽을 차지하며 수도 산토도밍고에 콜럼버스 등대가 있는 나라예요.","answer":"도미니카공화국","country":"Dominican Republic","lat":19,"lng":-70.4,"fact":"콜럼버스 등대는 수도 산토도밍고에 있어요.","stage":"country","aliases":["도미니카 공화국"],"uid":"country-14"},{"wiki":"Christ_the_Redeemer_(statue)","caption":"브라질 나라 퀴즈","q":"남아메리카에서 가장 넓은 나라로, 대도시의 산 위에 두 팔을 벌린 거대한 예수상이 있어요.","answer":"브라질","country":"Brazil","lat":-10.8,"lng":-53,"fact":"구세주 그리스도상은 리우데자네이루에 있어요.","stage":"country","aliases":[],"uid":"country-19"},{"wiki":"Perito_Moreno_Glacier","caption":"아르헨티나 나라 퀴즈","q":"탱고의 발상지로 유명하고, 파타고니아의 거대한 페리토 모레노 빙하를 볼 수 있는 나라예요.","answer":"아르헨티나","country":"Argentina","lat":-36.2,"lng":-64.1,"fact":"페리토 모레노 빙하는 남쪽 파타고니아에 있어요.","stage":"country","aliases":[],"uid":"country-20"},{"wiki":"Atacama_Desert","caption":"칠레 나라 퀴즈","q":"태평양 연안을 따라 남북으로 아주 길게 뻗었고, 북부의 아타카마 사막으로 유명한 나라예요.","answer":"칠레","country":"Chile","lat":-33.5,"lng":-71,"fact":"아타카마 사막은 이 나라 북부에 있어요.","stage":"country","aliases":[],"uid":"country-21"},{"wiki":"Machu_Picchu","caption":"페루 나라 퀴즈","q":"안데스산맥 높은 곳에 잉카 제국의 석조 산악 도시 마추픽추가 남아 있는 나라예요.","answer":"페루","country":"Peru","lat":-10.3,"lng":-75.2,"fact":"마추픽추는 잉카 문명의 대표 유적이에요.","stage":"country","aliases":[],"uid":"country-22"},{"wiki":"Salar_de_Uyuni","caption":"볼리비아 나라 퀴즈","q":"안데스 고원에 비가 내리면 거울처럼 하늘이 비치는 거대한 우유니 소금사막이 있는 나라예요.","answer":"볼리비아","country":"Bolivia","lat":-17.1,"lng":-64.1,"fact":"우유니 소금사막은 이 나라 서부 고지대에 있어요.","stage":"country","aliases":[],"uid":"country-23"},{"wiki":"Gal%C3%A1pagos_Islands","caption":"에콰도르 나라 퀴즈","q":"국토를 적도가 지나며, 다윈의 연구로 유명한 갈라파고스 제도를 가진 나라예요.","answer":"에콰도르","country":"Ecuador","lat":-1.5,"lng":-78.9,"fact":"갈라파고스 제도는 이 나라 영토예요.","stage":"country","aliases":[],"uid":"country-24"},{"wiki":"Cartagena,_Colombia","caption":"콜롬비아 나라 퀴즈","q":"카리브해 연안의 역사 도시 카르타헤나와 안데스 고원 수도로 유명한 나라예요.","answer":"콜롬비아","country":"Colombia","lat":4.3,"lng":-73.8,"fact":"카르타헤나는 이 나라의 카리브해 항구 도시예요.","stage":"country","aliases":[],"uid":"country-25"},{"wiki":"Angel_Falls","caption":"베네수엘라 나라 퀴즈","q":"테이블산 절벽에서 매우 높게 떨어지는 앙헬 폭포로 유명한 남아메리카 나라예요.","answer":"베네수엘라","country":"Venezuela","lat":7.1,"lng":-66,"fact":"앙헬 폭포는 카나이마 국립공원에 있어요.","stage":"country","aliases":[],"uid":"country-26"},{"wiki":"Asunci%C3%B3n","caption":"파라과이 나라 퀴즈","q":"남아메리카 내륙에 있으며 과라니어와 스페인어를 공용어로 사용하고 수도가 아순시온인 나라예요.","answer":"파라과이","country":"Paraguay","lat":-23.5,"lng":-58,"fact":"아순시온은 이 내륙국의 수도예요.","stage":"country","aliases":[],"uid":"country-29"},{"wiki":"La_Mano_de_Punta_del_Este","caption":"우루과이 나라 퀴즈","q":"남아메리카 남동쪽 해안에 있으며 모래사장에서 손가락이 솟은 조각상 '라 마노'가 유명한 나라예요.","answer":"우루과이","country":"Uruguay","lat":-32.5,"lng":-56,"fact":"라 마노는 푼타델에스테 해변에 있어요.","stage":"country","aliases":[],"uid":"country-30"},{"answer":"자유의 여신상","country":"United States of America","wiki":"Statue_of_Liberty","lat":40.6892,"lng":-74.0445,"q":"미국 뉴욕 항구에 있는 거대한 동상으로, 머리에는 왕관을 쓰고 한 손에는 횃불을 들고 있어요. 프랑스가 미국에 선물한 이 상징물은?","fact":"자유의 여신상은 미국 뉴욕에 있어요. 프랑스가 미국 독립을 기념하며 선물한 세계적으로 유명한 상징물이에요.","uid":"landmark-liberty","aliases":["자유의여신상"],"caption":"주요국가 랜드마크","stage":"city"},{"answer":"CN타워","country":"Canada","wiki":"CN_Tower","lat":43.6426,"lng":-79.3871,"q":"캐나다 토론토에 있는 높고 뾰족한 탑이에요. 도시를 내려다보는 전망대가 있는 이 유명한 탑의 이름은?","fact":"CN타워는 캐나다 토론토의 대표적인 랜드마크예요. 온타리오호 가까이에 있어요.","uid":"city-7","aliases":["씨엔타워","CN 타워"],"caption":"주요국가 랜드마크","stage":"city"},{"answer":"치첸이트사","country":"Mexico","wiki":"Chichen_Itza","lat":20.6843,"lng":-88.5678,"q":"멕시코 유카탄반도에 있는 마야 문명 유적이에요. 엘 카스티요라고 불리는 계단식 피라미드가 유명한 이 유적은?","fact":"치첸이트사는 멕시코 유카탄반도의 마야 문명 유적이에요. 계단식 피라미드가 대표적인 건축물이에요.","uid":"city-6","aliases":["치첸 이트사","치첸잇사"],"caption":"주요국가 랜드마크","stage":"city"},{"answer":"파나마 운하","country":"Panama","wiki":"Panama_Canal","lat":9.08,"lng":-7 function km(a,b,c,d){const r=v=>v*Math.PI/180,da=r(c-a),db=r(d-b),h=Math.sin(da/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(db/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(h)));}

function stableShuffle(a,key){
 let h=2166136261;for(const ch of ROOM+'/'+key)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;
 let values=a.slice();
 const rand=()=>{h=(h+0x6d2b79f5)>>>0;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
 for(let i=values.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[values[i],values[j]]=[values[j],values[i]];}return values;
}
function createQuestionOrder(name,countryDone=[],landmarkDone=[]){
 const cs=Array.from({length:COUNTRY_END},(_,i)=>i);
 const ls=Array.from({length:CITY_END-COUNTRY_END},(_,i)=>i+COUNTRY_END);
 const clean=(list,full)=>[...new Set(list)].filter(n=>full.includes(n));
 const c=clean(countryDone,cs),l=clean(landmarkDone,ls);
 return [...c,...stableShuffle(cs.filter(n=>!c.includes(n)),name+' country'),
         ...l,...stableShuffle(ls.filter(n=>!l.includes(n)),name+' landmark'),
         ...Array.from({length:PROBLEMS.length-CITY_END},(_,i)=>i+CITY_END)];
}
function validQuestionOrder(o){
 return Array.isArray(o)&&o.length===PROBLEMS.length&&new Set(o).size===PROBLEMS.length&&o.every((n,i)=>Number.isInteger(n)&&(i<COUNTRY_END?n>=0&&n<COUNTRY_END:i<CITY_END?n>=COUNTRY_END&&n<CITY_END:n===i));
}
function ensureQuestionOrder(p){if(!validQuestionOrder(p.questionOrder))p.questionOrder=createQuestionOrder(p.id||p.name||'');return p;}
function questionAt(n,record=me){return PROBLEMS[record&&validQuestionOrder(record.questionOrder)?record.questionOrder[n]:n];}

function readClassLink(){
 // iOS Safari and some in-app browsers can lose URL fragments during link transfer.
 // Accept an ordinary query parameter, too, and keep compatibility with older hash links.
 const search=new URLSearchParams(location.search);
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 const key=search.get('connect')||hash.get('connect');
 if(!key||!/^AIza[\w-]{20,}$/.test(key))return false;
 store.set('amap-firebase-key',key);
 try{
   const clean=new URL(location.href);
   clean.searchParams.delete('connect');
   clean.hash='';
   history.replaceState(null,'',clean.pathname+clean.search);
 }catch(e){}
 return true;
}

function migrateGameFormat(old){
 const p={...old};
 if(Number(p.schemaVersion||8)<9){
   if(Number(p.cur)>=30)p.cur=Number(p.cur)+5;
   if(p.pending&&Number(p.pending.idx)>=30)p.pending={...p.pending,idx:Number(p.pending.idx)+5};
   p.schemaVersion=9;
 }
 if(Number(p.schemaVersion)>=11)return ensureQuestionOrder(p);
 const oldCur=Math.max(0,Math.min(LEGACY_QUESTION_UIDS.length,Number(p.cur)||0));
 const lookup=new Map(PROBLEMS.map((q,i)=>[q.uid||q.wiki,i]));
 const selected=LEGACY_QUESTION_UIDS.slice(0,Math.min(oldCur,35)).map(id=>lookup.get(id)).filter(i=>Number.isInteger(i)&&i<COUNTRY_END);
 const landmarkDone=Math.max(0,Math.min(8,oldCur-35));
 const oldMatches=LEGACY_QUESTION_UIDS.slice(35,35+landmarkDone).map(id=>lookup.get(id)).filter(i=>Number.isInteger(i)&&i>=COUNTRY_END&&i<CITY_END);
 const landmarks=[...new Set(oldMatches)];
 for(let i=COUNTRY_END;i<CITY_END&&landmarks.length<landmarkDone;i++)if(!landmarks.includes(i))landmarks.push(i);
 let newCur=selected.length;
 if(oldCur>=35)newCur=COUNTRY_END+landmarks.length;
 if(oldCur>=43){
  const nature=LEGACY_QUESTION_UIDS.slice(43,oldCur).filter(id=>{const v=lookup.get(id);return Number.isInteger(v)&&v>=CITY_END;}).length;
  newCur=CITY_END+nature;
 }
 p.questionOrder=createQuestionOrder(p.id||p.name||'',selected,landmarks);
 p.cur=Math.min(PROBLEMS.length,newCur);p.done=p.cur;
 if(p.pending){
  const found=lookup.get(LEGACY_QUESTION_UIDS[p.pending.idx]);
  const pos=Number.isInteger(found)?p.questionOrder.indexOf(found):-1;
  p.pending=pos>=0?{...p.pending,idx:pos}:null;
 }
 p.unlocked=(Array.isArray(p.unlocked)?p.unlocked:[]).filter(v=>COUNTRIES.some(x=>x.en===v));
 p.teacherSkipped=Array.isArray(p.teacherSkipped)?p.teacherSkipped.filter(i=>Number(i)<p.cur):[];
 p.schemaVersion=11;
 return p;
}
async function restoreOfflineStudent(name){
 if(!db||firebaseState==='offline')return false;
 const key=nameKey(name),doneKey='amap-synced-v9-'+ROOM+'-'+key;
 if(store.get(doneKey)==='yes')return false;
 let records={};
 try{records=JSON.parse(store.get('amap-local-v8-'+ROOM)||'{}');}catch(e){}
 const original=records[key];
 if(!original)return false;
 const saved=migrateGameFormat(original);
 const ref=db.ref(playerPath(name));
 const tx=await ref.transaction(remote=>{
  if(!remote)return saved;
  const old=norm(remote,key),local=norm(saved,key);
  if(local.cur>old.cur)return saved;
  if(local.cur===old.cur&&local.score>old.score&&local.done>=old.done)return saved;
  if(local.cur===old.cur&&local.tries>old.tries&&local.done>=old.done)return saved;
  return;
 });
 if(!tx.snapshot.exists())throw Error('학생의 이전 기록을 서버에 올리지 못했어요.');
 // Keep local copy intact as backup. Only remember success when a server record exists.
 store.set(doneKey,'yes');
 return true;
}

async function verifyServerConnection(){
 if(!db||!playersRef)throw Error('Firebase 설정이 없습니다.');
 const info=db.ref('.info/connected');
 await new Promise((resolve,reject)=>{
  let settled=false,timer;
  const finish=error=>{
   if(settled)return;settled=true;clearTimeout(timer);info.off('value',onVal);
   if(error)reject(error);else resolve();
  };
  const onVal=s=>{if(s.val()===true)finish();};
  timer=setTimeout(()=>finish(new Error('Firebase 연결 시간 초과. 네트워크를 확인하세요.')),14000);
  info.on('value',onVal,e=>finish(e));
 });
 await Promise.race([
  playersRef.limitToFirst(1).once('value'),
  new Promise((_,reject)=>setTimeout(()=>reject(new Error('학생 기록 읽기를 확인하지 못했어요.')),10000))
 ]);
 if(firebaseState!=='online')throw Error('Firebase 실시간 연결이 끊겼어요.');
 serverVerified=true;showConn();
}

function offlineDb(){
 const storage='amap-local-v8-'+ROOM, watchers=new Map();
 const read=()=>{try{return JSON.parse(store.get(storage)||'{}')}catch(e){return {}}};
 const makeSnap=v=>({val:()=>v,exists:()=>v!=null});
 const notify=()=>{const all=read();for(const [path,subs] of watchers){const v=path===PLAYERS_PATH?all:all[path.slice(PLAYERS_PATH.length+1)]||null;for(const cb of subs)cb(makeSnap(v));}};
 window.addEventListener('storage',e=>{if(e.key===storage)notify()});
 return {ref(path){return {
  on(event,cb){if(event!=='value')return;if(!watchers.has(path))watchers.set(path,new Set());watchers.get(path).add(cb);const all=read();cb(makeSnap(path===PLAYERS_PATH?all:all[path.slice(PLAYERS_PATH.length+1)]||null));},
  off(event,cb){if(!watchers.has(path))return;if(cb)watchers.get(path).delete(cb);else watchers.delete(path)},
  async transaction(update){const all=read(),key=path.slice(PLAYERS_PATH.length+1),old=all[key]||null,next=update(old);if(next===undefined)return {committed:false,snapshot:makeSnap(old)};all[key]=next;store.set(storage,JSON.stringify(all));notify();return {committed:true,snapshot:makeSnap(next)};}
 }}};
}

function pendingCountryPiecePlaced(p,record=me){
 if(!p||p.stage!=='country')return true;

function resultPointInRing(ring,lng,lat){
 let inside=false;
 if(!Array.isArray(ring))return false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
  const a=ring[i],b=ring[j];
  if((a[1]>lat)!==(b[1]>lat) &&
      lng<(b[0]-a[0])*(lat-a[1])/(b[1]-a[1])+a[0])inside=!inside;
 }
 return inside;
}
function resultHitTarget(geometry,lng,lat){
 if(!geometry)return false;
 const inPoly=poly=>Array.isArray(poly)&&poly.length>0&&resultPointInRing(poly[0],lng,lat)&&
  !poly.slice(1).some(hole=>resultPointInRing(hole,lng,lat));
 if(geometry.type==='Polygon')return inPoly(geometry.coordinates);
 if(geometry.type==='MultiPolygon')return geometry.coordinates.some(inPoly);
 return false;
}

  return r.json();
 }).catch(e=>{resultGeoDataPromise=null;throw e;});
 return resultGeoDataPromise;
}
function countryPuzzleSilhouette(geometry){
 const polys=geometry?.type==='Polygon'?[geometry.coordinates]:
  geometry?.type==='MultiPolygon'?geometry.coordinates:[];
 const outer=polys.map(x=>x&&x[0]).filter(r=>Array.isArray(r)&&r.length>2);
 if(!outer.length)return '';
 const coords=outer.flat().filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
 if(!coords.length)return '';
 let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity;
 for(const pt of coords){xMin=Math.min(xMin,pt[0]);xMax=Math.max(xMax,pt[0]);yMin=Math.min(yMin,pt[1]);yMax=Math.max(yMax,pt[1]);}
 const spanX=Math.max(.01,xMax-xMin),spanY=Math.max(.01,yMax-yMin);
 const scale=Math.min(220/spanX,132/spanY);
 const offsetX=120-(spanX*scale)/2,offsetY=75-(spanY*scale)/2;
 const toPoint=pt=>[(offsetX+(pt[0]-xMin)*scale).toFixed(2),(offsetY+(yMax-pt[1])*scale).toFixed(2)].join(',');
 const paths=outer.map(r=>'M'+r.map(toPoint).join('L')+'Z').join(' ');
 return '<svg class="countryPieceSvg" viewBox="0 0 240 150" role="img" aria-label="나라 모양 지도 조각">'+
   '<path d="'+paths+'" fill="#9edbf0" stroke="#42678d" stroke-width="2.4" stroke-linejoin="round" fill-rule="evenodd"/>'+
   '</svg>';
}
function countryPieceRegion(country){
 if(['Cuba','Jamaica','Haiti','Dominican Republic'].includes(country))
  return {name:'카리브해 지역',bounds:[[10,-90],[28,-57]]};
 if(['Guatemala','Costa Rica','Panama'].includes(country))
  return {name:'중앙아메리카',bounds:[[4,-100],[24,-73]]};
 if(['United States of America','Canada','Mexico'].includes(country))

 return {name:'남아메리카',bounds:[[-57,-85],[15,-32]]};
}

async function saveCountryPiece(p){
 if(resultPieceSaving||!me?.pending||!playerRef||!serverVerified||firebaseState!=='online')return;
 if(pendingCountryPiecePlaced(p)){updatePieceUI(p);return;}
 if(questionAt(me.pending.idx,me)?.country!==p.country)return;
 const idx=me.pending.idx;
 resultPieceSaving=true;updatePieceUI(p);
 try{
  const tx=await playerRef.transaction(current=>{
   if(!current?.pending||Number(current.pending.idx)!==Number(idx))return;
   const x=norm(current,me.id);
   const actual=questionAt(x.pending.idx,x);
   if(!actual||actual.stage!=='country'||actual.country!==p.country)return;
   if(x.pending.piecePlaced===true)return;
   x.pending={...x.pending,piecePlaced:true};
   if(!x.unlocked.includes(actual.country))x.unlocked.push(actual.country);
   x.t=serverNow();
   return x;
  });
  if(!tx.committed||!tx.snapshot.exists())throw Error('조각 저장에 실패했어요.');

 }catch(e){resultPieceStatus('저장 오류. 조각을 다시 놓아 줘.','ng');}

 $('resultReward').textContent='';$('resultReward').hidden=true;$('resultReward').style.display='none';
 const next=$('nextBtn');
 next.textContent=me.cur>=PROBLEMS.length?'최종 결과 보기':'다음 문제';
 // Only a deliberate mouse click or touch on Next may move to the next question.
 // A held Enter key must NEVER trigger Next after submitting the answer.
 let pointerArmed=false;
 next.type='button';
 next.onpointerdown=e=>{pointerArmed=e.isPrimary&&e.button===0;};
 next.onpointercancel=()=>{pointerArmed=false;};
 next.onkeydown=e=>{
   if(e.key==='Enter'||e.key===' '){
     e.preventDefault();e.stopPropagation();
   }
 };
 next.onclick=e=>{
   e.preventDefault();
   const fromPointer=pointerArmed && e.detail>0;
   pointerArmed=false;
   if(!fromPointer||modal.hidden||next.disabled)return;
   nextProblem();
 };
 modal.hidden=false;
 setupPiecePlacement(p);
 setTimeout(()=>drawResultMap(p),0);
 updateCooldownUI();
 // Do not focus the Next button: an Enter keyup can activate it immediately.
}

function cleanAnswer(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[\s\-_.·()]/g,'');}
async function guessTyped(){
 if(!serverVerified||firebaseState!=='online'){showConn();hintStatus('서버 연결이 없어 제출할 수 없어요.','ng');return;}
 if(!playerRef||!me||submitting||me.pending||me.paused||me.cur>=PROBLEMS.length)return;
 if(me.coolUntil>serverNow()){updateCooldownUI();return;}
 const idx=me.cur,p=questionAt(idx,me),given=$('answerInput')?.value.trim()||'';
 if(!p||!given){hintStatus('답을 입력해 주세요.','ng');return;}
 const questionUID=p.uid||p.wiki;
 submitting=true;hintStatus('답을 서버에서 확인하고 있어요...');
 try{
   const tx=await playerRef.transaction(current=>{
     if(!current)return;
     const x=norm(current,me.id),now=serverNow();
     if(x.pending||x.paused||x.cur!==idx||x.tries>=MAX_TRIES||x.coolUntil>now)return;
     // Verify that the exact question shown on the student's screen is still current in Firebase.
     const actual=questionAt(x.cur,x);
     if(!actual||(actual.uid||actual.wiki)!==questionUID)return;
     const variants=[actual.answer,...(actual.aliases||[])];
     if(actual.stage==='country'&&actual.country)variants.push(actual.country);
     const correct=variants.some(s=>cleanAnswer(given)===cleanAnswer(s));
     x.lastSubmission={id:questionUID,position:idx,given,correct,at:now};
     if(correct){
       const attempt=x.tries+1;
       const seconds=Math.max(0,Math.round((Number(x.pausedElapsed)||0)+(x.paused?0:(now-(x.startedAt||now))/1000)));
       const speed=Math.max(0,30-Math.floor(seconds/2));
       const points=(attempt===1?100:attempt===2?60:25)+speed;
       x.score+=points;x.done++;x.cur++;x.timeSpent+=seconds;
       x.log.push({id:questionUID,q:actual.answer,result:'correct',attempts:attempt,score:points,seconds,at:now});
       x.pending={mode:'correct',idx,points,seconds,...(actual.stage==='country'?{piecePlaced:false}:{})};x.tries=0;x.coolUntil=0;
     }else{
       x.tries++;x.coolUntil=now+COOLDOWN_MS;
       x.wrongAttempts=[...x.wrongAttempts,{id:questionUID,position:idx,given,at:now,attempt:x.tries}].slice(-40);
       if(x.tries>=MAX_TRIES){
         x.done++;x.cur++;
         const seconds=Math.max(0,Math.round((Number(x.pausedElapsed)||0)+(x.paused?0:(now-(x.startedAt||now))/1000)));
         x.timeSpent+=seconds;
         x.log.push({id:questionUID,q:actual.answer,result:'missed',attempts:3,score:0,seconds,at:now});
         x.pending={mode:'giveup',idx,points:0,seconds,...(actual.stage==='country'?{piecePlaced:false}:{})};x.tries=0;
       }
     }
     x.t=now;return x;
   });
   if(!tx.snapshot.exists()){hintStatus('저장에 실패했어요. Firebase 연결을 확인해 주세요.','ng');return;}
   me=norm(tx.snapshot.val(),me.id);
   if(!tx.committed){
      // No incorrect-answer penalty if another device/teacher changed the current problem.
      hintStatus('현재 문제 정보가 바뀌었어요. 진도를 다시 확인한 뒤 답을 제출해 주세요.','ng');
      renderProblem();return;
   }
   renderProblem();
   if(!me.pending){
     hintStatus('제출한 답: '+given+' · 오답 처리됐어요. 현재 설명과 사진을 다시 확인해 주세요. 남은 기회 '+(MAX_TRIES-me.tries)+'번.','ng');
     updateCooldownUI();
   }
 }catch(e){hintStatus('Firebase 저장 오류: '+e.message,'ng');}
 finally{submitting=false;}
}
async function nextProblem(){
  if(!serverVerified||firebaseState!=='online'){showConn();return;}
  if(!playerRef||!me||!me.pending||me.paused||me.coolUntil>serverNow())return;
  if(!isPendingPieceReady()){resultPieceStatus('지도 조각을 먼저 표시된 나라에 붙여 주세요.','ng');return;}
  if($('nextBtn'))$('nextBtn').disabled=true;
  try{
    const tx=await playerRef.transaction(current=>{
      if(!current||!current.pending||Number(current.coolUntil)>serverNow())return;
      if(!isPendingPieceReady(norm(current,me.id)))return;
      current.pending=null;current.tries=0;current.coolUntil=0;current.pausedElapsed=0;current.paused=false;current.startedAt=serverNow();current.t=serverNow();return current;
    });
    if(tx.committed&&tx.snapshot.exists()){me=norm(tx.snapshot.val(),me.id);closeResultDialog();renderProblem();}
    else {updateCooldownUI();resultPieceStatus('다음 문제로 넘어가지 못했어요. 조각 저장을 확인해 주세요.','ng');}
  }catch(e){hintStatus('다음 문제 저장 실패: '+e.message,'ng');if($('nextBtn'))$('nextBtn').disabled=false;}
}

  $('resumeNow').onclick=()=>loadStudent(me.name);
 }catch(e){if(btn)btn.disabled=false;hintStatus('진도 저장 실패: '+e.message,'ng');}

function liveNow(){return serverNow();}
function liveMembers(q){return Object.entries(q?.members||{}).map(([key,v])=>({key,...v}));}
function liveScores(q){
 return liveMembers(q).sort((a,b)=>(b.points||0)-(a.points||0)||(b.correct||0)-(a.correct||0)||
 (a.totalMs||0)-(b.totalMs||0)||(a.joinedAt||0)-(b.joinedAt||0));
}
function liveOrder(id){return stableShuffle(LIVE_QUIZ_IDS,'shared-memory-'+id);}
function liveProblem(q){return PROBLEMS[q?.order?.[q.round]??-1]||null;}
function liveClue(p){
 if(!p)return '';
 let result=p.q;
 const word=p.stage==='country'?'이 나라':p.stage==='city'?'이 장소':'이 자연환경';
 for(const v of [p.answer,...(p.aliases||[])].filter(Boolean).sort((a,b)=>b.length-a.length)){
   result=result.split(v).join(word);
 }
 return result;
}
function liveOptions(p,q){
 if(!p||!q)return [];
 const alt=[...new Set(PROBLEMS.filter(x=>x.stage===p.stage&&x.answer!==p.answer).map(x=>x.answer))];
 const options=[p.answer,...stableShuffle(alt,'choices-'+q.id+'-'+p.uid).slice(0,3)];
 return stableShuffle(options,'arrange-'+q.id+'-'+p.uid);
}
function liveRankingHtml(q,max=10){
 const data=liveScores(q).slice(0,max);
 if(!data.length)return '<p class="muted">참가한 학생이 없어요.</p>';
 return data.map((x,i)=>'<div class="liveRankingItem'+(me?.id===x.key?' liveRankingMe':'')+'"><span>'+(i<3?['🥇','🥈','🥉'][i]:(i+1)+'위')+
 '</span>'+(TEACHER?'<button type="button" class="nameBtn" data-live-member="'+esc(x.key)+'">'+esc(x.name||'학생')+'</button>':'<strong>'+esc(x.name||'학생')+'</strong>')+'<span>'+Number(x.points||0)+'점</span><span>'+Number(x.correct||0)+'개 정답</span></div>').join('');
}
function liveQuizOnline(){return !!(liveQuizRef&&db&&serverVerified&&firebaseState==='online');}
function liveSubscribe(){
 if(!db)return;
 if(liveQuizRef&&liveQuizListener)liveQuizRef.off('value',liveQuizListener);
 liveQuizRef=db.ref(liveQuizPath());
 liveQuizListener=s=>{
   liveQuiz=s.val();
   liveRenderAll();
   quizOnlyAutoJoin();
   liveTick();
 };
 liveQuizRef.on('value',liveQuizListener,e=>{
   const root=$(TEACHER?'liveTeacherPanel':'liveStudentPanel');
   if(root)root.innerHTML='<p class="msg ng">실시간 퀴즈 연결 실패: '+esc(e.message)+'</p>';
 });
 if(liveQuizTimer)clearInterval(liveQuizTimer);
 liveQuizTimer=setInterval(liveTick,250);
}
function liveTick(){
 const q=liveQuiz;
 if(!q)return;
 const now=liveNow();
 for(const id of ['liveCountStudent','liveCountTeacher']){
  const el=$(id);
  if(el)el.textContent=Math.ceil(Math.max(0,((q.status==='reveal'?q.revealEndsAt:q.endsAt)||now)-now)/1000)+'초';
 }
 const e=$('liveAnswerCounter');
 if(e)e.textContent=Object.keys(q.answers||{}).length+'/'+liveMembers(q).length+'명 답변';
 if(!liveQuizOnline()||liveQuizBusy)return;
 const all=liveMembers(q).length>0&&Object.keys(q.answers||{}).length>=liveMembers(q).length;
 if((q.status==='question'&&(now>=q.endsAt||all))||(q.status==='reveal'&&now>=q.revealEndsAt))liveAdvance();
}
async function liveAdvance(){
 if(liveQuizBusy||!liveQuizOnline())return;
 liveQuizBusy=true;
 try{
  await liveQuizRef.transaction(q=>{
   if(!q)return;
   const now=liveNow();
   if(q.status==='question'){
    const total=Object.keys(q.members||{}).length;
    const all=total>0&&Object.keys(q.answers||{}).length>=total;
    if(!all&&now<q.endsAt)return;
    q.status='reveal';q.revealEndsAt=now+LIVE_QUIZ_REVEAL;return q;
   }
   if(q.status==='reveal'&&now>=q.revealEndsAt){
    if(q.round+1>=q.order.length){q.status='finished';q.finishedAt=now;return q;}
    q.round++;q.status='question';q.startedAt=now;q.endsAt=now+LIVE_QUIZ_DURATION;
    q.answers={};return q;
   }
   return;
  },undefined,false);
 }catch(e){console.warn('퀴즈 라운드 진행 오류',e.message);}
 finally{liveQuizBusy=false;}
}
async function liveOpenLobby(){
 if(!TEACHER||!liveQuizOnline())return;
 if(liveQuiz&&['question','reveal'].includes(liveQuiz.status))return alert('진행 중인 게임은 종료한 뒤 새로 시작할 수 있어요.');
 if(liveQuiz?.status==='lobby')return;
 if(liveQuiz?.status==='finished'&&!confirm('기존 결과를 새 게임으로 바꾸고 대기실을 열까요?'))return;
 try{
  const id=String(liveNow());
  const tx=await liveQuizRef.transaction(q=>{
   if(q&&['question','reveal'].includes(q.status))return;
   return {id,status:'lobby',round:0,order:liveOrder(id),members:{},answers:{},
    createdAt:liveNow(),startedAt:0,endsAt:0,revealEndsAt:0};
  },undefined,false);
  if(!tx.committed)throw Error('다른 교사용 화면에서 게임이 진행 중이에요.');
 }catch(e){alert('대기실 생성 실패: '+e.message);}
}
async function liveJoinLobby(){
 if(!liveQuizOnline()||!me||me.cur<PROBLEMS.length||me.pending)return;
 try{
  const tx=await liveQuizRef.transaction(q=>{
   if(!q||q.status!=='lobby')return;
   q.members=q.members||{};
   if(!q.members[me.id])q.members[me.id]={name:me.name,joinedAt:liveNow(),points:0,correct:0,totalMs:0};
   return q;
  },undefined,false);
  if(!tx.committed)alert('대기실이 닫혔어요. 화면을 확인해 주세요.');
 }catch(e){alert('대기실 입장 실패: '+e.message);}
}
async function liveStartRound(){
 if(!TEACHER||!liveQuizOnline())return;
 try{
  const tx=await liveQuizRef.transaction(q=>{
   if(!q||q.status!=='lobby'||!Object.keys(q.members||{}).length)return;
   const now=liveNow();
   q.status='question';q.round=0;q.startedAt=now;q.endsAt=now+LIVE_QUIZ_DURATION;q.answers={};
   return q;
  },undefined,false);
  if(!tx.committed)alert('학생이 대기실에 한 명 이상 입장해야 시작할 수 있어요.');
 }catch(e){alert('시작 실패: '+e.message);}
}
async function liveSelect(choice){
 const current=liveQuiz;
 if(liveAnswerBusy||!liveQuizOnline()||!me||me.cur<PROBLEMS.length||
    !current||current.status!=='question'||!current.members?.[me.id]||current.answers?.[me.id])return;
 const question=liveProblem(current);
 if(!liveOptions(question,current).includes(choice))return;
 liveAnswerBusy=true;
 const panel=$('liveStudentPanel');if(panel)panel.classList.add('liveSubmitting');
 try{
  const id=current.id,round=current.round,key=me.id;
  const tx=await liveQuizRef.transaction(q=>{
   if(!q||q.id!==id||q.status!=='question'||q.round!==round||!q.members?.[key]||q.answers?.[key])return;
   const now=liveNow();if(now>=q.endsAt)return;
   const p=liveProblem(q);
   if(!liveOptions(p,q).includes(choice))return;
   const ms=Math.max(0,Math.min(LIVE_QUIZ_DURATION,now-q.startedAt));
   const correct=choice===p.answer;
   const points=correct?500+Math.round(500*(1-ms/LIVE_QUIZ_DURATION)):0;
   q.answers=q.answers||{};
   q.answers[key]={choice,correct,ms,points,at:now};
   q.members[key].points=Number(q.members[key].points||0)+points;
   q.members[key].correct=Number(q.members[key].correct||0)+(correct?1:0);
   q.members[key].totalMs=Number(q.members[key].totalMs||0)+ms;
   return q;
  },undefined,false);
  if(!tx.committed)alert('이미 선택했거나 15초가 지났어요.');
 }catch(e){alert('선택 저장 실패: '+e.message);}
 finally{liveAnswerBusy=false;if(panel)panel.classList.remove('liveSubmitting');}
}
function liveLoadPhoto(p){
 const img=$('livePhoto');if(!img||!p)return;
 const version=++livePhotoVersion;
 img.removeAttribute('src');img.style.display='none';
 const show=url=>{
  if(version!==livePhotoVersion||!$('livePhoto'))return;
  if(!url)return;
  const el=$('livePhoto');
  el.onerror=()=>{el.style.display='none';};
  el.src=url;el.style.display='block';
  if($('livePhotoPlaceholder'))$('livePhotoPlaceholder').style.display='none';
 };
 if(thumbnailCache[p.wiki])return show(thumbnailCache[p.wiki]);
 const api='https://en.wikipedia.org/w/api.php?action=query&redirects=1&prop=pageimages&format=json&pithumbsize=850&origin=*&titles='+encodeURIComponent(decodeURIComponent(p.wiki));
 fetch(api).then(r=>r.ok?r.json():Promise.reject(Error('image')))
 .then(data=>Object.values(data.query?.pages||{})[0]?.thumbnail?.source||'')
 .then(url=>{if(url)thumbnailCache[p.wiki]=url;show(url);}).catch(()=>{});
}

function exportCSV(){

  for(const p of ranked(lastAll)){
    const row=[p.name,p.score,p.done,PROBLEMS.length,p.timeSpent||0,p.pending?'결과 확인 중':(p.cur>=PROBLEMS.length?'완료':(p.cur+1)+'번 진행'),p.t?new Date(p.t).toLocaleString('ko-KR'):'',p.teacherAdjustments?.length||0,p.teacherSkipped?.length||0];
    for(const [i,q] of PROBLEMS.entries()){const l=p.log.find(x=>x.id===(q.uid||q.wiki));const ordinal=Array.isArray(p.questionOrder)?p.questionOrder.indexOf(i):i;row.push(l?(l.result==='correct'?`정답 ${l.score}점`:'3회 오답 0점'):(p.teacherSkipped||[]).includes(ordinal)?'교사 진도 복구(0점)':'미완료')}
    for(const q of PROBLEMS){const l=p.log.find(x=>x.id===(q.uid||q.wiki));row.push(l?l.attempts:'')}
    for(const q of PROBLEMS){const l=p.log.find(x=>x.id===(q.uid||q.wiki));row.push(l?new Date(l.at).toLocaleString('ko-KR'):'')}
    rows.push(row);
  }
  const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');

async function teacherProgressApply(){
 if(!TEACHER||firebaseState!=='online'||!db)return teacherMessage('서버 연결 상태에서만 수정할 수 있어요.',true);
 const key=selectedKey||Object.keys(lastAll)[0],student=lastAll[key]?migrateGameFormat(lastAll[key]):null;
 if(!student)return teacherMessage('학생을 먼저 선택해 주세요.',true);
 const to=Number($('teacherProgress')?.value);
 if(!Number.isInteger(to)||to<0||to>PROBLEMS.length)return teacherMessage('진도 선택이 잘못됐어요.',true);
 const from=Number(student.cur)||0;
 if(to===from)return teacherMessage('이미 해당 진도예요.',false);
 const alert=to<from?'뒤로 이동하면 이후 풀이 기록과 해당 점수를 정리합니다.':'앞으로 이동하면 건너뛴 문제는 점수 없이 처리됩니다.';
 if(!confirm(student.name+' 학생의 진도를 '+from+'문제 완료 → '+to+'문제 완료로 조정할까요?\n'+alert+'\n변경 전 기록 백업 파일을 저장합니다.'))return;
 teacherSaveBackup(key);
 const btn=$('teacherProgressApply');if(btn)btn.disabled=true;

   if(!raw)return;
   const x=norm(migrateGameFormat(raw),key),old=Number(x.cur)||0,now=serverNow();
   if(to<old){
     x.log=x.log.filter(l=>{const position=teacherStudentPosition(l.id,x);return position<0||position<to;});
     x.score=x.log.reduce((sum,l)=>sum+(Number(l.score)||0),0);
     x.timeSpent=x.log.reduce((sum,l)=>sum+(Number(l.seconds)||0),0);
     x.teacherSkipped=x.teacherSkipped.filter(i=>Number(i)<to);
   }else{
     const recorded=new Set(x.log.map(l=>teacherStudentPosition(l.id,x)));
     const skipped=new Set(x.teacherSkipped);
     for(let i=old;i<to;i++)if(!recorded.has(i))skipped.add(i);
     x.teacherSkipped=[...skipped].sort((a,b)=>a-b);
   }
   x.cur=to;x.done=to;x.pending=null;x.tries=0;x.coolUntil=0;

 }catch(e){teacherMessage('진도 복구 실패: '+e.message,true);}
 finally{if(btn)btn.disabled=false;}
}

        <input type="text" id="shareLink" aria-label="학생 실시간 연결 링크" readonly>
        <button class="btn mint" id="shareCopy" type="button">학생 연결 링크 복사</button>
        <p id="shareLinkMsg" class="muted" aria-live="polite"></p>
      </div>
      <div style="margin:14px 0"><button class="btn mint" id="csvBtn">CSV 내보내기</button><span class="smallPill" id="studentTotal">참여 0명</span></div>
      <div class="tableWrap"><table><thead><tr><th>순위</th><th>이름</th><th>점수</th><th>진도</th><th>현재 상태</th></tr></thead><tbody id="tbl"></tbody></table></div>
    </section><section class="card" id="detail"><h2>학생 상세</h2><p class="muted">학생을 선택해 주세요.</p></section>
  </main>`;
  $('csvBtn').onclick=exportCSV;
  $('liveTeacherPanel').onclick=e=>{
    const student=e.target.closest('[data-live-member]');
    if(student){teacherSelectedQuizMember=student.dataset.liveMember;liveRenderTeacher();}
  };
  $('teacherClassRoom').onchange=e=>changeClassRoom(e.target.value);
  $('customClassRoom').onclick=customClassRoom;
  const joinLink=classJoinLink();
  $('shareLink').value=joinLink;
  $('shareCopy').onclick=copyClassJoinLink;
  $('tbl').onclick=e=>{const button=e.target.closest('[data-key]');if(button){selectedKey=button.dataset.key;teacherDraftProgress=null;renderTeacherViews(lastAll)}};
  $('detail').onchange=e=>{if(e.target.id==='teacherProgress')teacherDraftProgress=Number(e.target.value);};
  $('detail').onclick=e=>{
    if(e.target.closest('#teacherProgressApply'))teacherProgressApply();
    else if(e.target.closest('#teacherDelete'))teacherDeleteStudent();
    else if(e.target.closest('#teacherBackup'))teacherSaveBackup(selectedKey);
    else if(e.target.closest('#teacherMoveButton'))teacherMoveStudent();
  };
  watchPlayers(renderTeacherViews);liveSubscribe();
}

/* Read-only reconstruction of a student's saved page, not remote screen capture. */
let teacherPreviewMap=null,teacherPreviewGeoPromise=null,teacherPreviewPhotoToken=0;
function teacherCurrentQuestion(p){
 if(!p)return null;
 const idx=p.pending&&Number.isInteger(p.pending.idx)?p.pending.idx:p.cur;
 return questionAt(idx,p)||null;
}
function teacherPreviewHtml(p){
 const q=teacherCurrentQuestion(p),pending=!!p.pending;
 const attempts=(p.wrongAttempts||[]).slice(-7).reverse();
 const status=p.cur>=PROBLEMS.length&&!pending?'모든 문제 완료':pending?'정답 확인 화면':(p.paused?'일시 정지':(p.cur+1)+'번 문제를 풀고 있어요');
 const time=p.lastSubmission?.at?new Date(p.lastSubmission.at).toLocaleTimeString('ko-KR'):'';
 const recent=p.lastSubmission?'<div class="teacherPreviewLast">최근 제출 · '+esc(p.lastSubmission.given)+' · '+(p.lastSubmission.correct?'정답':'오답')+' · '+esc(time)+'</div>':'<p class="muted">아직 제출한 답안이 없어요.</p>';
 const wrong=attempts.length?'<details class="teacherMistakeLog"><summary>오답 입력 기록 '+(p.wrongAttempts||[]).length+'건 확인</summary>'+
 attempts.map(a=>{
   const item=PROBLEMS.find(x=>(x.uid||x.wiki)===a.id);
   return '<div class="teacherMistakeRow">'+new Date(a.at).toLocaleTimeString('ko-KR')+
   ' · '+esc(item?.caption||'문제')+' · 입력 <strong>'+esc(a.given)+'</strong>'+
   ' · 당시 정답 <strong>'+esc(item?.answer||'미확인')+'</strong> · '+Number(a.attempt||0)+'번째 시도</div>';
 }).join('')+'</details>':'<p class="muted">이 기능을 반영한 뒤 오답 입력 기록이 저장되면 여기에 표시돼요. 과거의 입력 내용은 복원할 수 없어요.</p>';
 const stage=q?(q.stage==='country'?'나라 맞히기':q.stage==='city'?'랜드마크 맞히기':'자연환경 맞히기'):'탐험 완료';
 const preview=q?
   '<div class="teacherPreviewScreen"><div class="teacherPreviewBadge">'+esc(stage)+' · '+esc(status)+'</div>'+
   '<div class="teacherPreviewImage"><img id="teacherPreviewPhoto" alt="학생 현재 문항의 사진" style="display:none"><span id="teacherPreviewPhotoText">현재 문항 사진을 불러오는 중이에요</span></div>'+
   '<div class="teacherPreviewQuestion">'+esc(q.q)+'</div>'+
   '<p class="muted">'+(pending?'학생에게 정답 확인 화면이 표시돼요.':'남은 시도 횟수: '+Math.max(0,3-p.tries)+'회')+'</p>'+
   '<div id="teacherPreviewMap" class="teacherPreviewMap" aria-label="학생이 완성한 나라 지도"></div>'+
   '<p class="muted">색칠된 나라는 학생이 지금까지 얻은 퍼즐 조각이에요.</p></div>':
   '<p class="teacherPreviewBadge">나라·랜드마크·자연환경 학습 완료</p>';
 return '<section class="teacherCurrentPreview"><h3>학생이 보고 있는 학습 화면</h3>'+
   '<p class="muted">서버에 저장된 현재 문항·사진·지도·제출 결과를 재현해요. 학생 기기 자체를 화면 공유하는 건 아니며, 제출 전 작성 중인 글자는 보이지 않아요.</p>'+
   preview+recent+wrong+'</section>';
}
function teacherPreviewPhoto(p){
 const q=teacherCurrentQuestion(p),img=$('teacherPreviewPhoto'),label=$('teacherPreviewPhotoText');
 if(!q||!img)return;
 const token=++teacherPreviewPhotoToken;img.removeAttribute('src');img.style.display='none';if(label)label.style.display='';
 const draw=url=>{
   if(token!==teacherPreviewPhotoToken||!$('teacherPreviewPhoto'))return;
   if(!url){if($('teacherPreviewPhotoText'))$('teacherPreviewPhotoText').textContent='사진을 불러오지 못했어요. 문제 설명으로 확인할 수 있어요.';return;}
   const node=$('teacherPreviewPhoto');
   node.onerror=()=>{node.style.display='none';if($('teacherPreviewPhotoText'))$('teacherPreviewPhotoText').textContent='사진을 불러오지 못했어요.';};
   node.src=url;node.style.display='block';if($('teacherPreviewPhotoText'))$('teacherPreviewPhotoText').style.display='none';
 };
 if(thumbnailCache[q.wiki]){draw(thumbnailCache[q.wiki]);return;}
 fetch('https://en.wikipedia.org/w/api.php?action=query&redirects=1&prop=pageimages&format=json&pithumbsize=900&origin=*&titles='+encodeURIComponent(decodeURIComponent(q.wiki)))
 .then(r=>r.ok?r.json():Promise.reject(Error('사진 읽기 실패')))
 .then(data=>Object.values(data.query?.pages||{})[0]?.thumbnail?.source||'')
 .then(url=>{if(url)thumbnailCache[q.wiki]=url;draw(url);}).catch(()=>draw(''));
}
function teacherPreviewMapDraw(p){
 if(teacherPreviewMap){try{teacherPreviewMap.remove();}catch(e){}teacherPreviewMap=null;}
 const el=$('teacherPreviewMap');if(!el||!window.L)return;
 const locked=new Set(p.unlocked||[]);
 teacherPreviewMap=L.map(el,{zoomControl:false,attributionControl:false,scrollWheelZoom:false,
  doubleClickZoom:false,touchZoom:false,keyboard:false,dragging:false}).fitBounds([[-56,-168],[72,-34]]);
 const instance=teacherPreviewMap;
 if(!teacherPreviewGeoPromise)teacherPreviewGeoPromise=fetch(COUNTRY_GEO).then(r=>r.ok?r.json():Promise.reject(Error('지도 읽기 실패')));
 teacherPreviewGeoPromise.then(data=>{
  if(teacherPreviewMap!==instance||$('teacherPreviewMap')!==el)return;
  const aliases={'United States':'United States of America','Dominican Rep.':'Dominican Republic'};
  L.geoJSON(data,{style:f=>{
    const n=aliases[f.properties?.name]||f.properties?.name;
    const country=COUNTRIES.find(x=>x.en===n);
    return country&&locked.has(country.en)?
      {color:'#ffffff',weight:1.4,fillColor:country.color,fillOpacity:0.95}:
      {color:'#aabbd1',weight:0.7,fillColor:'#e7ecf6',fillOpacity:0.95};
  }}).addTo(instance);
  for(const country of COUNTRIES.filter(x=>locked.has(x.en))){
    L.marker([country.labelLat,country.labelLng],{interactive:false,icon:L.divIcon({
      className:'teacherPreviewCountryLabel',html:'<span>'+esc(country.ko)+'</span>',iconSize:[90,22],iconAnchor:[45,11]
    })}).addTo(instance);
  }
  instance.invalidateSize();
 }).catch(()=>{if($('teacherPreviewMap')===el)el.textContent='지도 경계를 불러오지 못했어요.';});
}
function teacherPreviewInit(p){
 teacherPreviewPhoto(p);
 teacherPreviewMapDraw(p);
}

function renderTeacherViews(all){
  const list=ranked(all);$('studentTotal').textContent='참여 '+list.length+'명'+(firebaseState==='offline'?' · 이 브라우저 기록만':'');
  $('tbl').innerHTML=list.length?list.map((p,i)=>{
    const status=p.pending?'결과 확인 중':p.cur>=PROBLEMS.length?'완료 🎉':(p.cur+1)+'번 진행';
    return `<tr><td>${i+1}</td><td><button class="nameBtn" data-key="${esc(p.id)}">${esc(p.name)}</button></td><td>${p.score}점</td><td>${p.done}/${PROBLEMS.length}</td><td>${status}</td></tr>`;
  }).join(''):'<tr><td colspan="5">아직 참여한 학생이 없어요.</td></tr>';
  const p=list.find(x=>x.id===selectedKey)||list[0];
  if(p)selectedKey=p.id;
  if(!p){$('detail').innerHTML='<h2>🔎 학생 상세</h2><p class="muted">아직 학생 기록이 없어요.</p>';return;}
  const cur=questionAt(p.cur,p);
  $('detail').innerHTML=`<h2>${esc(p.name)}</h2><div class="smallPill">${iconArt('star')} ${p.score}점</div><div class="smallPill">${iconArt('map')} ${p.done}/${PROBLEMS.length} 완료</div>
    <p><b>현재 상태</b> ${p.pending?'결과 확인 중':(cur?esc(cur.caption):'모두 완료')}</p>
    <p class="muted">마지막 활동: ${p.t?new Date(p.t).toLocaleString('ko-KR'):'없음'}</p>
    ${teacherPreviewHtml(p)}<h3>📒 문제별 제출 기록</h3><div>${p.log.length?p.log.map((l,i)=>`<div class="rankItem">${i+1}. ${esc(l.q)} · ${l.result==='correct'?`✅ 정답 ${l.score}점`:'⭕ 3회 오답 0점'} · ${l.attempts}회 · ${new Date(l.at).toLocaleTimeString('ko-KR')}</div>`).join(''):'<p class="muted">아직 푼 문제가 없어요.</p>'}</div><section id="teacherControls" class="teacherControls"></section>`;
  teacherRenderControls(p);
  teacherPreviewInit(p);
}
async function start(){
  readClassLink();
  serverVerified=false;renderHdr();
  const connected=await initFirebase();
  if(!connected){renderServerGate('Firebase 설정이 없거나 연결에 실패했어요.');return;}
  try{await verifyServerConnection();}catch(e){serverVerified=false;firebaseState='offline';renderServerGate(e.message);return;}
  if(TEACHER){renderTeacher();return;}
  if(QUIZ_ONLY){quizOnlyStart();return;}
  const lastName=store.get('amap-name-'+ROOM);
  if(lastName){await loadStudent(lastName);}else renderJoin();
}
start().catch(e=>{console.error(e);firebaseState='offline';app.innerHTML='<div class="joinWrap"><section class="card"><h2>연결 오류</h2><p>'+esc(e.message)+'</p></section></div>';renderHdr();});

</script>
