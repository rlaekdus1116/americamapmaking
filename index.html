<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아메리카 지도 만들기 v3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#fdf6f0;--ink:#4a4458;--pink:#f8d7e3;--mint:#d4f0e6;--lav:#e4dcf7;--yel:#fff1c1;--blue:#d6e9fb;--line:#e8dfe6;--red:#c0576d;--green:#2e8b6b}
*{box-sizing:border-box}body{margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:13px 18px;background:var(--pink)}
h1{font-size:20px;margin:0}#hdr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:#fff;border-radius:999px;padding:5px 12px;font-size:14px}
main{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr);gap:14px;padding:14px;max-width:1400px;margin:auto}
@media(max-width:850px){main{grid-template-columns:1fr;padding:10px}}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 8px #0001;min-width:0}
#photo{position:relative;width:100%;height:245px;border-radius:14px;background:var(--lav);overflow:hidden}
#img{width:100%;height:100%;object-fit:cover;display:block}#cap{position:absolute;left:0;bottom:0;right:0;padding:8px 11px;background:#0008;color:#fff;font-size:14px}
#photoCredit{font-size:11px;color:#81798a;margin:6px 2px 10px}#photoCredit a{color:inherit}
#map{height:520px;border-radius:16px;overflow:hidden}@media(max-width:850px){#map{height:440px}}
.btn{border:0;border-radius:12px;padding:10px 16px;font-size:15px;background:var(--mint);color:var(--ink);cursor:pointer}
.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#f0ebf3}
input{font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);width:100%}
.msg{min-height:24px;font-weight:650;margin:9px 0;color:var(--ink);line-height:1.5}.msg.ok{color:var(--green)}.msg.ng{color:var(--red)}
.bar{height:12px;background:#eee;border-radius:99px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--mint));transition:width .35s}
.pieces{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.piece{padding:6px 10px;border-radius:10px;background:var(--line);font-size:13px;color:#aaa}.piece.on{color:var(--ink);font-weight:650}
.fact{background:var(--blue);border-radius:14px;padding:12px;margin-top:10px;line-height:1.65}.fact[hidden]{display:none}
.wait{display:none;background:var(--yel);border-radius:10px;padding:9px 12px;font-weight:700;text-align:center;margin:8px 0}
.attempts{font-size:13px;color:#756d80;margin:5px 0}.taskhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0 2px}.taskhead small{color:#81798a}
#qtext{font-size:17px;font-weight:700;line-height:1.55;margin:8px 0}#rank div{padding:6px 8px;font-size:14px;border-radius:8px}#rank .mine{font-weight:750;background:var(--yel)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-weight:700}
.muted{color:#81798a;font-size:13px;line-height:1.5}.nameBtn{background:none;border:0;color:var(--ink);text-decoration:underline dotted;cursor:pointer;font:inherit;padding:0}
#teacherActions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.logrow{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<header><h1>🗺️ 아메리카 지도 만들기 <span style="font-size:12px;font-weight:500">v3 · 약 35분</span></h1><div id="hdr"></div></header>
<div id="app"></div>
<script>
/* americamapmaking 전용 Firebase */
const FIREBASE_CONFIG = {
  authDomain:"americamapmaking.firebaseapp.com",
  databaseURL:"https://americamapmaking-default-rtdb.firebaseio.com",
  projectId:"americamapmaking",
  storageBucket:"americamapmaking.firebasestorage.app",
  messagingSenderId:"260167025585",
  appId:"1:260167025585:web:6cc4c97234bbd5a04f7390",
  measurementId:"G-29RE67B58S"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database();
const params=new URLSearchParams(location.search);
const ROOM=params.get("room")||"demo";
const TEACHER=params.get("mode")==="teacher"||params.get("t")==="1";
const roomKey=encodeURIComponent(ROOM).replace(/\./g,"%2E");
const playersPath="rooms/"+roomKey+"/players";
const playersRef=db.ref(playersPath);
const $=id=>document.getElementById(id);
let serverOffset=0,me=null,playerRef=null,map=null,geo=null,pickMarker=null,targetMarker=null,countdownTimer=null;
let lastAll={},playerListener=null,renderedState="",submitting=false;
db.ref(".info/serverTimeOffset").on("value",s=>{serverOffset=s.val()||0;});
const serverNow=()=>Date.now()+serverOffset;

const PROBLEMS=[{"id":"statue-liberty","caption":"뉴욕 항구의 횃불 든 동상","q":"뉴욕 항구의 작은 섬에 세워진, 프랑스가 미국에 선물한 거대한 동상을 찾아보세요.","wiki":"Statue_of_Liberty","lat":40.6892,"lng":-74.0445,"tol":0.8,"country":"United States of America","answerName":"자유의 여신상","fact":"자유의 여신상은 프랑스가 미국 독립 100주년을 기념해 선물한 조각상으로 1886년에 공개되었어요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Front_view_of_Statue_of_Liberty_%28cropped%29.jpg/900px-Front_view_of_Statue_of_Liberty_%28cropped%29.jpg","source":"https://en.wikipedia.org/wiki/Statue_of_Liberty","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"horseshoe-falls","caption":"국경을 가로지르는 말발굽 모양 폭포","q":"미국과 캐나다 국경의 나이아가라강에서 말발굽 모양으로 떨어지는 가장 큰 폭포를 찾아보세요.","wiki":"Niagara_Falls","lat":43.0799,"lng":-79.0747,"tol":0.9,"country":"Canada","answerName":"호스슈 폭포","fact":"나이아가라 폭포는 세 폭포로 이루어져 있고, 호스슈 폭포가 가장 큰 부분을 차지해요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/3Falls_Niagara.jpg/900px-3Falls_Niagara.jpg","source":"https://en.wikipedia.org/wiki/Niagara_Falls","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"white-house","caption":"미국 수도의 흰색 관저","q":"미국 대통령의 공식 관저이자 집무 공간인 흰색 건물을 찾아보세요.","wiki":"White_House","lat":38.89777778,"lng":-77.03638889,"tol":0.5,"country":"United States of America","answerName":"백악관","fact":"백악관은 워싱턴 D.C.의 펜실베이니아 애비뉴 1600번지에 있어요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/White_House_north_and_south_sides.jpg/900px-White_House_north_and_south_sides.jpg","source":"https://en.wikipedia.org/wiki/White_House","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"gateway-arch","caption":"강변의 은색 아치","q":"세인트루이스 미시시피강 서쪽 강변에 세워진 높고 가느다란 은색 아치 조형물을 찾아보세요.","wiki":"Gateway_Arch","lat":38.6247,"lng":-90.1848,"tol":0.5,"country":"United States of America","answerName":"게이트웨이 아치","fact":"게이트웨이 아치는 미국 서부 개척과 세인트루이스의 역사적 역할을 상징해요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/St_Louis_night_expblend_cropped.jpg/900px-St_Louis_night_expblend_cropped.jpg","source":"https://en.wikipedia.org/wiki/Gateway_Arch","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"mount-rushmore","caption":"바위산에 새겨진 네 얼굴","q":"사우스다코타주 블랙힐스의 화강암 절벽에 미국 대통령 네 명의 얼굴이 새겨진 기념물을 찾아보세요.","wiki":"Mount_Rushmore","lat":43.8791,"lng":-103.4591,"tol":0.8,"country":"United States of America","answerName":"러시모어산 대통령 조각","fact":"조지 워싱턴, 토머스 제퍼슨, 시어도어 루스벨트, 에이브러햄 링컨의 얼굴이 조각되어 있어요.","photo":"","source":"https://en.wikipedia.org/wiki/Mount_Rushmore","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"old-faithful","caption":"뜨거운 물기둥을 뿜는 간헐천","q":"옐로스톤 국립공원에서 비교적 일정한 간격으로 뜨거운 물을 분출하는 간헐천을 찾아보세요.","wiki":"Old_Faithful","lat":44.46047,"lng":-110.82814,"tol":0.8,"country":"United States of America","answerName":"올드 페이스풀 간헐천","fact":"올드 페이스풀은 비교적 규칙적인 간격으로 물과 수증기를 분출하는 원뿔형 간헐천이에요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Yellowstone_National_Park_%28WY%2C_USA%29%2C_Old_Faithful_Geyser_--_2022_--_2599.jpg/900px-Yellowstone_National_Park_%28WY%2C_USA%29%2C_Old_Faithful_Geyser_--_2022_--_2599.jpg","source":"https://en.wikipedia.org/wiki/Old_Faithful","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"mather-point","caption":"깊은 협곡을 내려다보는 전망대","q":"그랜드캐니언 사우스림에서 협곡을 내려다볼 수 있는 대표 전망 지점을 찾아보세요.","wiki":"Mather_Point","lat":36.0616497,"lng":-112.1079463,"tol":0.6,"country":"United States of America","answerName":"매더 포인트","fact":"매더 포인트는 그랜드캐니언 사우스림의 대표 전망 지점이에요.","photo":"","source":"https://en.wikipedia.org/wiki/Mather_Point","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"golden-gate","caption":"바다 위 주홍빛 현수교","q":"샌프란시스코만 입구를 가로지르는 주홍빛 현수교의 남쪽 주탑 위치를 찾아보세요.","wiki":"Golden_Gate_Bridge","lat":37.81972222,"lng":-122.47861111,"tol":0.5,"country":"United States of America","answerName":"골든게이트교 남쪽 주탑","fact":"골든게이트교는 샌프란시스코와 마린 카운티를 연결하는 현수교예요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Golden_Gate_Bridge_as_seen_from_Battery_East.jpg/900px-Golden_Gate_Bridge_as_seen_from_Battery_East.jpg","source":"https://en.wikipedia.org/wiki/Golden_Gate_Bridge","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"space-needle","caption":"접시 모양 전망대가 있는 탑","q":"시애틀 세계박람회를 위해 만들어진 접시 모양 전망대가 있는 탑을 찾아보세요.","wiki":"Space_Needle","lat":47.6204,"lng":-122.3491,"tol":0.5,"country":"United States of America","answerName":"스페이스 니들","fact":"스페이스 니들은 1962년 시애틀 세계박람회를 위해 세워진 전망탑이에요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Space_Needle_2011-07-04.jpg/900px-Space_Needle_2011-07-04.jpg","source":"https://en.wikipedia.org/wiki/Space_Needle","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"cn-tower","caption":"토론토 도심의 높은 통신탑","q":"캐나다 토론토 도심에 우뚝 솟아 있는 통신·전망용 탑을 찾아보세요.","wiki":"CN_Tower","lat":43.64255556,"lng":-79.38708333,"tol":0.5,"country":"Canada","answerName":"CN 타워","fact":"CN 타워는 토론토를 대표하는 랜드마크이자 통신·전망용 탑이에요.","photo":"","source":"https://en.wikipedia.org/wiki/CN_Tower","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"chichen-itza","caption":"마야 문명의 계단식 피라미드","q":"유카탄반도의 마야 유적 도시에서 네 면에 계단이 있고 꼭대기에 신전이 있는 대표 피라미드를 찾아보세요.","wiki":"Chichen_Itza","lat":20.68305556,"lng":-88.56861111,"tol":0.5,"country":"Mexico","answerName":"치첸이트사 엘 카스티요","fact":"엘 카스티요는 쿠쿨칸 신과 관련된 계단식 피라미드예요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Chichen_Itza_3.jpg/900px-Chichen_Itza_3.jpg","source":"https://en.wikipedia.org/wiki/Chichen_Itza","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"pyramid-sun","caption":"고대 도시의 거대한 피라미드","q":"멕시코시티 북동쪽 고대 도시에서 가장 큰 계단식 피라미드를 찾아보세요.","wiki":"Pyramid_of_the_Sun","lat":19.6925,"lng":-98.84388889,"tol":0.5,"country":"Mexico","answerName":"테오티우아칸 태양의 피라미드","fact":"태양의 피라미드는 테오티우아칸에서 가장 큰 건축물 가운데 하나예요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/ZA77_Teotihuac%C3%A1n_edo_de_mex_Herberto_de_la_rosa.jpg/900px-ZA77_Teotihuac%C3%A1n_edo_de_mex_Herberto_de_la_rosa.jpg","source":"https://en.wikipedia.org/wiki/Pyramid_of_the_Sun","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"tulum-castle","caption":"바다 절벽 위 마야 건축물","q":"카리브해가 내려다보이는 석회암 절벽 위에 세워진 마야 해안 도시의 성채를 찾아보세요.","wiki":"Tulum_(archaeological_site)","lat":20.2149,"lng":-87.429,"tol":0.5,"country":"Mexico","answerName":"툴룸 엘 카스티요","fact":"툴룸은 마야 문명의 해안 도시였고, 엘 카스티요는 절벽 위에 자리해 있어요.","photo":"","source":"https://en.wikipedia.org/wiki/Tulum_(archaeological_site)","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"temple-inscriptions","caption":"밀림 속 계단식 석조 신전","q":"치아파스주의 밀림 속 마야 도시에서 왕의 무덤과 관련된 계단식 신전을 찾아보세요.","wiki":"Temple_of_the_Inscriptions","lat":17.4842,"lng":-92.0464,"tol":0.5,"country":"Mexico","answerName":"팔렝케 비문의 신전","fact":"비문의 신전은 팔렝케의 대표 건축물로 파칼 왕의 무덤과 관련되어 있어요.","photo":"","source":"https://en.wikipedia.org/wiki/Temple_of_the_Inscriptions","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"havana-capitol","caption":"거대한 돔이 있는 수도의 건물","q":"쿠바 수도 중심부에 있는 거대한 돔과 기둥이 특징인 건물을 찾아보세요.","wiki":"National_Capitol_of_Cuba","lat":23.13528,"lng":-82.35944,"tol":0.5,"country":"Cuba","answerName":"아바나 국회의사당(엘 카피톨리오)","fact":"엘 카피톨리오는 1929년에 완공된 아바나의 대표 건축물이에요.","photo":"","source":"https://en.wikipedia.org/wiki/National_Capitol_of_Cuba","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"blue-hole","caption":"산호초 한가운데의 파란 원형 구멍","q":"벨리즈 앞바다 산호초에 있는 지름 약 300m의 원형 해양 싱크홀을 찾아보세요.","wiki":"Great_Blue_Hole","lat":17.31527778,"lng":-87.53444444,"tol":0.8,"country":"Belize","answerName":"그레이트 블루 홀","fact":"그레이트 블루 홀은 폭 약 318m의 원형 해양 싱크홀로 라이트하우스 리프에 있어요.","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Great_Blue_Hole.jpg/900px-Great_Blue_Hole.jpg","source":"https://en.wikipedia.org/wiki/Great_Blue_Hole","credit":"사진 자료: Wikipedia / Wikimedia Commons"},{"id":"miraflores-locks","caption":"배가 수위를 바꾸는 운하 갑문","q":"파나마 운하의 태평양 쪽에서 배가 갑문을 통과하며 수위를 바꾸는 시설을 찾아보세요.","wiki":"Miraflores_Locks","lat":8.9941,"lng":-79.5908,"tol":0.5,"country":"Panama","answerName":"미라플로레스 갑문","fact":"미라플로레스 갑문은 파나마 운하의 태평양 쪽 갑문 시설이에요.","photo":"","source":"https://en.wikipedi function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function km(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,da=r(c-a),dbb=r(d-b),h=Math.sin(da/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dbb/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function nameKey(name){return encodeURIComponent(name.trim().toLocaleLowerCase("ko-KR")).replace(/\./g,"%2E");}
function refForName(name){return db.ref(playersPath+"/"+nameKey(name));}
function normalize(p,key,name){
 p=p||{};return {id:key||p.id||"",name:p.name||name||"",score:Number(p.score)||0,done:Number(p.done)||0,cur:Number(p.cur)||0,tries:Number(p.tries)||0,lockUntil:Number(p.lockUntil)||0,unlocked:Array.isArray(p.unlocked)?p.unlocked:[],log:Array.isArray(p.log)?p.log:[],pending:p.pending||null,lastGuess:p.lastGuess||null,t:Number(p.t)||serverNow(),createdAt:Number(p.createdAt)||serverNow()};
}
function setMsg(text,cls){if(!$("msg"))return;$("msg").textContent=text;$("msg").className="msg "+(cls||"");}
function stateSig(p){return [p.cur,p.tries,p.lockUntil,p.pending?p.pending.outcome+":"+p.pending.qIndex:"none",p.done].join("|");}
function ranked(all){return Object.keys(all||{}).map(k=>normalize(all[k],k)).sort((a,b)=>(b.score-a.score)||(b.done-a.done)||(b.t-a.t));}
function watchPlayers(cb){
 playersRef.off("value");
 playersRef.on("value",s=>{lastAll=s.val()||{};cb(lastAll);},err=>{const el=$("rank")||$("teacherTable");if(el)el.textContent="Firebase 읽기 오류: "+err.message+" · Realtime Database 규칙을 확인해 주세요.";});
}
function renderHdr(){
 if(TEACHER){$("hdr").innerHTML='<span class="chip">교사용 · 방 코드: '+esc(ROOM)+'</span>';return;}
 if(!me)return;
 $("hdr").innerHTML='<span class="chip">👤 '+esc(me.name)+'</span><span class="chip">⭐ '+me.score+'점</span><span class="chip">🧩 '+me.unlocked.length+'/'+COUNTRIES.length+'</span><button class="btn secondary" id="changeName" style="padding:6px 10px;font-size:12px">이름 변경</button>';
 $("changeName").onclick=()=>{try{localStorage.removeItem("amap-name-"+ROOM);}catch(e){}if(playerRef)playerRef.off("value");me=null;renderJoin();};
}
function renderRank(all){
 const list=ranked(all).slice(0,10);
 $("rank").innerHTML=list.length?list.map((p,i)=>'<div class="'+(p.id===me.id?"mine":"")+'">'+(i+1)+"등 "+esc(p.name)+" — "+p.score+"점 ("+p.done+"/"+PROBLEMS.length+")</div>").join(""):"아직 참여한 학생이 없어요.";
}
function styleFor(f){
 const c=COUNTRIES.find(x=>x.en===f.properties.name),on=c&&me&&me.unlocked.indexOf(c.en)>=0;
 return on?{fillColor:c.color,fillOpacity:.82,color:"#b9a9cf",weight:1}:{fillColor:"#fff",fillOpacity:0,color:"#c9bfd6",weight:1};
}
function refreshPieces(){
 if(!$("pieces"))return;
 $("pieces").innerHTML=COUNTRIES.map(c=>{const on=me.unlocked.indexOf(c.en)>=0;return '<span class="piece '+(on?"on":"")+'" style="'+(on?"background:"+c.color:"")+'">'+(on?"🧩 ":"🔒 ")+c.ko+"</span>";}).join("");
 $("bar").style.width=(me.done/PROBLEMS.length*100)+"%";
 $("progressText").textContent=me.done+"/"+PROBLEMS.length+"개 장소 완료";
 if(geo)geo.setStyle(styleFor);renderHdr();
}
function clearMarkers(){if(pickMarker&&map){map.removeLayer(pickMarker);pickMarker=null;}if(targetMarker&&map){map.removeLayer(targetMarker);targetMarker=null;}}
function showTarget(p){
 if(targetMarker)map.removeLayer(targetMarker);
 targetMarker=L.circleMarker([p.lat,p.lng],{radius:11,color:"#23865f",weight:3,fillColor:"#7fd8b5",fillOpacity:.95}).addTo(map);
 targetMarker.bindPopup("정답 위치: "+p.caption);
 map.setView([p.lat,p.lng],Math.max(map.getZoom(),7));
}
const photoCache={};
function loadWikiPhoto(p,img){
 if(photoCache[p.wiki]){img.src=photoCache[p.wiki];return;}
 fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(p.wiki))
  .then(r=>{if(!r.ok)throw new Error("photo lookup failed");return r.json();})
  .then(d=>{
   const src=(d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source);
   if(!src)throw new Error("no article image");
   photoCache[p.wiki]=src;
   if(img.dataset.problemId===p.id)img.src=src;
  })
  .catch(()=>{if(img.dataset.problemId===p.id){img.style.display="none";$("cap").textContent=p.caption+" (사진을 불러오지 못했어요)";}});
}
function setQuestion(p,index){
 $("photo").style.display="block";$("img").style.display="block";$("img").alt=p.caption;
 const img=$("img");img.dataset.problemId=p.id;img.dataset.fallbackDone="0";
 img.onerror=function(){
  if(this.dataset.fallbackDone!=="1"){this.dataset.fallbackDone="1";loadWikiPhoto(p,this);}
  else{this.style.display="none";$("cap").textContent=p.caption+" (사진을 불러오지 못했어요)";}
 };
 if(p.photo)img.src=p.photo;else loadWikiPhoto(p,img);
 $("cap").textContent=p.caption;
 $("photoCredit").innerHTML='<a href="'+esc(p.source)+'" target="_blank" rel="noopener">'+esc(p.credit)+' · 사진 출처</a>';
 $("qtext").textContent=(index+1)+"번. "+p.q;
}
function enableNext(){if(!$("nextBtn"))return;$("nextBtn").disabled=false;$("nextBtn").textContent=me.cur>=PROBLEMS.length?"최종 결과 보기 →":"다음 문제 →";}
function startCountdown(){
 clearInterval(countdownTimer);
 const tick=()=>{
  const left=Math.max(0,Math.ceil((me.lockUntil-serverNow())/1000));
  if($("wait")){$("wait").style.display=left>0?"block":"none";$("wait").textContent=left>0?"다시 시도할 수 있을 때까지 "+left+"초":"대기 완료!";}
  if(left<=0){clearInterval(countdownTimer);if(me.pending&&me.pending.outcome==="missed")enableNext();else if(!me.pending)setMsg("대기 끝! 이제 다시 지도에 찍어 보세요.","ok");}
 };
 tick();countdownTimer=setInterval(tick,250);
}
function renderProblem(){
 clearInterval(countdownTimer);clearMarkers();
 $("fact").hidden=true;$("nextBtn").hidden=true;$("wait").style.display="none";
 renderedState=stateSig(me);
 if(me.pending){renderPending();return;}
 if(me.cur>=PROBLEMS.length){finish();return;}
 const p=PROBLEMS[me.cur];setQuestion(p,me.cur);
 $("attempts").textContent="틀린 횟수 "+me.tries+"/3 · 남은 기회 "+(3-me.tries)+"회";
 setMsg(me.tries?"틀린 횟수만큼 대기한 뒤 다시 찍어 보세요.":"지도를 확대해서 장소를 정확하게 찍어 보세요.","");
 refreshPieces();if(me.lockUntil>serverNow())startCountdown();
}
function renderPending(){
 const r=me.pending,p=PROBLEMS[r.qIndex];if(!p){me.pending=null;renderProblem();return;}
 setQuestion(p,r.qIndex);$("attempts").textContent=r.outcome==="missed"?"시도 3/3 · 이번 문제 0점":"시도 "+r.attempts+"/3 · 획득 "+r.points+"점";
 const c=COUNTRIES.find(x=>x.en===p.country);
 $("fact").hidden=false;$("fact").innerHTML="<b>"+(c?esc(c.ko):"")+" 지도 조각을 얻었어요 🧩</b><br>"+esc(p.fact);
 showTarget(p);
 if(r.outcome==="missed"){
  setMsg("3번 모두 틀렸어요. 정답 위치를 공개했어요. 점수는 0점입니다.","ng");
  $("nextBtn").hidden=false;$("nextBtn").disabled=true;$("nextBtn").textContent="10초 대기 중...";
  if(me.lockUntil>serverNow())startCountdown();else enableNext();
 }else{
  setMsg("정답! 🎉 "+r.points+"점을 얻었어요.","ok");
  $("nextBtn").hidden=false;$("nextBtn").disabled=false;$("nextBtn").textContent=me.cur>=PROBLEMS.length?"최종 결과 보기 →":"다음 문제 →";
 }
 refreshPieces();
}
async function submitGuess(lat,lng){
 if(!playerRef||!me||submitting)return;
 const qIndex=me.cur,p=PROBLEMS[qIndex],distance=km(lat,lng,p.lat,p.lng);
 if(!p||me.pending||me.lockUntil>serverNow())return;
 submitting=true;setMsg("답을 확인하고 있어요...","");
 try{
  const result=await playerRef.transaction(current=>{
   if(!current)return;
   const x=normalize(current,me.id,me.name),now=serverNow();
   if(x.cur!==qIndex||x.pending||(x.lockUntil||0)>now||x.tries>=3)return;
   if(distance<=p.tol){
    const attemptNo=x.tries+1,points=attemptNo===1?2:1;
    x.score+=points;x.done++;x.cur++;
    if(x.unlocked.indexOf(p.country)<0)x.unlocked.push(p.country);
    x.log.push({id:p.id,caption:p.caption,attempts:attemptNo,result:"correct",points:points,at:now});
    x.pending={qIndex:qIndex,outcome:"correct",attempts:attemptNo,points:points};
    x.lockUntil=0;x.lastGuess=null;
   }else{
    x.tries++;x.lockUntil=now+10000;
    x.lastGuess={lat:lat,lng:lng,distanceKm:Math.round(distance*10)/10,at:now};
    if(x.tries>=3){
     x.done++;x.cur++;
     if(x.unlocked.indexOf(p.country)<0)x.unlocked.push(p.country);
     x.log.push({id:p.id,caption:p.caption,attempts:3,result:"missed",points:0,at:now});
     x.pending={qIndex:qIndex,outcome:"missed",attempts:3,points:0};
    }
   }
   x.t=now;return x;
  });
  if(result.committed){me=normalize(result.snapshot.val(),me.id,me.name);renderHdr();renderProblem();}
  else{
   const latest=result.snapshot&&result.snapshot.val();if(latest)me=normalize(latest,me.id,me.name);
   if(me.pending||me.cur!==qIndex)renderProblem();
   else if(me.lockUntil>serverNow()){setMsg("이 문제는 다른 탭에서 이미 시도했어요. 현재 진도를 불러왔습니다.","ng");startCountdown();}
   else setMsg("답을 처리하지 못했어요. 한 번 더 시도해 주세요.","ng");
  }
 }catch(err){setMsg("저장에 실패했어요. 인터넷 연결 또는 Firebase 규칙을 확인해 주세요.","ng");}
 finally{submitting=false;}
}
function onMapClick(e){
 if(!me||me.pending||submitting)return;
 if(me.lockUntil>serverNow()){startCountdown();return;}
 if(me.cur>=PROBLEMS.length)return;
 if(pickMarker)map.removeLayer(pickMarker);
 pickMarker=L.circleMarker(e.latlng,{radius:7,color:"#8e7cc3",weight:2,fillColor:"#c8b6f0",fillOpacity:.95}).addTo(map);
 const m=$("map");m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake");
 submitGuess(e.latlng.lat,e.latlng.lng);
}
async function nextProblem(){
 if(!playerRef||!me||!me.pending)return;
 if(me.lockUntil>serverNow()){startCountdown();return;}
 try{
  const result=await playerRef.transaction(current=>{
   if(!current||!current.pending||(current.lockUntil||0)>serverNow())return;
   current.pending=null;current.tries=0;current.lockUntil=0;current.lastGuess=null;current.t=serverNow();return current;
  });
  if(result.committed){me=normalize(result.snapshot.val(),me.id,me.name);renderProblem();}
  else{const latest=result.snapshot&&result.snapshot.val();if(latest)me=normalize(latest,me.id,me.name);renderProblem();}
 }catch(err){setMsg("진도 저장에 실패했어요. 다시 눌러 주세요.","ng");}
}
function finish(){
 clearMarkers();$("photo").style.display="none";$("photoCredit").style.display="none";
 $("qtext").textContent="🎉 아메리카 지도 만들기 완료!";
 $("attempts").textContent="최종 점수 "+me.score+"점 · "+me.done+"/"+PROBLEMS.length+"개 장소 완료";
 setMsg("모든 장소를 확인했어요. 완성한 나라 조각을 확인해 보세요.","ok");
 $("fact").hidden=false;$("fact").innerHTML="<b>수고했어요!</b><br>아메리카 대륙의 30개 장소를 모두 확인했습니다.";
 $("nextBtn").hidden=true;$("wait").style.display="none";refreshPieces();
}
function renderStudent(){
 if(map){map.remove();map=null;geo=null;}
 $("app").innerHTML='<main><section class="card">'+
 '<div id="photo"><img id="img" alt=""><span id="cap"></span></div><div id="photoCredit"></div>'+
 '<div class="taskhead"><b>아메리카 장소 찾기</b><small>총 '+PROBLEMS.length+'문제 · 약 35분</small></div><p id="qtext"></p>'+
 '<div class="attempts" id="attempts"></div><p class="msg" id="msg"></p><div class="wait" id="wait"></div>'+
 '<div class="bar"><div id="bar"></div></div><p class="muted" id="progressText" style="margin:7px 0 4px"></p>'+
 '<div class="pieces" id="pieces"></div><div class="fact" id="fact" hidden></div>'+
 '<button class="btn" id="nextBtn" hidden style="margin-top:10px">다음 문제 →</button></section>'+
 '<section class="card"><p class="muted" style="margin:0 0 8px">지도에서 위치를 찍어 보세요. 오답이면 10초 동안 기다려야 하며, 문제마다 기회는 3번입니다.</p>'+
 '<div id="map"></div><h3 style="margin:14px 0 6px">실시간 순위</h3><div id="rank"></div></section></main>';
 map=L.map("map",{minZoom:2,worldCopyJump:true}).fitBounds([[-56,-168],[72,-34]]);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 map.on("click",onMapClick);$("nextBtn").onclick=nextProblem;
 fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json").then(r=>{if(!r.ok)throw new Error("경계 요청 실패");return r.json();}).then(g=>{geo=L.geoJSON(g,{style:styleFor}).addTo(map);refreshPieces();}).catch(()=>setMsg("국가 경계를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.","ng"));
 watchPlayers(renderRank);
 if(playerRef){
  if(playerListener)playerRef.off("value",playerListener);
  playerListener=s=>{
   if(!s.exists())return;
   const remote=normalize(s.val(),me.id,me.name),sig=stateSig(remote);
   me=remote;renderHdr();
   if(sig!==renderedState)renderProblem();else refreshPieces();
  };
  playerRef.on("value",playerListener);
 }
 renderHdr();renderProblem();
}
async function loadStudent(name){
 name=String(name||"").trim().replace(/\s+/g," ");
 if(!name)return renderJoin("이름을 입력해 주세요.");
 playerRef=refForName(name);
 try{
  const init={name:name,score:0,done:0,cur:0,tries:0,lockUntil:0,unlocked:[],log:[],pending:null,lastGuess:null,t:serverNow(),createdAt:serverNow()};
  const tx=await playerRef.transaction(current=>current||init);
  if(!tx.snapshot.exists())throw new Error("학생 기록을 불러오지 못했어요.");
  me=normalize(tx.snapshot.val(),nameKey(name),name);
  try{localStorage.setItem("amap-name-"+ROOM,name);}catch(e){}
  renderStudent();
 }catch(err){renderJoin("Firebase 연결에 실패했어요: "+err.message);}
}
function renderJoin(errorText){
 $("app").innerHTML='<main><section class="card" style="grid-column:1/-1;max-width:440px;margin:35px auto">'+
 '<h2 style="margin-top:0">이름을 입력하고 시작해요</h2>'+
 '<p class="muted">같은 방에서 같은 이름으로 다시 들어오면 저장된 진도부터 이어서 풉니다.</p>'+
 '<input id="nm" maxlength="20" autocomplete="name" placeholder="예: 김민지">'+
 '<p class="msg ng" id="joinError">'+esc(errorText||"")+'</p><button class="btn" id="go" style="width:100%">시작하기</button></section></main>';
 $("go").onclick=()=>loadStudent($("nm").value);
 $("nm").onkeydown=e=>{if(e.key==="Enter")loadStudent($("nm").value);};
 $("nm").focus();
}
function csvCell(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}
function exportCSV(){
 const rows=[["이름","점수","완료 문제","전체 문제","현재 문제","현재 오답 횟수","마지막 활동 시각"]];
 for(const p of ranked(lastAll)){
  const cur=p.cur<PROBLEMS.length?PROBLEMS[p.cur].caption:"완료";
  rows.push([p.name,p.score,p.done,PROBLEMS.length,cur,p.tries,new Date(p.t).toLocaleString("ko-KR")]);
 }
 rows[0].push(...PROBLEMS.map((p,i)=>"문제"+(i+1)+" 결과"),...PROBLEMS.map((p,i)=>"문제"+(i+1)+" 시도"),...PROBLEMS.map((p,i)=>"문제"+(i+1)+" 제출 시각"));
 for(let i=1;i<rows.length;i++){
  const p=ranked(lastAll)[i-1],logs=p.log||[];
  for(const q of PROBLEMS){const l=logs.find(x=>x.id===q.id);rows[i].push(l?(l.result==="correct"?"정답 ("+l.points+"점)":"3회 오답 (0점)"):"미완료");}
  for(const q of PROBLEMS){const l=logs.find(x=>x.id===q.id);rows[i].push(l?l.attempts:"");}
  for(const q of PROBLEMS){const l=logs.find(x=>x.id===q.id);rows[i].push(l?new Date(l.at).toLocaleString("ko-KR"):"");}
 }
 const csv="\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
 const a=document.createElement("a");a.href=url;a.download="americamapmaking_"+ROOM+"_진도.csv";a.click();URL.revokeObjectURL(url);
}
function renderTeacher(){
 $("app").innerHTML='<main style="grid-template-columns:1fr"><section class="card">'+
 '<h2 style="margin-top:0">학생별 실시간 진도</h2><p class="muted">방 코드: '+esc(ROOM)+' · 같은 방에서 같은 이름은 하나의 기록으로 이어집니다.</p>'+
 '<div id="teacherActions"><button class="btn" id="csv">엑셀용 CSV 내려받기</button></div>'+
 '<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>이름</th><th>점수</th><th>진도</th><th>현재 문제</th><th>오답</th><th>마지막 활동</th></tr></thead><tbody id="teacherTable"></tbody></table></div>'+
 '<p class="muted">CSV 파일은 Excel에서 열 수 있습니다. 각 문제의 정답 여부, 시도 횟수, 제출 시각이 포함됩니다.</p></section></main>';
 $("csv").onclick=exportCSV;
 watchPlayers(all=>{
  const list=ranked(all);
  $("teacherTable").innerHTML=list.length?list.map((p,i)=>{
   const cur=p.cur<PROBLEMS.length?PROBLEMS[p.cur].caption:(p.pending?"결과 확인 중":"완료");
   return "<tr><td>"+(i+1)+"</td><td>"+esc(p.name)+"</td><td>"+p.score+"점</td><td>"+p.done+"/"+PROBLEMS.length+"</td><td>"+esc(cur)+"</td><td>"+p.tries+"/3</td><td>"+new Date(p.t).toLocaleTimeString("ko-KR")+"</td></tr>";
  }).join(""):'<tr><td colspan="7">아직 참여한 학생이 없습니다.</td></tr>';
 });
 renderHdr();
}
async function start(){
 if(TEACHER){renderTeacher();return;}
 let saved="";
 try{saved=localStorage.getItem("amap-name-"+ROOM)||"";}catch(e){}
 if(saved)await loadStudent(saved);else renderJoin("");
}
start().catch(err=>renderJoin("시작할 수 없어요: "+err.message));
</script>
