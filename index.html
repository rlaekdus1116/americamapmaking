<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아메리카 지도 만들기 · 30나라 퍼즐 + 17문항 탐험</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg1:#fff9fb; --bg2:#f7f5ff; --ink:#5a5068; --sub:#8a8099;
  --pink:#ffd8ea; --pink2:#ffe7f2; --mint:#dff7ee; --lav:#ece6ff; --yel:#fff5c8; --sky:#ddf0ff;
  --line:#eadff1; --good:#2d9d77; --bad:#d86482; --chip:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at top left,#fff 0, var(--bg1) 35%, var(--bg2) 100%)}
header{position:sticky;top:0;z-index:10;padding:14px 18px;background:rgba(255,250,253,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.headIn{max-width:1320px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}.titleBadge{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--lav)}
#hdr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);padding:7px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(128,108,156,.08);font-size:14px}
main{max-width:1320px;margin:18px auto;padding:0 14px;display:grid;grid-template-columns:420px 1fr;gap:16px}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 10px 30px rgba(131,111,156,.09)}
.card h2,.card h3{margin:0 0 10px}
#photoWrap{position:relative;background:linear-gradient(135deg,#f6eeff,#ecfbf6);border-radius:24px;overflow:hidden;height:260px;border:1px solid var(--line)}
#img{width:100%;height:100%;object-fit:cover;display:block}
#cap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.88);padding:10px 12px;border-radius:18px;font-size:14px;backdrop-filter:blur(8px)}
#photoCredit{font-size:12px;color:var(--sub);margin-top:8px;min-height:18px}
#photoCredit a{color:inherit}
#qbox{background:#fffaf0;border:1px dashed #eddca0;border-radius:22px;padding:14px;margin-top:14px}
#qtext{font-size:17px;line-height:1.55;font-weight:700}
.subline{font-size:13px;color:var(--sub);margin:8px 0 0}
.bar{height:14px;border-radius:999px;background:#f2eef6;overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#f7c5e0,#d8f1e7,#d8e6ff);transition:width .35s}
#pieces{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.piece{padding:8px 12px;border-radius:999px;background:#f5f1f8;border:1px solid var(--line);font-size:13px;color:#9f98aa}
.piece.on{color:var(--ink);font-weight:700;transform:translateY(-1px)}
.msg{min-height:25px;font-weight:700;margin:12px 0 0}.ok{color:var(--good)}.ng{color:var(--bad)}
.waitBox{display:none;margin-top:10px;background:var(--yel);border:1px solid #eedf9d;padding:12px;border-radius:18px;font-weight:700;text-align:center}
.fact{display:none;background:var(--sky);border:1px solid #c8e0f2;padding:14px;border-radius:20px;margin-top:12px;line-height:1.6}
.fact b{display:block;margin-bottom:6px}
.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:12px 18px;background:linear-gradient(180deg,#ffe4f0,#ffd2e5);color:var(--ink);font-weight:800;box-shadow:0 6px 0 #f2bfd7, 0 12px 24px rgba(242,191,215,.35)}
.btn:hover{transform:translateY(1px)} .btn:active{transform:translateY(2px)} .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 6px 0 #e5dbe0}
.btn.mint{background:linear-gradient(180deg,#e9fbf4,#d5f5e7);box-shadow:0 6px 0 #bce7d2, 0 12px 24px rgba(188,231,210,.35)}
input{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--line);border-radius:18px;outline:none;background:#fff}
input:focus{box-shadow:0 0 0 4px rgba(221,208,255,.4)}
#map{height:640px;border-radius:26px;border:1px solid var(--line);overflow:hidden}
@media(max-width:980px){#map{height:500px}}
.rankBox{margin-top:14px}
.rankItem{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:8px}
.rankItem.me{background:#fff8cb;font-weight:800}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px} th{font-size:13px;color:var(--sub);font-weight:700;text-align:left;padding:0 10px}
td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;font-size:14px}
td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px} td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
.nameBtn{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline dotted;cursor:pointer;padding:0}
.muted{color:var(--sub);font-size:13px;line-height:1.5}
.joinWrap{max-width:460px;margin:50px auto}
.shake{animation:shake .36s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.smallPill{display:inline-block;padding:6px 10px;border-radius:999px;background:#f5f1fb;border:1px solid var(--line);font-size:12px;margin-right:6px}
@media(max-width:980px){main[style*="grid-template-columns"]{grid-template-columns:1fr!important}}
#photoWrap{margin-top:14px}
#nextWrap{min-height:18px}
.btn.secondary{background:#f5f0fc;border:1px solid var(--line)}
</style>
<link rel="stylesheet" href="liquid-glass.css">

</head>
<body>
<header>
  <div class="headIn">
    <h1>아메리카 지도 만들기 <span class="titleBadge">나라 30 · 도시 8 · 자연 9</span></h1>
    <div id="hdr"></div>
  </div>
</header>
<div id="app"></div>
<script>
/* 아메리카 지도 만들기 / Firebase 연결 방식: Firebase Hosting 자동 초기화 URL.
   GitHub 소스에는 API 키를 직접 넣지 않습니다. */
const PROJECT_ID = 'americamapmaking';
const DATABASE_URL = 'https://americamapmaking-default-rtdb.firebaseio.com';
const COUNTRY_GEO = 'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json';
const params = new URLSearchParams(location.search);
const ROOM = params.get('room') || 'demo';
const TEACHER = params.get('mode') === 'teacher' || params.get('t') === '1';
const roomKey = encodeURIComponent(ROOM).replace(/\./g,'%2E');
const PLAYERS_PATH = 'rooms/' + roomKey + '/v8/players';
const $ = id => document.getElementById(id);
const app = $('app');
const localMem = {};
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return localMem[k]||null}},
  set(k,v){localMem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del(k){delete localMem[k];try{localStorage.removeItem(k)}catch(e){}}
};
let db = null, playersRef = null, playerRef = null, playerListener = null, playersListener = null;
let me = null, map = null, geo = null, pick = null, target = null, lastAll = {}, selectedKey = '';
let countdownTimer = null, photoNonce=0, serverOffset=0, renderedSig='', submitting=false, firebaseState='connecting';
const serverNow=()=>Date.now()+serverOffset;
const MAX_TRIES=3, COOLDOWN_MS=10000, COUNTRY_END=30, CITY_END=38;
let questionClock=null, labelLayer=null;
const phaseAt = i => i<COUNTRY_END?'country':i<CITY_END?'city':'nature';
const phaseName = i => i<COUNTRY_END?'1단계: 나라 퍼즐':i<CITY_END?'2단계: 도시·랜드마크':'3단계: 자연환경';
function secondsInQuestion(){return me?Math.max(0,Math.floor((serverNow()-(me.startedAt||serverNow()))/1000)):0;}
function updateClock(){
  const el=$('elapsedClock');if(!el||!me)return;
  const s=me.pending?Math.max(0,me.pending.seconds||0):secondsInQuestion();
  el.textContent='소요 시간 '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function armClock(){clearInterval(questionClock);updateClock();questionClock=setInterval(updateClock,1000);}
function totalTime(p){return Math.max(0,Number(p.timeSpent)||0);}
function iconArt(type){
  const icons={
    compass:'<circle cx="18" cy="18" r="13"/><path d="m24 12-5 9-9 4 4-9Z"/><path d="m16 18 4 2"/>',
    pin:'<path d="M18 32S6 21 6 15a12 12 0 1 1 24 0c0 6-12 17-12 17Z"/><circle cx="18" cy="15" r="4"/>',
    puzzle:'<path d="M4 5h10c-2-6 7-6 6 0h11v10c-5-1-5 7 0 6v10H20c1-5-7-5-6 0H4V21c5 1 5-7 0-6Z"/>',
    star:'<path d="m18 3 4.6 9.4L33 14l-7.5 7.4 1.8 10.5L18 27l-9.3 4.9 1.8-10.5L3 14l10.4-1.6Z"/>',
    clock:'<circle cx="18" cy="18" r="13"/><path d="M18 9v10l7 3"/>',
    book:'<path d="M5 7Q13 4 18 10q8-6 13-3v23q-8-3-13 3-5-6-13-3Z"/><path d="M18 10v23"/>',
    pen:'<path d="m6 26 17-18 5 5-17 18-8 2Z"/><path d="m20 11 5 5"/>'
  };
  return '<svg class="sketch-icon" width="24" height="24" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[type]||icons.compass)+'</svg>';
}


/* 문제는 나라별로 분산시키고, 실제 정답은 특정 건물/유적/지점 좌표로 한정합니다. */

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function km(a,b,c,d){const r=v=>v*Math.PI/180,da=r(c-a),db=r(d-b),h=Math.sin(da/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(db/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(h)));}
function normName(s){return String(s||'').trim().replace(/\s+/g,' ');}
function nameKey(n){return encodeURIComponent(normName(n).toLowerCase()).replace(/\./g,'%2E');}
function playerPath(name){return PLAYERS_PATH+'/'+nameKey(name);}
function fresh(name){return {id:nameKey(name),name:normName(name),score:0,done:0,cur:0,tries:0,coolUntil:0,log:[],unlocked:[],pending:null,t:serverNow(),createdAt:serverNow(),startedAt:serverNow(),timeSpent:0};}
function norm(p,key){p=p||{};return {id:key||p.id||'',name:p.name||'',score:Number(p.score)||0,done:Number(p.done)||0,cur:Number(p.cur)||0,tries:Number(p.tries)||0,coolUntil:Number(p.coolUntil)||0,log:Array.isArray(p.log)?p.log:[],unlocked:Array.isArray(p.unlocked)?p.unlocked:[],pending:p.pending||null,t:Number(p.t)||0,createdAt:Number(p.createdAt)||0,startedAt:Number(p.startedAt)||0,timeSpent:Number(p.timeSpent)||0};}
function sig(p){return [p.cur,p.tries,p.coolUntil,p.done,p.score,p.pending?String(p.pending.idx)+p.pending.mode:''].join('|');}
function ranked(all){return Object.keys(all||{}).map(k=>norm(all[k],k)).sort((a,b)=>(b.score-a.score)||(b.done-a.done)||(totalTime(a)-totalTime(b))||((a.t||0)-(b.t||0)));}
function hintStatus(text,cls=''){const el=$('msg');if(el){el.textContent=text;el.className='msg '+cls;}}
function showConn(){
  const el=$('conn');if(!el)return;
  if(firebaseState==='online'){el.textContent='실시간 저장';el.title='Firebase Realtime Database';}
  else if(firebaseState==='connecting'){el.textContent='서버 연결 중';}
  else {el.textContent='이 기기만 저장 · 실시간 공유 안 됨';el.title='Firebase 자동 연결에 실패해 로컬 모드로 실행 중입니다.';}
}
function loadScript(url){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');s.src=url;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('자동 설정 주소 불러오기 실패'));document.head.appendChild(s);
  });
}
async function initFirebase(){
  firebaseState='connecting';showConn();
  if(!window.firebase){firebaseState='offline';showConn();return false;}
  let app=firebase.apps.find(x=>x.options.projectId===PROJECT_ID);
  const savedKey=store.get('amap-firebase-key');
  if(!app&&savedKey){
    try{app=firebase.initializeApp({
      apiKey:savedKey,
      authDomain:'americamapmaking.firebaseapp.com',
      databaseURL:DATABASE_URL,
      projectId:PROJECT_ID,
      storageBucket:'americamapmaking.firebasestorage.app',
      messagingSenderId:'260167025585',
      appId:'1:260167025585:web:6cc4c97234bbd5a04f7390',
      measurementId:'G-29RE67B58S'
    });}catch(e){console.warn('Firebase local config error',e.message);}
  }
  if(!app){
    const origins=['https://americamapmaking.web.app','https://americamapmaking.firebaseapp.com'];
    for(const origin of origins){
      try{await loadScript(origin+'/__/firebase/init.js');app=firebase.apps.find(x=>x.options.projectId===PROJECT_ID);if(app)break;}catch(e){}
    }
  }
  if(!app){firebaseState='offline';showConn();return false;}
  try{
    if(app.options.projectId!==PROJECT_ID||app.options.databaseURL!==DATABASE_URL)throw Error('Firebase 프로젝트 정보가 맞지 않습니다');
    db=firebase.database(app);playersRef=db.ref(PLAYERS_PATH);
    db.ref('.info/serverTimeOffset').on('value',s=>{serverOffset=Number(s.val())||0;});
    db.ref('.info/connected').on('value',s=>{firebaseState=s.val()?'online':'connecting';showConn();});
    return true;
  }catch(e){console.warn('Firebase initialize failed',e.message);firebaseState='offline';db=null;showConn();return false;}
}

    store.set('amap-firebase-key',key);location.reload();
  };
  $('firebaseKeySubmit').onclick=connect;
  $('firebaseApiKey').onkeydown=e=>{if(e.key==='Enter')connect();};
}

function offlineDb(){
 const storage='amap-local-v8-'+ROOM, watchers=new Map();
 const read=()=>{try{return JSON.parse(store.get(storage)||'{}')}catch(e){return {}}};
 const makeSnap=v=>({val:()=>v,exists:()=>v!=null});
 const notify=()=>{const all=read();for(const [path,subs] of watchers){const v=path===PLAYERS_PATH?all:all[path.slice(PLAYERS_PATH.length+1)]||null;for(const cb of subs)cb(makeSnap(v));}};
 window.addEventListener('storage',e=>{if(e.key===storage)notify()});
 return {ref(path){return {
  on(event,cb){if(event!=='value')return;if(!watchers.has(path))watchers.set(path,new Set());watchers.get(path).add(cb);const all=read();cb(makeSnap(path===PLAYERS_PATH?all:all[path.slice(PLAYERS_PATH.length+1)]||null));},
  off(event,cb){if(!watchers.has(path))return;if(cb)watchers.get(path).delete(cb);else watchers.delete(path)},
  async transaction(update){const all=read(),key=path.slice(PLAYERS_PATH.length+1),old=all[key]||null,next=update(old);if(next===undefined)return {committed:false,snapshot:makeSnap(old)};all[key]=next;store.set(storage,JSON.stringify(all));notify();return {committed:true,snapshot:makeSnap(next)};}
 }}};
}
function watchPlayers(cb){
  if(!playersRef)return;
  if(playersListener)playersRef.off('value',playersListener);
  playersListener=s=>{lastAll=s.val()||{};cb(lastAll);};
  playersRef.on('value',playersListener,err=>{const node=$('rank')||$('tbl');if(node)node.textContent='Firebase 읽기 실패: '+err.message+' (데이터베이스 규칙을 확인해 주세요.)';});
}
function watchMe(){
  if(!playerRef)return;
  if(playerListener)playerRef.off('value',playerListener);
  playerListener=s=>{
    if(!s.exists())return;
    const next=norm(s.val(),me?.id);
    const changed=(!me)||sig(next)!==renderedSig;
    me=next;renderHdr();
    if(changed && map)renderProblem();else if(map)refreshPieces();
  };
  playerRef.on('value',playerListener,err=>{hintStatus('Firebase에서 진도를 읽지 못했어요: '+err.message,'ng');});
}

function onCountryFeature(f,layer){
 const raw=f.properties.name,alt={'The Bahamas':'Bahamas','United States':'United States of America','Dominican Rep.':'Dominican Republic'};
 const co=COUNTRIES.find(x=>x.en===raw||x.en===alt[raw]);if(!co)return;
 let enter=0;
 layer.on('mouseover',()=>{
  const thisEnter=++enter;
  if(!me||!me.unlocked.includes(co.en))return;
  const p=PROBLEMS.find(x=>x.stage==='country'&&x.country===co.en);if(!p)return;
  const show=url=>{
   if(thisEnter!==enter||!me||!me.unlocked.includes(co.en))return;
   layer.bindTooltip('<div class="country-hover">'+(url?'<img src="'+esc(url)+'" alt="">':'')+'<b>'+esc(co.ko)+'</b></div>',{className:'country-hover-tooltip',sticky:true,direction:'top'}).openTooltip();
  };

   .then(r=>r.json()).then(d=>{const u=Object.values(d.query?.pages||{})[0]?.thumbnail?.source||'';if(u)thumbnailCache[p.wiki]=u;show(u)}).catch(()=>show(''));
 });

}

function loadProblemPhoto(p){
 const nonce=++photoNonce,img=$('img'),cap=$('cap'),credit=$('photoCredit');
 img.style.display='none';img.removeAttribute('src');
 cap.textContent='사진을 보고 맞혀 보세요';
 credit.innerHTML=photoCredit(p,!!me?.pending);
 const loaded=url=>{
  if(nonce!==photoNonce)return;
  if(!url){img.style.display='none';credit.innerHTML=credit.innerHTML+' · 사진을 못 불러왔어요';return;}
  img.onerror=()=>{if(nonce===photoNonce)img.style.display='none'};
  img.src=url;img.style.display='block';
 };
 if(thumbnailCache[p.wiki])return loaded(thumbnailCache[p.wiki]);
 const api='https://en.wikipedia.org/w/api.php?action=query&redirects=1&prop=pageimages&format=json&pithumbsize=1800&origin=*&titles='+encodeURIComponent(decodeURIComponent(p.wiki));
 const summary='https://en.wikipedia.org/api/rest_v1/page/summary/'+p.wiki;
 fetch(api).then(r=>r.ok?r.json():Promise.reject())
  .then(d=>Object.values(d.query?.pages||{})[0]?.thumbnail?.source||'')
  .then(u=>u||fetch(summary).then(r=>r.json()).then(d=>d.thumbnail?.source||''))
  .then(url=>{if(url)thumbnailCache[p.wiki]=url;loaded(url)}).catch(()=>loaded(''));
}

function updateCooldownUI(){

    if(!me)return;const left=Math.max(0,Math.ceil(((me.coolUntil||0)-serverNow())/1000));
    const box=$('waitBox');if(box){box.style.display=left?'block':'none';box.textContent=left?`⏳ ${left}초 뒤에 다시 시도할 수 있어요`:'';}

function cleanAnswer(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[\s\-_.·()]/g,'');}
async function guessTyped(){
  if(!playerRef||!me||submitting||me.pending||me.cur>=PROBLEMS.length)return;
  if(me.coolUntil>serverNow()){updateCooldownUI();return;}
  const idx=me.cur,p=PROBLEMS[idx],given=$('answerInput').value.trim();
  if(!given){hintStatus('답을 입력해 주세요.','ng');return;}
  const correct=[p.answer,...(p.aliases||[])].some(s=>cleanAnswer(given)===cleanAnswer(s));
  submitting=true;hintStatus('답을 확인하고 있어요...');
  try{
    const tx=await playerRef.transaction(current=>{
      if(!current)return;
      const x=norm(current,me.id),now=serverNow();
      if(x.pending||x.cur!==idx||x.tries>=MAX_TRIES||x.coolUntil>now)return;
      if(correct){
        const attempt=x.tries+1;
        const seconds=Math.max(0,Math.round((now-(x.startedAt||now))/1000));
        const speed=Math.max(0,30-Math.floor(seconds/2));
        const points=(attempt===1?100:attempt===2?60:25)+speed;
        x.score+=points;x.done++;x.cur++;x.timeSpent+=seconds;
        if(p.stage==='country'&&!x.unlocked.includes(p.country))x.unlocked.push(p.country);
        x.log.push({id:p.uid||p.wiki,q:p.answer,result:'correct',attempts:attempt,score:points,seconds,at:now});
        x.pending={mode:'correct',idx,points,seconds};x.tries=0;x.coolUntil=0;
      }else{
        x.tries++;x.coolUntil=now+COOLDOWN_MS;
        if(x.tries>=MAX_TRIES){
          x.done++;x.cur++;
          if(p.stage==='country'&&!x.unlocked.includes(p.country))x.unlocked.push(p.country);
          const seconds=Math.max(0,Math.round((now-(x.startedAt||now))/1000));x.timeSpent+=seconds;
          x.log.push({id:p.uid||p.wiki,q:p.answer,result:'missed',attempts:3,score:0,seconds,at:now});
          x.pending={mode:'giveup',idx,points:0,seconds};x.tries=0;
        }
      }
      x.t=now;return x;
    });
    if(tx.snapshot.exists()){
      me=norm(tx.snapshot.val(),me.id);
      renderProblem();
      if(tx.committed&&!me.pending){hintStatus('아쉬워요! 남은 기회 '+(MAX_TRIES-me.tries)+'번. 10초 뒤 다시 입력하세요.','ng');updateCooldownUI();}
    }else hintStatus('저장에 실패했어요. Firebase 연결을 확인해 주세요.','ng');
  }catch(e){hintStatus('Firebase 저장 오류: '+e.message,'ng');}
  finally{submitting=false;}
}
async function nextProblem(){
  if(!playerRef||!me||!me.pending||me.coolUntil>serverNow())return;
  if($('nextBtn'))$('nextBtn').disabled=true;
  try{
    const tx=await playerRef.transaction(current=>{
      if(!current||!current.pending||Number(current.coolUntil)>serverNow())return;
      current.pending=null;current.tries=0;current.coolUntil=0;current.startedAt=serverNow();current.t=serverNow();return current;
    });
    if(tx.snapshot.exists()){me=norm(tx.snapshot.val(),me.id);renderProblem();}
  }catch(e){hintStatus('다음 문제 저장 실패: '+e.message,'ng');if($('nextBtn'))$('nextBtn').disabled=false;}
}

  $('qtext').addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('photoLightbox'))$('photoLightbox').hidden=true;}});

  fetch(COUNTRY_GEO).then(r=>{if(!r.ok)throw Error('country border');return r.json()}).then(g=>{if(!map)return;geo=L.geoJSON(g,{style:styleFor,onEachFeature:onCountryFeature}).addTo(map);refreshPieces();}).catch(()=>{if($('msg'))hintStatus('지도 경계를 불러오지 못했어요. 인터넷을 확인해 주세요.','ng');});
  watchPlayers(renderRank);watchMe();renderHdr();renderProblem();
}
async function loadStudent(name){
  name=normName(name);if(!name)return renderJoin('이름을 입력해 주세요.');
  if(!db)return renderJoin('아직 저장소 준비 중이에요.');
  if($('joinMsg'))$('joinMsg').textContent='진도를 찾고 있어요...';
  const key=nameKey(name),ref=db.ref(playerPath(name));
  try{
    const tx=await ref.transaction(current=>current||fresh(name));
    if(!tx.snapshot.exists())throw Error('진도 기록을 불러오지 못했어요');
    playerRef=ref;me=norm(tx.snapshot.val(),key);
    store.set('amap-name-'+ROOM,name);renderStudent();
  }catch(e){renderJoin('Firebase 읽기/쓰기 오류: '+e.message+' · 데이터베이스 규칙을 확인해 주세요.');}
}
function renderJoin(error=''){
  if(playerRef&&playerListener)playerRef.off('value',playerListener);playerRef=null;
  renderHdr();
  app.innerHTML=`<div class="joinWrap"><section class="card">
    <h2>${iconArt("pen")} 이름을 입력하고 시작해요</h2>
    <p class="muted">같은 방에서 같은 이름으로 돌아오면 저장된 진도부터 이어서 풀어요. 서버 연결 상태는 화면 상단에서 확인하세요.</p>
    <input id="nm" maxlength="18" autocomplete="name" placeholder="예: 김민지">
    <p class="msg ng" id="joinMsg">${esc(error)}</p><button class="btn" id="go">시작하기 ✨</button>
  </section></div>`;
  $('go').onclick=()=>loadStudent($('nm').value);
  $('nm').onkeydown=e=>{if(e.key==='Enter')loadStudent($('nm').value)};
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function exportCSV(){
  const rows=[['이름','점수','완료문제','전체문제','총 풀이초','현재상태','마지막 활동',...PROBLEMS.map((_,i)=>(i+1)+'번 결과'),...PROBLEMS.map((_,i)=>(i+1)+'번 시도'),...PROBLEMS.map((_,i)=>(i+1)+'번 제출 시각')]];
  for(const p of ranked(lastAll)){
    const row=[p.name,p.score,p.done,PROBLEMS.length,p.timeSpent||0,p.pending?'결과 확인 중':(p.cur>=PROBLEMS.length?'완료':(p.cur+1)+'번 진행'),p.t?new Date(p.t).toLocaleString('ko-KR'):''];
    for(const q of PROBLEMS){const l=p.log.find(x=>x.id===(q.uid||q.wiki));row.push(l?(l.result==='correct'?`정답 ${l.score}점`:'3회 오답 0점'):'미완료')}
    for(const q of PROBLEMS){const l=p.log.find(x=>x.id===(q.uid||q.wiki));row.push(l?l.attempts:'')}
    for(const q of PROBLEMS){const l=p.log.find(x=>x.id===(q.uid||q.wiki));row.push(l?new Date(l.at).toLocaleString('ko-KR'):'')}
    rows.push(row);
  }
  const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='아메리카_지도만들기_'+ROOM+'_학습기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function renderTeacher(){
  renderHdr();
  app.innerHTML=`<main style="grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr)">
    <section class="card"><div class="smallPill">${iconArt("book")} 교사용 관리</div><h2>우리 반 탐험 현황</h2>
      <p class="muted">학생 이름을 누르면 문제별 결과를 확인할 수 있어요.</p>
      <div style="margin:14px 0"><button class="btn mint" id="csvBtn">CSV 내보내기</button><span class="smallPill" id="studentTotal">참여 0명</span></div>
      <div class="tableWrap"><table><thead><tr><th>순위</th><th>이름</th><th>점수</th><th>진도</th><th>현재 상태</th></tr></thead><tbody id="tbl"></tbody></table></div>
    </section><section class="card" id="detail"><h2>학생 상세</h2><p class="muted">학생을 선택해 주세요.</p></section>
  </main>`;
  $('csvBtn').onclick=exportCSV;
  $('tbl').onclick=e=>{const button=e.target.closest('[data-key]');if(button){selectedKey=button.dataset.key;renderTeacherViews(lastAll)}};
  watchPlayers(renderTeacherViews);
}
function renderTeacherViews(all){
  const list=ranked(all);$('studentTotal').textContent='참여 '+list.length+'명'+(firebaseState==='offline'?' · 이 브라우저 기록만':'');
  $('tbl').innerHTML=list.length?list.map((p,i)=>{
    const status=p.pending?'결과 확인 중':p.cur>=PROBLEMS.length?'완료 🎉':(p.cur+1)+'번 진행';
    return `<tr><td>${i+1}</td><td><button class="nameBtn" data-key="${esc(p.id)}">${esc(p.name)}</button></td><td>${p.score}점</td><td>${p.done}/${PROBLEMS.length}</td><td>${status}</td></tr>`;
  }).join(''):'<tr><td colspan="5">아직 참여한 학생이 없어요.</td></tr>';
  const p=list.find(x=>x.id===selectedKey)||list[0];
  if(!p){$('detail').innerHTML='<h2>🔎 학생 상세</h2><p class="muted">아직 학생 기록이 없어요.</p>';return;}
  const cur=PROBLEMS[p.cur];
  $('detail').innerHTML=`<h2>${esc(p.name)}</h2><div class="smallPill">${iconArt('star')} ${p.score}점</div><div class="smallPill">${iconArt('map')} ${p.done}/${PROBLEMS.length} 완료</div>
    <p><b>현재 상태</b> ${p.pending?'결과 확인 중':(cur?esc(cur.caption):'모두 완료')}</p>
    <p class="muted">마지막 활동: ${p.t?new Date(p.t).toLocaleString('ko-KR'):'없음'}</p>
    <h3>📒 문제별 제출 기록</h3><div>${p.log.length?p.log.map((l,i)=>`<div class="rankItem">${i+1}. ${esc(l.q)} · ${l.result==='correct'?`✅ 정답 ${l.score}점`:'⭕ 3회 오답 0점'} · ${l.attempts}회 · ${new Date(l.at).toLocaleTimeString('ko-KR')}</div>`).join(''):'<p class="muted">아직 푼 문제가 없어요.</p>'}</div>`;
}
async function start(){
  renderHdr();
  const connected=await initFirebase();
  if(!connected){db=offlineDb();playersRef=db.ref(PLAYERS_PATH);firebaseState='offline';}
  if(TEACHER){renderTeacher();return;}
  const lastName=store.get('amap-name-'+ROOM);
  if(lastName){await loadStudent(lastName);}else renderJoin();
}
start().catch(e=>{console.error(e);firebaseState='offline';app.innerHTML='<div class="joinWrap"><section class="card"><h2>연결 오류</h2><p>'+esc(e.message)+'</p></section></div>';renderHdr();});

</script>
